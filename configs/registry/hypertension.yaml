# Parameter registry for hypertension (WS01-T03). Schema: configs/registry/registry.schema.json.
# Normative description: docs/formal/03-parameter-registry.md.
#
# Status: NOTHING IN THIS FILE HAS BEEN REVIEWED BY A CLINICIAN (ADR-020, ADR-043). Version 0.2.0
# (2026-10-08) replaces or adds values with literature-anchored proposals and design choices of
# WS01-T09, accepted by gab: each rationale says which, and the passages, citations and derivations are
# in docs/formal/parameter-literature-proposal.md. Entries without a WS01-T09 value keep the analisi
# value (analisi §4.1, §4.2, §4.6, §4.7), labelled "illustrative, unverified". Validation in this
# project is technical and pre-clinical. Names still under `unset:` await a value. Values chosen only
# for hand arithmetic (fixture registry F0, FIXTURE-ONLY, ADR-027) are deliberately absent from this file.
#
# Layout rules (checked by the WS01-T03 verification): an element of `entries:` starts with `  - name:`
# and has, at four-space indent and in this order, value, unit, rationale, source_ref, reviewed_by.
# Elements of `derived:` and `unset:` are written as one-line flow mappings so that the line counts
# of the entry keys stay equal to the number of entries.
registry_version: "0.2.0"
pathology: hypertension
review_status: unreviewed

# Names that are window parameters (offsets, look-backs, deadline offsets of temporal operators).
# The alignment rule (integer multiple of step_ms) applies to these names only.
window_parameters:
  - sched_window
  - hold_lookback
  - int_window
  - delta1
  - delta2

entries:
  - name: bp_band_low
    value: 110.0
    unit: mmHg
    rationale: "illustrative, unverified"
    source_ref: "analisi §4.1"
    reviewed_by: null
  - name: bp_band_high
    value: 140.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), NICE NG136 rec. 1.4.20 treatment target below 140/90 mmHg; a clinic target, not a per-reading ward limit; not clinically reviewed: illustrative, unverified"
    source_ref: "NICE NG136 Hypertension in adults (updated 2026-02-26), rec. 1.4.20; ESH 2023 guidelines (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bp_hold_threshold
    value: 100.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), nursing textbook example: withhold the dose if systolic pressure is below 100 mmHg; real hold orders vary by drug and patient; not clinically reviewed: illustrative, unverified"
    source_ref: "Ernstmeyer K, Christman E (eds.), Nursing Skills 2e, Open RN, 2023, section 15.3 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: hold_lookback
    value: 3600000.0
    unit: ms
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, a reading taken at the scheduled time is at most 60 min old at the latest dispense ISMP allows for a twice-daily dose; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part A, design argument from ISMP Acute Care Guidelines for Timely Administration of Scheduled Medications, 2011 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: dose_max_24h
    value: 2.0
    unit: dose
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), carvedilol twice daily (drug confirmed by gab 2026-10-08); not clinically reviewed: illustrative, unverified"
    source_ref: "FDA COREG (carvedilol) label, rev. 07/2023, section 2 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: dose_min_day_end
    value: 2.0
    unit: dose
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), carvedilol twice daily (drug confirmed by gab 2026-10-08); a dose withheld by the hold rule still violates this count (open point for WS01-T08); not clinically reviewed: illustrative, unverified"
    source_ref: "FDA COREG (carvedilol) label, rev. 07/2023, section 2 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: int_window
    value: 300000.0
    unit: ms
    rationale: "5 min of the integrity formula, converted to ms: illustrative, unverified"
    source_ref: "analisi §4.1"
    reviewed_by: null
  - name: delta1
    value: 3600000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), carvedilol effect within 30 min and peak 1 to 2 h after a dose; not clinically reviewed: illustrative, unverified"
    source_ref: "FDA COREG (carvedilol) label, rev. 07/2023, sections 2.3 and 14.3 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: delta2
    value: 7200000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), end of the label's peak-effect range (2 h); 3 h would be a design margin; not clinically reviewed: illustrative, unverified"
    source_ref: "FDA COREG (carvedilol) label, rev. 07/2023, sections 12.3 and 14.3 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bound_bp_lower
    value: 30.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), adult systolic measurement range of a ward vital-signs monitor (30 to 260 mmHg); the lab-demo cuff needs its own specification; not clinically reviewed: illustrative, unverified"
    source_ref: "Baxter (Hillrom) Welch Allyn Connex Spot Monitor specification sheet (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bound_bp_upper
    value: 260.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), adult systolic measurement range of a ward vital-signs monitor (30 to 260 mmHg); not clinically reviewed: illustrative, unverified"
    source_ref: "Baxter (Hillrom) Welch Allyn Connex Spot Monitor specification sheet (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_range
    value: 20.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), by analogy with the 20 mmHg systolic fall that defines orthostatic hypotension; not clinically reviewed: illustrative, unverified"
    source_ref: "Jordan J, Biaggioni I, Clin Auton Res 2023;33(6):609-611, quoting Freeman R et al. 2011 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_sched
    value: 1800000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), by analogy with the 30 min window for time-critical medications (doses, not measurements); not clinically reviewed: illustrative, unverified"
    source_ref: "ISMP Acute Care Guidelines for Timely Administration of Scheduled Medications, 2011 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_count
    value: 1.0
    unit: dose
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, one dose is the smallest deviation the counter can show (no grading of larger excesses); not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: priority_hold
    value: 1.0
    unit: "1"
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, strawman order, neither literature nor clinical; IEC 60601-1-8 gives a harm and onset classification procedure for a clinician; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C; IEC 60601-1-8 Table 1 (procedure only) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: priority_range
    value: 2.0
    unit: "1"
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, strawman order, neither literature nor clinical; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C; IEC 60601-1-8 Table 1 (procedure only) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: priority_sched
    value: 3.0
    unit: "1"
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, strawman order, neither literature nor clinical; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C; IEC 60601-1-8 Table 1 (procedure only) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: sched_window
    value: 3600000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), ISMP allows a twice-daily dose within 1 h before or after the scheduled time; applied to measurements by analogy; not clinically reviewed: illustrative, unverified"
    source_ref: "ISMP Acute Care Guidelines for Timely Administration of Scheduled Medications, 2011 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: delta_resp
    value: 7.5
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), carvedilol label dose-response figure; a single pre/post pair of readings has a difference SD of about 16.8 mmHg (open point for WS01-T08); not clinically reviewed: illustrative, unverified"
    source_ref: "FDA COREG (carvedilol) label, rev. 07/2023, section 14.3 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: cuff_inflation_min
    value: 15000.0
    unit: ms
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, lowest typical measurement time found in a device manual; manuals give the whole cycle, not the inflation alone; not clinically reviewed: illustrative, unverified"
    source_ref: "ZOLL X Series technical specifications, 2015 (WS01-T09 part C) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_hold
    value: 10.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), by analogy with the 10 mmHg systolic bands of NEWS2 (valid with a hold threshold of 100 mmHg); not clinically reviewed: illustrative, unverified"
    source_ref: "Royal College of Physicians, NEWS2 Chart 1, 2017 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_resp
    value: 10.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), by analogy with the 10 mmHg effect unit of blood-pressure-lowering trials (weak analogy); not clinically reviewed: illustrative, unverified"
    source_ref: "Ettehad D et al., Lancet 2016;387:957-967 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_sys
    value: 15000.0
    unit: ms
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, typical duration minus cuff_inflation_min, so that a typical reading has normalised robustness +1; needs device data; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: scale_int
    value: 300000.0
    unit: ms
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, equal to int_window: a witness at the dispense gives +1, one at the window edge 0; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: priority_count
    value: 1.0
    unit: "1"
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, strawman, neither literature nor clinical: a count excess next to the hold violation; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: priority_resp
    value: 3.0
    unit: "1"
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, strawman, neither literature nor clinical: a delayed response with the schedule class; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bound_inflation_ms_lower
    value: 0.0
    unit: ms
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, physical lower bound of a duration, used only for interval completion; not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part C (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bound_inflation_ms_upper
    value: 180000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), adult measurement time limit of 180 s of IEC 80601-2-30 as summarised by a test vendor (standard not opened), same value in a device manual; not clinically reviewed: illustrative, unverified"
    source_ref: "WhaleTeq application note on IEC 80601-2-30; ZOLL M Series NIBP manual, 2002 (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: bound_dose_count_lower
    value: 0.0
    unit: dose
    rationale: "design choice (WS01-T09 candidate, accepted by gab 2026-10-08), not literature, a count cannot be negative (definition); not clinically reviewed: illustrative, unverified"
    source_ref: "WS01-T09 part A (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: cuff_error_sd
    value: 8.0
    unit: mmHg
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), acceptance limit of the validation standard (SD of differences at most 8 mmHg), used as a conservative device model; VitalDB supplementary estimate in docs/formal/evidence/ws01-t09; not clinically reviewed: illustrative, unverified"
    source_ref: "Stergiou GS et al., AAMI/ESH/ISO collaboration statement, Hypertension 2018;71:368-374 (ISO 81060-2 criterion 1) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null
  - name: clock_skew_max_ms
    value: 1000.0
    unit: ms
    rationale: "literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), IHE Consistent Time median error under 1 s for synchronised nodes (bounds the median, not the maximum); BLE devices need measurement; not clinically reviewed: illustrative, unverified"
    source_ref: "IHE ITI Consistent Time profile (WS01-T09 part C) (detail: docs/formal/parameter-literature-proposal.md)"
    reviewed_by: null

# Computed by the loader from the formula; never free parameters (docs/formal/02-templates.md section 3.2).
# step_ms is the monitor step T_s, supplied by the monitor configuration and not stored in this file.
derived:
  - {name: max_latency_range, unit: ms, formula: "step_ms", template: range}
  - {name: max_latency_sched, unit: ms, formula: "sched_window + step_ms", template: sched}
  - {name: max_latency_hold, unit: ms, formula: "step_ms", template: hold}
  - {name: max_latency_count, unit: ms, formula: "step_ms", template: count}
  - {name: max_latency_resp, unit: ms, formula: "delta2 + step_ms", template: resp}
  - {name: max_latency_sys, unit: ms, formula: "step_ms", template: sys}
  - {name: max_latency_int, unit: ms, formula: "step_ms", template: int}

# Needed by a template or another consumer, no value yet. Asking the loader for one of these names
# raises UnsetParameterError. Each is to be set and reviewed by the clinician review (WS00-T07).
unset:
  - {parameter: priority_sys, unit: "1", required_by: [sys], note: "value to be set and reviewed by WS00-T07"}
  - {parameter: priority_int, unit: "1", required_by: [int], note: "value to be set and reviewed by WS00-T07"}
  - {parameter: bound_dose_count_upper, unit: dose, required_by: [count], note: "value to be set and reviewed by WS00-T07; see bound_dose_count_lower"}

# Clinician-approved ranges for per-patient values (docs/formal/03-parameter-registry.md section 5).
# No per-patient override is supported in version 0.1.0.
overrides: []
