# Fixture registry F0 (ADR-027, accepted by gab 2026-10-08): the test numbers of the F0 table of
# docs/plan/workstreams/WS01-formalization/README.md in the schema of configs/registry/registry.schema.json.
# It exists so that runs before the clinician review have a value for every name that a template needs.
#
# EVERY ROW IS FIXTURE-ONLY: arithmetic test numbers with no clinical meaning (some are the illustrative
# numbers of analisi §4.1, §4.2, §4.6, §4.7), `reviewed_by` null, never used for a reported result. The
# loader refuses this file unless `allow_fixture_only=True` is passed, and a manifest built with it must say
# `fixture_only`. It is NOT configs/registry/hypertension.yaml, which stays the single source of the
# clinical parameters (ADR-020); values never move between the two files.
# Version 0.0.0 marks the fixture: a care plan pinned to it is refused by the real registry.
# The rows meas_min_day, step_ms and reorder_delay_ms of F0 are not registry names
# (docs/formal/03-parameter-registry.md section 3.3) and are therefore absent.
# tests/fixtures/spec/registry_f0.yaml is the test-owned copy; tests/spec checks that the two are equal.
registry_version: "0.0.0"
pathology: hypertension
review_status: unreviewed

