grouped_cells:
  ble_seq_gap:
    fields:
    - system.ble_link_quality
    - system.seq_gap
    templates: all
    reference_mode: grouped
    reference_note: 'REFERENCE of the table (ADR-074 amendment 3, ADR-075): the pair is ONE joint cell; the fully independent product is the labelled sensitivity variant'
    K: 4
    joint_classes:
    - clean
    - gap
    - degraded
    - gap_degraded
    joint_class_map:
      D,D: clean
      D,A: gap
      A,D: degraded
      A,A: gap_degraded
    joint_class_map_order: (system.ble_link_quality, system.seq_gap); A asserted, D denied
    joint_formula: P(j | s) = sum over the modes m of s of weight(m) * [(1-eps) * 1(j = m) + eps/(K-1) * 1(j != m)], K = 4; weights of a component sum to 1, so the K values sum to 1
    joint_definition:
      clean: ble_link_quality denied (at or above the floor) and seq_gap denied
      gap: 'ble_link_quality denied and seq_gap asserted (class G: a sequence value is missing, link not degraded)'
      degraded: ble_link_quality asserted (below the floor) and seq_gap denied
      gap_degraded: both asserted
    leak: eps/(K-1) on each joint class other than the mode, K = 4
    default_mode:
      clean: '1'
    modes:
      ble_dropout:
        gap_degraded: qc
        degraded: 1-qc
      message_drop:
        gap: qc
        clean: 1-qc
      injection_naive:
        gap: 1-qc
        clean: qc
      dispense_forgery_naive:
        gap: 1-qc
        clean: qc
    none_rule: if one coordinate is None the joint probability is summed over it (marginalised); if both are None the factor is 1
    status: awaiting_human_value
    value: null
    source_type: design_choice
    source_ref: 'ADR-074 amendment 3: system.seq_gap and system.ble_link_quality overlap (the ratio is 1.0 exactly when no value is missing) and are ONE grouped cell; modes inherited from the research prototype
      (variant G1) and re-expressed on the split fields; the explicit cells of the two fields in `cells` are their marginals, used by the fully independent variant and as the source record of the modes'
    verified_by: null
    needs: gab
    sensitivity_label: sensitivity, not a proposal
    sensitivity_range:
    - grouped
    - independent
  cross_device_signal_quality:
    fields:
    - cross_device.pulse_vs_ecg_hr_diff
    - signal_quality.ecg_sqi
    - signal_quality.ppg_sqi
    templates:
    - range
    - hold
    - resp
    - sys
    reference_mode: independent
    reference_note: 'the only independence-relaxing variant: off in the reference, on in the sensitivity variant reference_plus_cross_device'
    K: 8
    joint_classes: 2^3 combinations of (diff, ecg_sqi, ppg_sqi), each A or D
    joint_formula: 'component with modes: P(j | s) = sum over the modes m of weight(m) * [(1-eps) * 1(j = m) + eps/(K-1) * 1(j != m)], K = 8; component without modes: the product of its marginals; both
      sum to 1 over the K joint classes'
    none_rule: if members are None the joint probability is summed over (marginalised over) the unavailable members, like ble_seq_gap; if all are None the factor is 1
    default_mode: product of the marginals given the component
    modes:
      ecg_noise:
        A,A,D: qc
        A,D,D: 1-qc
    common_cause:
      component: ecg_noise
      role: 'co-occurrence component: under this variant ecg_noise is applicable at range, hold, resp and sys (it violates no template by itself, fault-model Effects on templates), as a nuisance that raises
        the cross-device difference during a clinical violation'
      mode_order: (pulse_vs_ecg_hr_diff, ecg_sqi, ppg_sqi)
    status: awaiting_human_value
    value: null
    source_type: design_choice
    source_ref: ADR-074 decision 1 (independence given the cause is an ASSUMPTION; one grouped-field variant as sensitivity); research prototype variant G1 (common cause ecg_noise); fault-model.md, Non-faults
      and boundaries (evidence confound of ecg_noise)
    verified_by: null
    needs: gab
    sensitivity_label: sensitivity, not a proposal
    sensitivity_range:
    - independent
    - grouped
diagnostics_profiles:
  driver_with_diagnostics:
    reads_diagnostics_ok: true
    contract: 'liveness contract for stale (evidence-channels.md, Bridge node): an idle on-demand device reports ok and is never stale; stale means expected to publish and silent beyond stale_lease_ms'
    stale_components:
    - ble_dropout
    - message_drop
    - process_kill
    - uncommanded_lifecycle_transition
    stale_cell: 'token S, condition STALE: eps+(1-2*eps)*q_stale; every other component, silent faults and C1 included, has the structural zero eps (P(ok) = 1-eps)'
    requires_rows:
    - driver_stale_lease_ms
    - driver_period_ms
    requires_rows_where: configs/benchmark/generator_design.yaml (awaiting_human_value); a build with this profile is refused while they are
    note: 'The cell of ble_dropout is conditional: a dropout shorter than the lease raises nothing, and a dropout of an idle device loses nothing and reports nothing. P(stale | cuff_detached) = 0 is a property
      of the generator (sessions derive from what the device SENT), not of the contract.'
  without_diagnostics:
    reads_diagnostics_ok: false
    reading: null
    factor: 1
    note: 'No driver report: system.diagnostics_ok is None for every instance (capability false), so the field is not read and the cells of the profile above are not used; it is never a default ok.'
sensitivity_design:
- name: eps
  range:
  - 0.001
  - 0.01
  - 0.05
  - 0.1
  applies_to: all structural cells
- name: qc
  range:
  - 0.25
  - 0.5
  - 0.75
  applies_to: conditional cells (tokens C and Cn)
- name: q_stale
  range:
  - 0.25
  - 0.5
  - 0.75
  applies_to: stale cells of system.diagnostics_ok
- name: rep_nat
  range:
  - 0.0098
  - 0.0197
  - 0.0393
  applies_to: natural repeat of the cuff reading
- name: delta
  range:
  - 0
  - 0.1
  - 0.25
  applies_to: C1 diversion share
- name: dispense_bounce_interval_ms
  range:
  - 1000
  - 10000
  - 30000
  - 60000
  - 180000
  applies_to: threshold of the interval reading
- name: class_priors
  range:
  - uniform
  - c1_heavy
  - c2_heavy
  - c3_rare
  - c3_heavy
  applies_to: prior_t(c)
- name: pi_designs
  range:
  - uniform
  - quiet_rare
  - quiet_common
  applies_to: pi(component | class, t)
- name: cumulative_level
  range:
  - 0.8
  - 0.9
  - 0.95
  applies_to: level of the subtype set
- name: tau
  range:
  - 0.5
  - 0.67
  - 0.8
  - 0.9
  - 0.95
  - 0.99
  applies_to: abstention threshold of kappa
- name: grouped_variant
  range:
  - reference
  - fully_independent
  - reference_plus_cross_device
  applies_to: 'independence assumption: reference = ble_seq_gap grouped, cross-device independent; fully_independent relaxes nothing; reference_plus_cross_device adds the common cause ecg_noise'
  reference: reference
- name: diagnostics_profile
  range:
  - driver_with_diagnostics
  - without_diagnostics
  applies_to: profile of system.diagnostics_ok
- name: cell_scope
  range:
  - template
  - all
  applies_to: 'components of a cell: those that can violate t (reference) or every component of the class'
- name: family
  range:
  - catalogue
  - benchmark_v1
  applies_to: all subtypes of the catalogue or only those the benchmark injects
- name: labelling
  range:
  - tight
  - loose
  applies_to: truth used to score; tight is primary (decided after seeing the result, ADR-074 amendment 2)
