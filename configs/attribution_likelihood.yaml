# Likelihood table of the attribution layer (ADR-074, WS02-T06). Specification: docs/models/attribution-likelihood.md.
# Machine-readable cells, class priors, pi(subtype | class) designs, parameters and thresholds.
#
# NO NUMBER IN THIS FILE IS A PROPOSAL. A structural cell is written 1-eps / eps with eps a PARAMETER. Every other number is a row
# `awaiting_human_value` (value: null) with a `sensitivity_range` taken from the research report
# (docs/benchmark/evidence/likelihood-attribution.md, sections 1.5, 6, 9, 10) and labelled 'sensitivity, not a proposal'. The numbers
# under `sensitivity_range` and `designs` are the values of the sensitivity grid; the designs marked `illustrative` are declared
# examples. Row schema: that of configs/benchmark/generator_design.yaml (source_type, source_ref, verified_by, status, needs).
# `verified_by` is null until a human records the check. No row cites a bibliography entry; a `literature` row would need `bib_key`.
# Validation is technical and pre-clinical: nothing here is a clinical value.
#
# Generated once from the catalogue tables of the specification and then maintained by hand.
schema_version: 0.1.0
label: 'Likelihood table of ADR-074 (WS02-T06). No non-structural number is chosen here: every row marked awaiting_human_value has a sensitivity range taken from the research report; the range is a sensitivity,
  not a proposal.'
contracts:
  evidencevector: 0.2.0
  attribution: 0.3.0
  alert: 0.3.0
model:
  document: docs/models/attribution-likelihood.md
  posterior: p(s | e, t) proportional to prior_t(class(s)) * pi(s | class, t) * product over the read fields of P(class_f | s)
  independence: 'ASSUMPTION: the read fields are independent given the SUBTYPE component (naive Bayes) EXCEPT the pair (system.ble_link_quality, system.seq_gap), which is ONE joint cell in the reference;
    the cross-device group and the fully independent product are sensitivity variants'
  unavailable_rule: a None reading contributes the factor 1
unavailable:
  reading_class: U
  factor: 1
  rule: 'A reading that is None (or out of domain, or of class K) has no cell in the product: it contributes the factor 1 to every subtype, and is never read as a denied reading.'
reading_classes:
  defined_in: docs/models/attribution-rule.md, Reading classes (A asserted, D denied, U unavailable; K treated as U; F and G count as D in the independent table)
  added_by_this_document:
    signal_quality.cuff_value_repeated:
      A: 'True'
      D: 'False'
      U: None
    dispenser.interval_since_previous_ms:
      A: value <= dispense_bounce_interval_ms
      D: value > dispense_bounce_interval_ms
      U: None
    dispenser.content_change:
      A: 'value == 0 (a bounce: nothing left the dispenser)'
      D: any other finite value (a release)
      U: None
parameters:
- name: eps
  symbol: eps
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'design choice: leak of every structural cell (reading noise, an unmodelled cause); research report section 1.5; the false-alert rate of each channel would have to come from device specification
    or literature (none collected)'
  verified_by: null
  needs: device_specification
  sensitivity_range:
  - 0.001
  - 0.01
  - 0.05
  - 0.1
  sensitivity_label: sensitivity, not a proposal
  note: 1-eps if a component raises a field by construction, eps if it does not.
- name: qc
  symbol: qc
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'design choice: probability that a conditional raise (LC, SEQ, DSP, D-5, ...) holds; research report section 1.5; the conditions of the real deployment (lease, deadline, sequence provision)
    come from WS07-T03 / EC-OP-18'
  verified_by: null
  needs: gab
  sensitivity_range:
  - 0.25
  - 0.5
  - 0.75
  sensitivity_label: sensitivity, not a proposal
  note: One value for every conditional cell of the first version; the per-condition split is a later refinement (each cell carries its condition).
- name: q_stale
  symbol: q_stale
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'design choice, WS04-T18 hand-over: P(stale | dropout) is NOT near 1 (a dropout of an idle device reports nothing; a dropout shorter than the lease leaves ok); range taken from the qc grid
    of the research report; the research cell was R (1-eps)'
  verified_by: null
  needs: device_specification
  sensitivity_range:
  - 0.25
  - 0.5
  - 0.75
  sensitivity_label: sensitivity, not a proposal
  note: Conditional cell of system.diagnostics_ok under the profile driver_with_diagnostics.
- name: rep_nat
  symbol: rep_nat
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'generator property: 0.0197 measured in the research report section 10.1.1 (0.0223 on 4448 pairs in WS04-T18, 0.0204 by the formula E[max(0, 1 - |delta|/r)]), x0.5 and x2 as grid values; not
    a device constant'
  verified_by: null
  needs: device_specification
  sensitivity_range:
  - 0.0098
  - 0.0197
  - 0.0393
  sensitivity_label: sensitivity, not a proposal
  note: Natural probability that two consecutive cuff readings are identical at the display resolution; depends on the resolution of the profile and on the noise.
- name: delta
  symbol: delta
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'design choice: share of C1 events in which a dispensed dose is not taken (diversion, pocketing); 0 in the benchmark adherence model (declared simplification); adherence literature would have
    to supply it'
  verified_by: null
  needs: literature
  sensitivity_range:
  - 0
  - 0.1
  - 0.25
  sensitivity_label: sensitivity, not a proposal
  note: C1 diversion share; the cell of witness.intake_observed for C1 subtypes at resp.
- name: dispense_bounce_interval_ms
  symbol: T_b
  unit: ms
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'registry name proposed in ADR-032: interval under which two openings are a bounce; the analisi nominal ''below one second'' is illustrative and unverified; dispenser specification'
  verified_by: null
  needs: device_specification
  sensitivity_range:
  - 1000
  - 10000
  - 30000
  - 60000
  - 180000
  sensitivity_label: sensitivity, not a proposal
  note: 'Threshold of the reading class of dispenser.interval_since_previous_ms (A: interval at or below T_b).'
- name: tau
  symbol: tau
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: design choice (cost of a wrong cause against an abstention); research report section 1.5
  verified_by: null
  needs: gab
  sensitivity_range:
  - 0.5
  - 0.67
  - 0.8
  - 0.9
  - 0.95
  - 0.99
  sensitivity_label: sensitivity, not a proposal
  note: 'Abstention threshold: kappa = UNDETERMINED if the largest class posterior is below tau.'
- name: cumulative_level
  symbol: level
  unit: '1'
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: 'design choice: cumulative probability of the subtype set; research report section 9'
  verified_by: null
  needs: gab
  sensitivity_range:
  - 0.8
  - 0.9
  - 0.95
  sensitivity_label: sensitivity, not a proposal
  note: The set is the most probable subtypes up to this level. The conformal set of WS05-T14 replaces it with a calibrated threshold.
class_priors:
  name: class_priors
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: design choice or literature on the aetiology of ward alerts; never the injection rates of the benchmark (ADR-074 decision 2)
  verified_by: null
  needs: gab
  sensitivity_label: sensitivity, not a proposal
  sensitivity_range:
  - uniform
  - c1_heavy
  - c2_heavy
  - c3_rare
  - c3_heavy
  note: 'prior_t(c): the same row for every template, restricted to the classes that have an applicable subtype at t and renormalised (a class without an applicable subtype has prior 0).'
  designs:
    uniform:
      status: reference
      C1: 1/3
      C2: 1/3
      C3: 1/3
    c1_heavy:
      status: illustrative
      C1: 0.6
      C2: 0.3
      C3: 0.1
    c2_heavy:
      status: illustrative
      C1: 0.3
      C2: 0.6
      C3: 0.1
    c3_rare:
      status: illustrative
      C1: 0.45
      C2: 0.5
      C3: 0.05
    c3_heavy:
      status: illustrative
      C1: 0.2
      C2: 0.2
      C3: 0.6
pi_designs:
  name: pi_designs
  value: null
  status: awaiting_human_value
  source_type: design_choice
  source_ref: design choice; ward incident statistics, device failure data and the attacker prevalence of the threat model would have to supply it (none collected); research report section 9 and subtype_priors.yaml
  verified_by: null
  needs: gab
  sensitivity_label: sensitivity, not a proposal
  sensitivity_range:
  - uniform
  - quiet_rare
  - quiet_common
  note: 'pi(component | class, t): relative weights, normalised over the components of the class that can violate t; the knowledge levels of replay, dispense_forgery and presence_spoof are components, so
    uniform is uniform over COMPONENTS (a subtype with two levels weighs twice a subtype with one).'
  groups:
    quiet_c2:
    - stuck_at
    - cuff_silent_bias
    - dispenser_bounce
    quiet_c3:
    - replay_informed
    - injection_informed
    - dispense_forgery_informed
    - presence_spoof_informed
    - dispenser_physical_tamper
    quiet_c1:
    - spontaneous_range
    - spontaneous_sched
    - spontaneous_hold
    - spontaneous_count
    - spontaneous_resp
  designs:
    uniform:
      status: reference
      default: 1.0
      weights:
        quiet_c2: 1.0
        quiet_c3: 1.0
        quiet_c1: 1.0
    quiet_rare:
      status: illustrative
      default: 1.0
      weights:
        quiet_c2: 0.25
        quiet_c3: 0.25
        quiet_c1: 0.25
    quiet_common:
      status: illustrative
      default: 1.0
      weights:
        quiet_c2: 4.0
        quiet_c3: 4.0
        quiet_c1: 4.0
