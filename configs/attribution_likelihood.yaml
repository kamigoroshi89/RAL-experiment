cell_tokens:
  Z:
    form: eps
    meaning: 'structural zero: the field is in neither the raised nor the conditional column of the row of the component'
    param: eps
  R:
    form: 1-eps
    meaning: raised by construction (column raised of the row)
    param: eps
  C:
    form: eps+(1-2*eps)*qc
    meaning: 'conditional raise (column conditional of the row): the condition holds with probability qc'
    param: qc
  Cn:
    form: eps+(1-2*eps)*(1-qc)
    meaning: 'complement of a conditional raise (the other branch of an either-or, naive forger: repeat or gap)'
    param: qc
  S:
    form: eps+(1-2*eps)*q_stale
    meaning: stale report of the driver, conditional on the profile and on the length of the silence (liveness contract)
    param: q_stale
  N:
    form: max(rep_nat, eps)
    meaning: natural coincidence of two consecutive cuff readings at the display resolution
    param: rep_nat
  V:
    form: eps+(1-2*eps)*delta
    meaning: 'diverted dose: C1 event in which the witness reads intake False'
    param: delta
default_cell:
  token: Z
  A: eps
