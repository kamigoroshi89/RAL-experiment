masks:
  data_scope:
    dispenser:
      fields:
      - dispenser.interval_since_previous_ms
      - dispenser.content_change
      read_for:
      - hold
      - count
      - resp
      - int
      note: the extractor computes the group for every template; the table reads it only where the dispenser is in the data scope
    cuff_value_repeated:
      field: signal_quality.cuff_value_repeated
      read_for:
      - range
      - sched
      - hold
      - resp
      - sys
      unavailable_when:
      - the device profile declares no cuff_resolution
      - fewer than two readings of the cuff stream
      - the latest accepted reading lies outside the evidence window
      note: the extractor computes the field for every template; for count and int the cell is not read
  a4:
    cells_removed:
    - witness.identity_confirmed
    - witness.intake_observed
    - system.nav_task_failed
    - system.manip_task_failed
    cells_kept:
    - system.node_lifecycle
    - system.diagnostics_ok
    - system.liveliness_ok
    - system.qos_deadline_missed
    - system.ble_link_quality
    - system.seq_gap
    - signal_quality.ecg_sqi
    - signal_quality.ppg_sqi
    - signal_quality.cuff_error_code
    - signal_quality.cuff_value_repeated
    - cross_device.pulse_vs_ecg_hr_diff
    - crypto_temporal.authenticated
    - crypto_temporal.seq_repeat
    - crypto_temporal.timestamp_implausible
    - dispenser.interval_since_previous_ms
    - dispenser.content_change
    recompute_not_masked:
    - system.node_lifecycle
    - system.diagnostics_ok
    - system.liveliness_ok
    - system.qos_deadline_missed
    rule: A4 (embodied channel removed) = the same table with the cells of the fields that become None removed (factor 1); the four aggregate system fields are recomputed by the extractor and keep their
      cells; the set of applicable subtypes does not change (the robot-side subtypes become less distinguishable and the sets larger)
    source_ref: docs/models/evidence-channels.md, Ablation A4 mask; ADR-074 consequences
