# Literature prior of the benchmark generator for hypertension (WS04-T02, ADR-005).
# Read by ralmon.benchmark.LiteraturePriorSource; rendered into docs/benchmark/parameter-provenance.md by
#   python -m ralmon.benchmark.priors --write-table
#
# Status: NO VALUE IN THIS FILE HAS BEEN CHOSEN BY AN AGENT (ADR-020, parameter policy of the WS04
# README). Every row is awaiting_human_value: a human supplies `value` (or `dist`) and `source_ref`,
# `source_type` and `rationale`, sets `status: filled` and, after checking the source, `verified_by`
# (H1 of the WS04 README). A filled row with an empty source_ref makes the loader fail. Until
# every row is filled a strict load refuses to run and a benchmark built from this file is provisional.
#
# Row schema (every key must be present; write null explicitly):
#   parameter       the contract field name (PatientParams, AdherenceParams, DeviceErrorModel)
#   unit            fixed per field: mmHg, 1, 1/h or ms
#   value | dist    a number, or a distribution {family: constant|uniform|normal|lognormal, parameters,
#                   optional truncate: {lo, hi}}; patient rows only for dist; onset_delay_range_ms
#                   takes value: {lower_ms, upper_ms}
#   source_ref      citation or dataset table; mandatory as soon as there is a value
#   source_type     published_literature | standard | public_dataset | design_choice |
#                   declared_assumption | illustrative_unverified | fixture_only (never in this file)
#   verified_by     the human who checked the value against the source, or null
#   status          filled | awaiting_human_value
#   consumer_task   the task that reads the row
#   rationale       why this value; mirrors RegistryEntry.rationale (null while awaiting)
#   note            what the row means and what the human must decide
#   reference_step_ms  only ar_noise_phi: the sampling step (ms) at which the coefficient holds
#
# Parameters that the contract has no field for go to configs/benchmark/generator_design.yaml (ADR-038).
schema_version: "0.1.0"
