# Literature prior of the benchmark generator for hypertension (WS04-T02, ADR-005).
# Read by ralmon.benchmark.LiteraturePriorSource; rendered into docs/benchmark/parameter-provenance.md by
#   python -m ralmon.benchmark.priors --write-table
#
# Status: NO VALUE IN THIS FILE HAS BEEN CHOSEN BY AN AGENT (ADR-020, parameter policy of the WS04
# README). Every row is awaiting_human_value: a human supplies `value` (or `dist`) and `source_ref`,
# `source_type` and `rationale`, sets `status: filled` and, after checking the source, `verified_by`
# (H1 of the WS04 README). A filled row with an empty source_ref makes the loader fail. Until
# every row is filled a strict load refuses to run and a benchmark built from this file is provisional.
#
# Row schema (every key must be present; write null explicitly):
#   parameter       the contract field name (PatientParams, AdherenceParams, DeviceErrorModel)
#   unit            fixed per field: mmHg, 1, 1/h or ms
#   value | dist    a number, or a distribution {family: constant|uniform|normal|lognormal, parameters,
#                   optional truncate: {lo, hi}}; patient rows only for dist; onset_delay_range_ms
#                   takes value: {lower_ms, upper_ms}
#   source_ref      citation or dataset table; mandatory as soon as there is a value
#   source_type     published_literature | standard | public_dataset | design_choice |
#                   declared_assumption | illustrative_unverified | fixture_only (never in this file)
#   verified_by     the human who checked the value against the source, or null
#   status          filled | awaiting_human_value
#   consumer_task   the task that reads the row
#   rationale       why this value; mirrors RegistryEntry.rationale (null while awaiting)
#   note            what the row means and what the human must decide
#   reference_step_ms  only ar_noise_phi: the sampling step (ms) at which the coefficient holds
#
# Parameters that the contract has no field for go to configs/benchmark/generator_design.yaml (ADR-038).
schema_version: "0.1.0"
name: literature-hypertension
pathology: hypertension
fixture_only: false
parameters:
  - parameter: baseline_sbp_mmhg
    unit: "mmHg"
    value: null
    dist: {family: normal, mean: 149.3, sd: 9.0, truncate: {lo: 122.3, hi: 176.3}}
    source_ref: "Cornelissen G, Watanabe Y, Beaty LA, Otsuka K, 2025 (7-day ABPM of 47 outpatients); inpatient cross-checks Xu et al. BMC Cardiovasc Disord 2013;13:37 and Pikilidou et al. Hypertens Res 2010;33:995-999 (detail: docs/formal/parameter-literature-proposal.md)"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T03
    rationale: "Literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), not clinically reviewed and not verified by a human against the source; outpatients, not inpatients; the truncation at mean +/- 3 SD is a design choice."
    note: "Baseline systolic pressure of the latent patient. Supply a value or a distribution (dist) and its source_ref; analisi §5.1 item 1 expects distributions estimated on a cohort, which WS04-T13 provides once credentialing exists. No value has been chosen by an agent."
  - parameter: circadian_amplitude_mmhg
    unit: "mmHg"
    value: null
    dist: {family: normal, mean: 13.2, sd: 6.1, truncate: {lo: 0.0}}
    source_ref: "Madden JM, Browne LD, Li X, Kearney PM, Fitzgerald AP, 2018 (cosinor amplitude of ambulatory systolic pressure) (detail: docs/formal/parameter-literature-proposal.md)"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T03
    rationale: "Literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), not clinically reviewed and not verified by a human against the source; a cosinor amplitude is already half the peak-to-trough difference; hospital patients show a blunted night-time dip; truncation at 0 is a design choice."
    note: "Amplitude A of the circadian component of the latent pressure (analisi §5.1 item 1). CONVENTION: A is HALF the peak-to-trough difference (the curve runs from baseline - A to baseline + A), so a source that reports a peak-to-trough dip D must be entered as A = D / 2. Circadian phase has no contract field: see the contract gaps in ADR-038."
  - parameter: ar_noise_sd_mmhg
    unit: "mmHg"
    value: 8.8
    dist: null
    source_ref: "Madden et al. 2018 (residual SD 11.9 mmHg net of two harmonics) (detail: docs/formal/parameter-literature-proposal.md)"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T03
    rationale: "Literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), not clinically reviewed and not verified by a human against the source; latent value sqrt(11.9^2 - 8^2) = 8.8 mmHg, removing the cuff error SD of 8 mmHg (cuff_error_sd_mmhg) from a residual measured with a cuff."
    note: "Standard deviation of the autoregressive pressure noise (analisi §5.1 item 1), in mmHg."
  - parameter: ar_noise_phi
    unit: "1"
    value: 0.22
    dist: null
    source_ref: "Madden et al. 2018 (lag-1 autocorrelation of 30-min ambulatory readings) (detail: docs/formal/parameter-literature-proposal.md)"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T03
    rationale: "Literature-anchored proposal (WS01-T09, accepted by gab 2026-10-08), not clinically reviewed and not verified by a human against the source; coefficient at a 30-min step; general cohort, not inpatients."
    note: "Autoregressive coefficient of the pressure noise. It is meaningless without its sampling step: the human supplies reference_step_ms (integer ms) with the value, and WS04-T03 rescales to the generator step as phi_s = phi ** (step / reference_step_ms). ASSUMPTION: this rescaling holds only if the continuous-time autocorrelation is exponentially decaying (the same process sampled at another step); a source with another autocorrelation structure does not justify it. NEGATIVE PHI: a negative coefficient has a real rescaled value only when the generator step is an integer multiple of reference_step_ms (phi ** n); any other ratio, for example a 1-minute grid with a 5-minute reference, is refused at build time (when the grid is built), not when the prior is loaded."
    reference_step_ms: 1800000
