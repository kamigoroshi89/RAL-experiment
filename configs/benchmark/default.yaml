# Default configuration of the benchmark builder (WS04-T11): python -m ralmon.benchmark build --config <this file>.
#
# Paths are relative to the directory of this file. `parameters:` uses the row schema of the other design files
# (read by ralmon.benchmark.priors.load_design_file and rendered into docs/benchmark/parameter-provenance.md by
#   python -m ralmon.benchmark.priors --write-table);
# the builder reads these rows by name and has no default for any of them: a row that is missing, or still
# awaiting_human_value, is a configuration error (BenchmarkConfigError) or a provenance error (UnfilledParameterError).
# The injection rates and the number of confounder pairs are rows of injections.yaml (consumer_task WS04-T11).
#
# What this file fixes and what it does not. analisi 5.1 fixes the scale (200 virtual patients x 7 days = 1400
# patient-days), the three roles of the split (training of the predictor, calibration, test) and "at least 5 seeds".
# It does not fix the proportions of the split, the seed of the reference benchmark, or the monitor step used by the
# labeller; those rows are design choices of WS04-T11 with the reason in `rationale`, verified_by null, awaiting the
# confirmation of H3. ADR-067 (proposed) records the semantics of the seeds and of the split.
#
# One benchmark version is fixed by ONE generation seed (population, injections, reference split). The at least 5
# seeds of analisi 5.1 are experiment seeds of WS08 (they re-draw the split, with ralmon.benchmark.split_patients, and
# the model randomness over that version), plus at least 5 generation seeds that WS04-T12 checks.
#
# The builder generates n_days + 1 days per patient: the last one is the unscored TAIL day of ADR-066 (decision of
# gab, 2026-10-10). The scale below counts the scored days; the tail day is marked in manifest.json.
schema_version: "0.1.0"
benchmark_version: "ral-bench-v1"
pathway_template_id: "hypertension-benchmark"
paths:
  registry: ../registry/hypertension.yaml
  generator_design: generator_design.yaml
  care_plans: care_plans.yaml
  injections: injections.yaml
  segments: ../../data/raw/segments
  arrival_jitter: null
cohorts:
  - id: main
    prior: ../priors/literature_hypertension.yaml
labelling:
  mode: scheduled
# The device profile of the run (WS04-T18, ADR-074; ralmon.benchmark.device_profile). The three last keys are optional;
# the values below are the defaults of the code. cuff_resolution_mmhg / pulse_resolution_bpm: the display resolution at
# the device boundary, applied to the observed cuff readings after the injectors (1 mmHg and 1 bpm is the decision of
# gab, ADR-074 amendment 2; null: no rounding, the benchmarks built before WS04-T18); it is the value the extractor must
# be given as DeviceCapabilities.cuff_resolution. dispenser_reports_interval: the DISPENSE payload carries
# interval_since_previous_ms. diagnostics_profile: `without_diagnostics` (no driver report) or `driver_with_diagnostics`
# (NODE_STATE `diagnostics` reports of the cuff and dispenser drivers under the liveness contract of
# docs/models/evidence-channels.md; it needs the rows driver_period_ms and driver_stale_lease_ms of generator_design.yaml,
# which have no default and are awaiting_human_value: a build with this profile is refused while they are).
device_profile:
  dispenser_content_sensing: false
  authenticating_devices: []
  cuff_resolution_mmhg: 1.0
  pulse_resolution_bpm: 1.0
  dispenser_reports_interval: true
  diagnostics_profile: without_diagnostics
allow_no_segments: false
confounders:
  variants: null
parameters:
  - parameter: n_patients
    unit: "1"
    value: 200
    dist: null
    source_ref: "analisi §5.1: 200 virtual patients x 7 days = 1400 patient-days, split by patient"
    source_type: declared_assumption
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "The scale of the benchmark is stated by the analysis document (analisi §5.1), not chosen here; it is a declared design of the project, not a measured quantity. The confounder twin patients come on top."
    note: "Virtual patients of the main cohort (role patient). A cohort entry of this file may state its own n_patients (the cohort option for the shift experiment A6, analisi §5.6); --n-patients overrides the single cohort."
  - parameter: n_days
    unit: "1"
    value: 7
    dist: null
    source_ref: "analisi §5.1: 200 virtual patients x 7 days = 1400 patient-days, split by patient"
    source_type: declared_assumption
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "The scale of the benchmark is stated by the analysis document (analisi §5.1), not chosen here. These are the SCORED days; the builder adds one unscored tail day per patient (ADR-066)."
    note: "Scored days per virtual patient. The days of a patient are on one continuing axis (day_index * T_day + clock time); --n-days overrides."
  - parameter: generation_seed
    unit: "1"
    value: 0
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T11; no source; awaiting confirmation by H3"
    source_type: design_choice
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "Root seed of the reference benchmark version (population, injections, reference split): any non-negative integer below 2**64 names a different version; 0 is the first. The checks of WS04-T12 use at least five other generation seeds; --seed overrides."
    note: "Root seed of the named random streams of ralmon.benchmark.rng. One benchmark version is fixed by one generation seed (ADR-067, proposed)."
  - parameter: split_fractions
    unit: "1"
    value: {train: 0.5, calibration: 0.25, test: 0.25}
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T11; no source: analisi §5.1 names the three roles (training of the predictor, calibration, test) and not their proportions; awaiting confirmation by H3"
    source_type: design_choice
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "Half of the patients train the forecaster, a quarter calibrate the conformal calibrator and a quarter test (the targets at the default scale: 100, 50 and 50 virtual patients if the units were only virtual patients). The calibration split holds whole patients because the unit of the conformal calibration is the patient episode (analisi §4.4), so that the calibration and the test patients are exchangeable by construction. The fractions are TARGETS for the units that are split, not guarantees of the counts of virtual patients: the 38 pair units of the default configuration are split with the 200 virtual patients by the same permutation, so the number of virtual patients per split varies with the generation seed (seed 0 gives 100, 50 and 50; other seeds gave, for example, 101, 48 and 51 and 95, 53 and 52) and a split holds 7 to 11 of the pair units. Stratifying the pair units, or keeping them out of the training and calibration splits, is an open decision for gab (ADR-067). The split is by patient, never by day (contract rule 2 of #trace-schema)."
    note: "Fractions of the patients (the twin patients of a confounder pair count as one unit and stay together) in the roles train, calibration, test; they must sum to 1 exactly (decimal sum) and are turned into sizes by the largest-remainder rule (ties by the order train, calibration, test). The reference split is drawn with the generation seed; WS08 re-draws it per experiment seed."
  - parameter: monitor_step_ms
    unit: "ms"
    value: 60000
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T11; docs/formal/01-signals-sampling.md uses 60000 ms as the monitor step T_s (fixture arithmetic, FIXTURE-ONLY monitor configuration); no clinical source; awaiting confirmation by H3"
    source_type: design_choice
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "The step T_s of the monitor configuration that the labeller uses on the ideal observation, and therefore the grid of the latent pressure (the labeller and the monitor must share a grid). One minute divides the day and every window parameter of the registry (a multiple of the step, docs/formal/03). The experiments of WS08 must use the same MonitorConfig.step_ms."
    note: "T_s of MonitorConfig and latent_step_ms of the latent assembly; it must divide 86 400 000 and every window parameter of the registry in use (load_registry checks the alignment)."
  - parameter: monitor_reorder_delay_ms
    unit: "ms"
    value: 0
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T11; docs/benchmark/ground-truth.md: the ideal observation has t_rx_ms == t_device_ms; awaiting confirmation by H3"
    source_type: design_choice
    verified_by: null
    status: filled
    consumer_task: WS04-T11
    rationale: "The labeller runs the monitor on the ideal observation of the latent day, which has no transport delay, so the reorder buffer holds nothing back and its maximum delay is 0. It is a field of MonitorConfig, not a property of the generator."
    note: "reorder_delay_ms of the MonitorConfig that the labeller passes to run_offline."
