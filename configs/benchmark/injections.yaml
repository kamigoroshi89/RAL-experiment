    note: "Level short of the window duration of replay, integer ms of at least 1 and at most one day, an agent-proposed grid point for confirmation by H3 (the level labels are ordered short < medium < long). Duration of the window in which the previous day's cuff messages are delivered again and the genuine messages of the window do not reach the gateway; a window shorter than the interval between two measurements replays at most one message, a longer one several. Rationale: the level fixes how much of the patient's day the attack covers; the count of attacks per day is the plan of WS04-T11. The window is half open on the arrival time of the messages. No value has been chosen by an agent."
