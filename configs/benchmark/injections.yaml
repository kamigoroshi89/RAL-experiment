# Injection design of the benchmark generator (WS04-T07 writes the C2 section; WS04-T08 the C3 section
# and the attacker section).
# Same row schema as configs/priors/literature_hypertension.yaml for the rows of `parameters:`; read
# by ralmon.benchmark.injection.load_injection_design and rendered into
# docs/benchmark/parameter-provenance.md by
#   python -m ralmon.benchmark.priors --write-table
#
# Layout. `injections:` is the structured part: per subtype of docs/models/fault-model.md (the
# vocabulary), the family, the allowed target units, how the onset is placed, and the duration and
# magnitude blocks (key, unit, optional reference quantity and one named level per row of
# `parameters:`). It holds no number: every number of the design is a row of `parameters:`, so the
# provenance table lists every number that is not code. A level row that is relative is a multiple of
# the reference quantity (cuff_error_sd_mmhg of the DeviceErrorModel, or the registry sched_window), so
# no absolute clinical or device value is invented here.
#
# Status when WS04-T07 wrote the file: no value had been chosen by an agent (ADR-020, parameter policy
# of the WS04 README), except the level `device_bias`, which is a definition (the multiplier 1.0 of the
# device's own bias). Every row is a design_choice proposed for confirmation by H3; a human supplies
# the values. The bounce gap is labelled as analisi section 4.5 row 7 states it (a nominal interval
# below one second, "illustrative, unverified"; the analysis gives no number) and the larger gaps are
# "stress, physical plausibility unverified". The `status` and `value` of each row are authoritative,
# not this comment.
#
# WS04-T08 (C3). `injections.c3` has the five attacks that benchmark v1 injects (docs/models/threat-model.md,
# section Subtype vocabulary), with the same structure; an attack has no magnitude (a replay copies the
# previous day, an injection draws in bounds or in the range of the patient's own readings), so only the
# window attacks have a duration block, and the three duration levels per attack are rows of `parameters:`
# (design_choice, awaiting_human_value, no value chosen by an agent). The top-level `attacker:` section holds
# what is not a number of the design: the two capability sets (the knowledge levels of the threat model, as
# booleans, each citing the section it is copied from), the names of the population bounds that a naive
# forger draws in (the registry names for the pressure, the two rows below for the pulse rate, whose
# values wait for a human) and the two attack classes that the threat model lists and benchmark v1 does not
# inject. The attacker level of a replay, a forgery or a spoof is the `level` of its spec, recorded in the
# injection log; whether a device authenticates is a property of the run, not of the attack.
#
# WS04-T09 (C1 and the confounder pairs). `injections.c1` has the four C1 subtypes of analisi 5.1 item 3
# (hypertensive_spike, drug_nonresponse, hypotension_below_hold, measurement_refusal) and the forced
# double_take that the confounder pair needs, with the families `physiology` and `behaviour`. A C1
# injection changes the LATENT day (src/ralmon/benchmark/inject_c1.py); its truth is computed by the
# labeller on the latent trace (WS04-T10), so these rows describe injections, not ground truth. A
# pressure magnitude is a multiple of a named reference quantity, never an absolute mmHg: `scale_range`
# of the registry for the spike, the distance between the patient's baseline and the registry entry
# `bp_hold_threshold` (`baseline_to_hold_distance`) for the hypotension; the Emax scale of the
# non-response is dimensionless (the reference is the unscaled effect, 1). Each magnitude has three
# levels, ordered below < near < above the reference (for the non-response: complete, partial, mild),
# so that some levels deliberately do not violate the template; the multipliers are agent-proposed grid
# points awaiting a human value (H3), none is a clinical value. The top-level `confounders:` section
# is the variant grid of the three confounder groups (src/ralmon/benchmark/confounders.py): which
# discriminating channels are withheld in each variant and the expected outcome (`expected_indistinguishable`,
# checked against the computation by tests/benchmark/test_c1_confounders.py). It holds no number: the
# bounce gap and the double-take gap are rows of `parameters:` (dispenser_bounce_magnitude_nominal and
# double_take_gap_ms of generator_design.yaml); a variant's `source_type` and `source_ref` are its
# provenance (design choices of WS04-T09, awaiting confirmation by H3). The group `refusal_vs_robot_missed`
# is not one of the two groups named in analisi 5.1 item 4: it was added by this plan from review finding
# R3-W4 (a missed measurement is often caused by the robot, not by the patient).
schema_version: "0.1.0"
injections:
  c2:
    ble_dropout:
      family: link
      target: [cuff, dispenser, ecg, oximeter]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the count of windows per day follows the rate"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: ble_dropout_duration_short, medium: ble_dropout_duration_medium, long: ble_dropout_duration_long}
      magnitude: null
      rate:
        source: DeviceErrorModel.ble_dropout_rate_per_h
    stuck_at:
      family: device
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11); at least one earlier reading is needed to freeze"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: stuck_at_duration_short, medium: stuck_at_duration_medium, long: stuck_at_duration_long}
      magnitude: null
    cuff_silent_bias:
      family: device
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11)"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: cuff_silent_bias_duration_short, medium: cuff_silent_bias_duration_medium, long: cuff_silent_bias_duration_long}
      magnitude:
        key: bias_mmhg
        unit: mmHg
        reference: cuff_error_sd_mmhg
        levels: {low: cuff_silent_bias_magnitude_low, medium: cuff_silent_bias_magnitude_medium, high: cuff_silent_bias_magnitude_high, device_bias: cuff_silent_bias_magnitude_device_bias}
    ecg_noise:
      family: device
      target: [ecg]
      onset: "window start drawn by the injection plan over the day (WS04-T11)"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: ecg_noise_duration_short, medium: ecg_noise_duration_medium, long: ecg_noise_duration_long}
      magnitude:
        key: noise_level
        unit: "1"
        levels: {low: ecg_noise_magnitude_low, medium: ecg_noise_magnitude_medium, high: ecg_noise_magnitude_high}
    dispenser_bounce:
      family: device
      target: [dispenser]
      onset: "the time of the real dispense it follows; which dispenses bounce is drawn per dispense with the probability below"
      duration: null
      magnitude:
        key: gap_ms
        unit: ms
        levels: {nominal: dispenser_bounce_magnitude_nominal, stress_low: dispenser_bounce_magnitude_stress_low, stress_high: dispenser_bounce_magnitude_stress_high}
      rate:
        source: DeviceErrorModel.dispenser_bounce_prob
    cuff_detached:
      family: device
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the error code is a generator-defined label, not a parameter"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: cuff_detached_duration_short, medium: cuff_detached_duration_medium, long: cuff_detached_duration_long}
      magnitude: null
    nav_delay:
      family: robot
      target: [robot]
      onset: "the tick of the delayed visit (a measurement tick, or a dose tick with the param kind), chosen by the injection plan"
      duration: null
      magnitude:
        key: delay_ms
        unit: ms
        reference: sched_window
        levels: {low: nav_delay_magnitude_low, medium: nav_delay_magnitude_medium, high: nav_delay_magnitude_high}
    manipulation_failure:
      family: robot
      target: [robot]
      onset: "the tick of the failed visit (a measurement tick, or a dose tick with the param kind), chosen by the injection plan"
      duration: null
      magnitude: null
  c3:
    replay:
      family: ble_attack
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the day must not be the first (the attack replays the previous day's cuff messages one day after they arrived); the attacker level is the level of the spec"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: replay_duration_short, medium: replay_duration_medium, long: replay_duration_long}
      magnitude: null
    injection_naive:
      family: ble_attack
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11); one forged message in place of each genuine measurement of the window; the values are drawn in the population bounds named under attacker.bounds"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: injection_naive_duration_short, medium: injection_naive_duration_medium, long: injection_naive_duration_long}
      magnitude: null
    injection_informed:
      family: ble_attack
      target: [cuff]
      onset: "window start drawn by the injection plan over the day (WS04-T11), timed with the care-plan schedule; the values are drawn between the minimum and the maximum of the patient's own genuine readings captured before the onset and on the previous day"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: injection_informed_duration_short, medium: injection_informed_duration_medium, long: injection_informed_duration_long}
      magnitude: null
    dispense_forgery:
      family: ble_attack
      target: [dispenser]
      onset: "the instant of the forged dispense, chosen by the injection plan; the informed level times it with a dispense tick of the care plan; with spoofs_witness it is composed with a presence_spoof (WS04-T09)"
      duration: null
      magnitude: null
    presence_spoof:
      family: perception_attack
      target: [robot]
      onset: "an instant inside a robot visit (the robot must be co-located); the option spoof_intake (informed level only) adds an INTAKE event of the robot at the same instant"
      duration: null
      magnitude: null
  c1:
    hypertensive_spike:
      family: physiology
      target: [patient]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the window lies inside one day"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: hypertensive_spike_duration_short, medium: hypertensive_spike_duration_medium, long: hypertensive_spike_duration_long}
      magnitude:
        key: magnitude_mmhg
        unit: mmHg
        reference: scale_range
        levels: {below: hypertensive_spike_magnitude_below, near: hypertensive_spike_magnitude_near, above: hypertensive_spike_magnitude_above}
    drug_nonresponse:
      family: physiology
      target: [patient]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the window covers the true intakes whose Emax is scaled"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: drug_nonresponse_duration_short, medium: drug_nonresponse_duration_medium, long: drug_nonresponse_duration_long}
      magnitude:
        key: emax_scale
        unit: "1"
        levels: {complete: drug_nonresponse_magnitude_complete, partial: drug_nonresponse_magnitude_partial, mild: drug_nonresponse_magnitude_mild}
    hypotension_below_hold:
      family: physiology
      target: [patient]
      onset: "window start drawn by the injection plan over the day (WS04-T11); the window lies inside one day"
      duration:
        key: duration_ms
        unit: ms
        levels: {short: hypotension_below_hold_duration_short, medium: hypotension_below_hold_duration_medium, long: hypotension_below_hold_duration_long}
      magnitude:
        key: magnitude_mmhg
        unit: mmHg
        reference: baseline_to_hold_distance
        levels: {below: hypotension_below_hold_magnitude_below, near: hypotension_below_hold_magnitude_near, above: hypotension_below_hold_magnitude_above}
    measurement_refusal:
      family: behaviour
      target: [patient]
      onset: "a measurement tick of the care-plan schedule, chosen by the injection plan (WS04-T11); the robot still visits and reports the task as declined"
      duration: null
      magnitude: null
    double_take:
      family: behaviour
      target: [patient]
      onset: "a dose tick of the care-plan schedule; the second dispense follows after double_take_gap_ms of generator_design.yaml (a forced slot of the adherence chain, used by the confounder pair double_take_vs_bounce)"
      duration: null
      magnitude: null
attacker:
  capability_sets:
    naive:
      fresh_metadata: false
      coherent_pulse: false
      plausible_values: false
      spoofs_witness: false
      source_type: declared_assumption
      source_ref: "docs/models/threat-model.md, section Knowledge levels, table of the capability flags, column naive (copied, not chosen here)"
    informed:
      fresh_metadata: true
      coherent_pulse: true
      plausible_values: true
      spoofs_witness: true
      source_type: declared_assumption
      source_ref: "docs/models/threat-model.md, section Knowledge levels, table of the capability flags, column informed (copied, not chosen here)"
  bounds:
    bp:
      lower: bound_bp_lower
      upper: bound_bp_upper
      source: "registry entries of configs/registry/hypertension.yaml (analisi 4.7, illustrative, unverified); the builder passes them as InjectionContext.bp_bounds_mmhg"
    hr:
      lower: injection_naive_pulse_lower_bpm
      upper: injection_naive_pulse_upper_bpm
      source: "rows of parameters: below, awaiting a human value; the builder passes them as InjectionContext.hr_bounds_bpm"
  not_injected_in_v1:
    dispenser_physical_tamper: "not injected in v1: modelled in the threat model (physical access to the dispenser; the event is a genuine device output, so no field of the trace separates it from a patient who opened the dispenser); no injector exists"
    timestamp_manipulation: "not injected in v1: modelled in the threat model (the time metadata of a message, basis inferred from analisi 4.9 item 2); the benchmark injects no clock or delay fault of any class; no injector exists"
confounders:
  groups:
    double_take_vs_bounce:
      members:
        A: {class: C1, subtype: double_take}
        B: {class: C2, subtype: dispenser_bounce}
      matrix_rows: ["analisi 4.5 row 6 (double take of the patient: a deviation of adherence)", "analisi 4.5 row 7 (sensor bounce of the dispenser: C2)"]
      added_by: "analisi 5.1 item 4 (confounders on purpose)"
      variants:
        nominal_content_robot:
          bounce_gap: nominal
          withheld: []
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the dispense interval (a sub-second bounce against the double-take gap), the content change of the second dispense (1 against 0), the witnessed second intake."
        nominal_content_norobot:
          bounce_gap: nominal
          withheld: [witness, robot_task_outcome]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the dispense interval (a sub-second bounce against the double-take gap), the content change of the second dispense (1 against 0)."
        nominal_nocontent_robot:
          bounce_gap: nominal
          withheld: [content_change]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the dispense interval (a sub-second bounce against the double-take gap), the witnessed second intake."
        nominal_nocontent_norobot:
          bounce_gap: nominal
          withheld: [content_change, witness, robot_task_outcome]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the dispense interval (a sub-second bounce against the double-take gap)."
        stress_content_robot:
          bounce_gap: double_take_gap
          withheld: []
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the content change of the second dispense (1 against 0), the witnessed second intake."
        stress_content_norobot:
          bounce_gap: double_take_gap
          withheld: [witness, robot_task_outcome]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the content change of the second dispense (1 against 0)."
        stress_nocontent_robot:
          bounce_gap: double_take_gap
          withheld: [content_change]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "Separable by the witnessed second intake."
        stress_nocontent_norobot:
          bounce_gap: double_take_gap
          withheld: [content_change, witness, robot_task_outcome]
          expected_indistinguishable: true
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 6 and 7; awaiting confirmation by H3"
          rationale: "No discriminating channel is left: the bounce gap equals the double-take gap, the dispenser does not sense its content and no robot is co-located, so the observed dispense streams are equal while the latent days differ (two intakes against one): abstention is the right output."
    nonresponse_vs_falsified_dispense:
      members:
        A: {class: C1, subtype: drug_nonresponse}
        B: {class: C3, subtype: dispense_forgery}
      matrix_rows: ["analisi 4.5 row 2 (drug non-response: separable only with a witness)", "analisi 4.5 row 9 (forged dispense event: partial)"]
      added_by: "analisi 5.1 item 4 (confounders on purpose)"
      variants:
        naive_robot_noauth:
          attacker: naive
          withheld: [verification]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the missing witnessed intake of the forged variant, the sequence number of the forged dispense (a naive forger leaves a repeat or a gap)."
        naive_robot_auth:
          attacker: naive
          withheld: []
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the missing witnessed intake of the forged variant, the sequence number of the forged dispense (a naive forger leaves a repeat or a gap), the failed gateway verification of the forged message."
        naive_norobot_noauth:
          attacker: naive
          withheld: [witness, robot_task_outcome, verification]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the sequence number of the forged dispense (a naive forger leaves a repeat or a gap)."
        naive_norobot_auth:
          attacker: naive
          withheld: [witness, robot_task_outcome]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the sequence number of the forged dispense (a naive forger leaves a repeat or a gap), the failed gateway verification of the forged message."
        informed_robot_noauth:
          attacker: informed
          withheld: [verification]
          expected_indistinguishable: true
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "The informed attacker keeps the metadata coherent, spoofs the witness (presence and intake) where a robot is co-located and no device authenticates: the observed streams equal those of a real non-response (threat model TM-OP-5, analisi 4.5 row 9 and the last row), so the pair is the declared diagnosability limit."
        informed_robot_auth:
          attacker: informed
          withheld: []
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the failed gateway verification of the forged message."
        informed_norobot_noauth:
          attacker: informed
          withheld: [witness, robot_task_outcome, verification]
          expected_indistinguishable: true
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "With no robot co-located and an informed attacker with coherent metadata and no authentication, the observed streams equal those of a real non-response (threat model TM-OP-5)."
        informed_norobot_auth:
          attacker: informed
          withheld: [witness, robot_task_outcome]
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows 2 and 9; awaiting confirmation by H3"
          rationale: "Separable by the failed gateway verification of the forged message."
    refusal_vs_robot_missed:
      members:
        A: {class: C1, subtype: measurement_refusal}
        B: {class: C2, subtype: manipulation_failure}
      matrix_rows: ["none: this group is not a row of the diagnosability matrix of analisi 4.5 (a missed measurement is separated by the robot task outcome, fault-model.md, patient behaviour is C1)"]
      added_by: "added by this plan from review finding R3-W4 (a missed measurement is often caused by the robot); not one of the two groups named in analisi 5.1 item 4"
      variants:
        outcome_reported:
          withheld: []
          expected_indistinguishable: false
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows none: added from R3-W4; awaiting confirmation by H3"
          rationale: "The robot reports the outcome of the manipulation step: declined (the patient refused) against failed (the robot failed), so the pair is separable by the robot task outcome."
        outcome_withheld:
          withheld: [robot_task_outcome]
          expected_indistinguishable: true
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows none: added from R3-W4; awaiting confirmation by H3"
          rationale: "The robot is co-located but reports no task outcome: both members lack the measurement and nothing else differs, so UNDETERMINED is a valid output (fault-model.md, patient behaviour is C1)."
        robot_absent:
          withheld: [witness, robot_task_outcome]
          expected_indistinguishable: true
          source_type: design_choice
          source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T09; analisi 4.5 rows none: added from R3-W4; awaiting confirmation by H3"
          rationale: "No robot channel at all (the embodied channel of ablation A4 removed): the two members are the same observed stream."
parameters:
  - parameter: ble_dropout_duration_short
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T07; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T07
    rationale: null
    note: "Level short of the window duration of ble_dropout, integer ms of at least 1 and at most one day, an agent-proposed grid point for confirmation by H3 (the level labels are ordered short < medium < long). Duration of one BLE dropout window of the link of one device (the BLE connection is lost for the whole window; nothing the device sends arrives). The count of windows per day comes from DeviceErrorModel.ble_dropout_rate_per_h; the duration is a design level. When WS07-T03 sets the liveliness lease of the device profile the human may restate the levels against it (a window shorter than the lease raises neither liveliness nor deadline evidence, condition LC of docs/models/fault-model.md). No value has been chosen by an agent."
  - parameter: ble_dropout_duration_medium
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T07; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T07
    rationale: null
    note: "Level medium of the window duration of ble_dropout, integer ms of at least 1 and at most one day, an agent-proposed grid point for confirmation by H3 (the level labels are ordered short < medium < long). Duration of one BLE dropout window of the link of one device (the BLE connection is lost for the whole window; nothing the device sends arrives). The count of windows per day comes from DeviceErrorModel.ble_dropout_rate_per_h; the duration is a design level. When WS07-T03 sets the liveliness lease of the device profile the human may restate the levels against it (a window shorter than the lease raises neither liveliness nor deadline evidence, condition LC of docs/models/fault-model.md). No value has been chosen by an agent."
  - parameter: ble_dropout_duration_long
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T07; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
