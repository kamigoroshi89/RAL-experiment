    note: "Level long of the window duration of injection_informed, integer ms of at least 1 and at most one day, an agent-proposed grid point for confirmation by H3 (the level labels are ordered short < medium < long). Duration of the window in which an informed attacker replaces the genuine measurement messages by forged ones inside the range of the patient's own readings. Rationale: the informed attacker that is coherent on every channel is the declared diagnosability limit, and the duration only fixes how many messages it replaces; the levels are the same grid as for the other window attacks so that the two attacker levels are compared at equal exposure. The window is half open on the arrival time of the messages. No value has been chosen by an agent."
