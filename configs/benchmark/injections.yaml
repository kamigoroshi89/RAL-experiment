    note: "Level high of the navigation delay of one robot visit, a multiple of the registry entry sched_window (the interval from a schedule tick to the deadline of its robot task): below 1 the robot still arrives in time and nothing is violated, above 1 the task is late and its outcome is late. The injected delay in ms is the value times sched_window read from the registry, so no absolute time is invented here. Levels are ordered low < medium < high. No value has been chosen by an agent."
