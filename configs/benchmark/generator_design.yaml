# Parameters of the benchmark generator that the PriorSource contract has no field for
# (WS04-T03 creates the file; later tasks append their rows; ADR-038 proposes moving them into the
# contract). Same row schema as configs/priors/literature_hypertension.yaml, every key explicit.
# Rendered into docs/benchmark/parameter-provenance.md by
#   python -m ralmon.benchmark.priors --write-table
#
# Status when WS04-T03 created the file: no value had been chosen by an agent (ADR-020, parameter
# policy of the WS04 README). A physiological parameter stays `value: null` / `awaiting_human_value`
# until a human supplies the value with its source_ref and verified_by; a design_choice row may
# carry an agent-proposed value with its rationale (policy class 2). The `status` and `value` of
# each row are authoritative, not this comment.
schema_version: "0.1.0"
parameters:
  - parameter: circadian_peak_clock_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: null
    source_type: published_literature
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T03
    rationale: null
    note: "Clock time of day (integer ms in [0, 86 400 000); a label hh:mm converts as (60 * hh + mm) * 60 000) at which the circadian component of the latent systolic pressure is at its maximum. Model of WS04-T03: sbp(t) = baseline_sbp_mmhg + A * cos(2 * pi * (t - circadian_peak_clock_ms) / 24 h) + AR(1) noise, with A = circadian_amplitude_mmhg. AMPLITUDE CONVENTION: A is HALF the peak-to-trough difference (the curve runs from baseline - A to baseline + A, so a source that reports a peak-to-trough nocturnal dip D must be entered as A = D / 2). The minimum (the nocturnal dip) falls 12 h after this time. A single harmonic is a declared simplification: dipper and non-dipper patterns need further parameters. The human supplies the value, its source and the check that the minimum falls at night. No value has been chosen by an agent."
  - parameter: intake_lag_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T05; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T05
    rationale: null
    note: "Time from a DISPENSE to the true INTAKE of the same pill in the LATENT day, integer ms, at least 0 and strictly shorter than double_take_gap_ms (the first pill is taken before the dispenser is opened again). The adherence model has no dispensed-but-not-taken case (declared simplification), so every DISPENSE is followed by one INTAKE this long after. This is the patient's act, not what the monitor sees: the observed trace holds an INTAKE only if the robot witnessed it (WS04-T06). Not a physiological measurement; the human supplies the value and its rationale. No value has been chosen by an agent."
  - parameter: double_take_gap_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T05; qualitative constraint from analisi §4.5 rows 6 and 7; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T05
    rationale: null
    note: "Time between the two DISPENSE events of a double take, integer ms, at least 1. The only qualitative constraint (analisi §4.5 rows 6 and 7): a double take must be clearly separated from a sub-second sensor bounce of the dispenser, so the gap must be well above one second. It must also be shorter than every slot of the schedule (the interval from a dose tick to the next dose tick, or to the day end), which the model checks against the schedule, and longer than intake_lag_ms. The human supplies the value and its rationale, expressed against the bounce interval. No value has been chosen by an agent."
  - parameter: inflation_ms_nominal
    unit: "ms"
    value: 30000
    dist: null
    source_ref: "Beard J, Pichard K, Attebery JE, Yapici HO, Coffeng R, Med Devices (Auckl) 2025;18:241-246, doi:10.2147/MDER.S520615, Table 2 (seven monitors on blood-pressure simulators, means 19.23 to 51.06 s); ZOLL X Series Technical Specifications, 2015, NIBP block, https://www.zoll.com/-/media/LegacyMedia/uploadedfiles/public_site/products/x_series/9656_0235_xseries_spec_us-pdf.ashx"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T06
    rationale: "Literature-anchored proposal (Group 1 desk research of 2026-10-10, block 1), proposal accepted by gab 2026-10-10, not reviewed; source opened by the research agent, not by gab; WEAK. 30000 ms is the median of the seven device means of Beard et al. 2025 Table 2 (29.97 s, arithmetic of the research agent), where the time is 'the total time between test start and measurement display to the user', on simulators at 120 mmHg and 80 bpm, three runs per device; the ZOLL X Series sheet gives 'Typical Measurement Time: 30 - 45 sec (on deflation)' (one vendor). In this generator 'inflation' is the whole arrival-to-reading cycle (the reading is stamped arrival + inflation), not the inflation phase alone, and the sources report the whole cycle. Not below the registry cuff_inflation_min (15000 ms) and below bound_inflation_ms_upper (180000 ms). The cuff of the lab demo is not named: replace the value by its manual figure. Authors of Beard et al. are GE Healthcare staff, one of the seven devices is theirs. Not clinically reviewed."
    note: "Nominal duration of one cuff inflation, integer ms in [0, 86 400 000]. The reading of a robot visit is stamped arrival + inflation. The registry holds only the minimum cuff_inflation_min: a fault-free draw is raised to that minimum and every raise is counted, so that a fault-free day cannot violate the system template by construction of the generator. This value is a proposal accepted by gab on 2026-10-10 and not reviewed; sources opened by the research agent, not by gab; the source_ref and rationale fields give the source and the reasoning."
  - parameter: inflation_ms_sd
    unit: "ms"
    value: 3000
    dist: null
    source_ref: "Beard J, Pichard K, Attebery JE, Yapici HO, Coffeng R, Med Devices (Auckl) 2025;18:241-246, doi:10.2147/MDER.S520615, Table 2, column Mean +/- SD (s), n = 3 runs per device"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T06
    rationale: "Literature-anchored proposal (Group 1 desk research of 2026-10-10, block 1), proposal accepted by gab 2026-10-10, not reviewed; source opened by the research agent, not by gab; WEAK. 3000 ms is the median of the seven within-device SDs of Beard et al. 2025 Table 2 (0.71, 2.55, 2.57, 3.03, 3.35, 3.48 and 14.32 s; median 3.03 s, arithmetic of the research agent), n = 3 runs per device on a simulator without patient motion, so it likely underestimates the visit-to-visit variability in patients; no source for that was found. Sensitivity (not a value of this row): 14000 ms, the largest within-device SD (iPM12); with nominal 30000 ms about 14% of the draws would then be raised to cuff_inflation_min and each raise is counted by the generator (arithmetic of the research agent). Same cycle-not-phase reading as inflation_ms_nominal. Not clinically reviewed."
    note: "Standard deviation of the cuff inflation duration, ms, at least 0 (0 makes every fault-free inflation equal to the nominal one). The draw is Gaussian, rounded to integer ms and raised to the registry minimum cuff_inflation_min (the Gaussian family is a declared simplification). This value is a proposal accepted by gab on 2026-10-10 and not reviewed; sources opened by the research agent, not by gab; the source_ref and rationale fields give the source and the reasoning."
  - parameter: pulse_error_sd_bpm
    unit: "bpm"
    value: 2.1
    dist: null
    source_ref: "Palatini P, Lazzaretto I, Fontana U, Fania C, J Hypertens 2022 (PMID 34992196), doi:10.1097/HJH.0000000000002998, Abstract (Microlife WatchBP O3, 36 participants, reference: pulse palpation by two observers)"
    source_type: published_literature
    verified_by: null
    status: filled
    consumer_task: WS04-T06
    rationale: "Literature-anchored proposal (Group 1 desk research of 2026-10-10, block 1), proposal accepted by gab 2026-10-10, not reviewed; source opened by the research agent, not by gab; WEAK. Abstract of Palatini et al. 2022: 'At rest, the mean device-observer HR difference was 0.9 +/- 2.1 bpm', so the SD is 2.1 bpm; the reference is palpation, not ECG, and the generator draws the cuff pulse as the clean ECG heart rate of the same instant plus this error. Sensitivity (not a value of this row): 5.9 bpm, derived by the research agent (arithmetic: (13.1 - (-9.9)) / 3.92) from the limits of agreement of the ECG row of Sobieraj P et al., J Clin Hypertens 2024;26(12):1402-1410, doi:10.1111/jch.14892, Table 4; there ECG and cuff were sequential, not simultaneous, so that figure includes true heart-rate change. No study with simultaneous ECG was found. Not clinically reviewed."
    note: "Standard deviation of the error of the pulse rate reported by the cuff against the clean ECG heart rate of the same instant, bpm, at least 0 (Gaussian, declared simplification). The cross-device check that compares the two rates reads this difference, so the value matters for the C3 evidence. This value is a proposal accepted by gab on 2026-10-10 and not reviewed; sources opened by the research agent, not by gab; the source_ref and rationale fields give the source and the reasoning."
  - parameter: robot_dwell_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T06; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T06
    rationale: null
    note: "How long the robot stays in the room after it arrives, integer ms in [0, 86 400 000]; the visit is the closed interval [arrival, arrival + dwell]. A true intake inside a visit is witnessed (an INTAKE event of the robot), one outside is not, so the value sets how many intakes the embodied channel can see. The model does not enforce it, but the dwell should exceed the cuff inflation (the reading completes during the visit) and the intake lag; when the human fills it, it is expressed relative to a registry quantity (for example the schedule window sched_window) with the rationale. No value has been chosen by an agent."
  - parameter: vitals_period_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T06; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T06
    rationale: null
    note: "Period of the hr_ecg and spo2 samples of the observed trace, integer ms; it must divide 86 400 000 and give at most 100 000 samples a day. A segment of another sample period is held to this grid (grid point j takes segment sample (j * period) // segment period). The human chooses it together with the monitor step T_s and the sample period of the extracted segments, with the rationale. No value has been chosen by an agent."
  - parameter: driver_period_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T18 (ADR-074); the liveness contract of docs/models/evidence-channels.md item 5; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T18
    rationale: null
    note: "Period of the NODE_STATE `diagnostics` reports of the device drivers under the profile 'driver_with_diagnostics', integer ms in [1, 86 400 000]: the driver reports `ok` (or `stale`) at the start of each day and at every period after it. Read ONLY when device_profile.diagnostics_profile of the build configuration is `driver_with_diagnostics`; the profile 'without_diagnostics' (the default) never reads it, so the row may stay awaiting for such a build. NO default anywhere: a build with the diagnostics profile and this row awaiting is refused (UnfilledParameterError). The evidence of a violated instance reads the reports of its evidence window, so the value must be put against the windows of the monitor; the thesis bridge node (proposal A) fixes the period of the lab devices. The human supplies the value, its source and the rationale. No value has been chosen by an agent."
  - parameter: driver_stale_lease_ms
    unit: "ms"
    value: null
    dist: null
    source_ref: "design choice (policy class 2 of the WS04 README), proposed by WS04-T18 (ADR-074); the liveness contract of docs/models/evidence-channels.md item 5; no value chosen by an agent"
    source_type: design_choice
    verified_by: null
    status: awaiting_human_value
    consumer_task: WS04-T18
    rationale: null
    note: "Silence beyond which a device that is expected to publish is `stale`, integer ms in [1, 86 400 000]. An ON-DEMAND device (the cuff, the dispenser) is stale only with an open session that has sent no message for MORE than this lease; an idle one is `ok`; a continuous device (ECG, oximeter) is stale when silent for more than the lease. The session of a cuff reading opens when the measurement starts, so the lease must exceed the nominal time from the start of a measurement to its reading (inflation_ms_nominal plus its spread), or every reading shows a short `stale`. Read ONLY when device_profile.diagnostics_profile of the build configuration is `driver_with_diagnostics`; the profile 'without_diagnostics' never reads it, so the row may stay awaiting for such a build. NO default anywhere: a build with the diagnostics profile and this row awaiting is refused. The human supplies the value, its source and the rationale; the thesis bridge node fixes it for the lab devices. No value has been chosen by an agent."
