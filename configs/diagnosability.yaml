      denied: this is part of the declared uncertainty. The same vector as W-09 arises from a lost
      presence sample (CAS-5), a patient who left and a copied authentic message, hence the candidates.
      Under A4, hold loses C1 to UNDETERMINED (transition table); C3 is unchanged. The last outcome is the
      authenticated outcome with the embodied pair removed.
  - id: DX-10
