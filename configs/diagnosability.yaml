    note: >-
      Declared limit from gap G-6 (EC-GAP-6, TM-GAP-TIME): no field carries clock health, the monitor does
      not estimate offsets, and no field is proposed. A skew inside the acceptance bound shifts a verdict
      (a measurement on time is read after the deadline, FX-4, FX-5) and raises nothing, so with coherent
