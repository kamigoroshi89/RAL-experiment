# Diagnosability matrix of the Attribution contract (WS02-T05).
# Machine-readable companion of docs/models/diagnosability-hazards.md. Technical, pre-clinical: no clinical claim.
# Qualitative entries only: no rate and no clinical value appears here; rates are measured on the benchmark by WS08.
schema_version: "0.2.0"
contract: "02-interfaces.md#attribution"
sources:
  - "docs/source/analisi.md section 4.5 (matrix rows 1 to 10, threat model), 4.8 (claim reformulations), 4.9 items 1, 4 and 5, 3.5 (standards), 5.6 (ablation A4), 10 (fourth objection)"
  - "docs/source/review.md R3 weaknesses 4 and 5; meta-review (AE-5)"
  - "docs/models/attribution-rule.md (worked cases W-01 to W-15, decision table, transition table under A4)"
  - "docs/models/fault-model.md (subtype vocabulary, fault-to-evidence table, effects on templates)"
  - "docs/models/threat-model.md (subtype vocabulary, attack-to-evidence table, time as an attack vector)"
  - "docs/models/evidence-channels.md (channel identifiers, A4 mask, contract gaps)"
  - "docs/plan/03-decisions.md (ADR-001, ADR-002, ADR-003, ADR-004, ADR-032, ADR-034, ADR-040, ADR-044)"
vocabulary:
  distinguishable: [distinguishable, conditional, partial, not_distinguishable]
  result: [distinguishable, partial, not_distinguishable]
  kappa: [C1, C2, C3, UNDETERMINED, NO_ALERT]
  true_class: [C1, C2, C3]
  template_id: [range, sched, hold, count, resp, sys, int]
  availability: [available, unavailable]
  channels: [CH-PROV, CH-SYS-WARD, CH-SYS-ROBOT, CH-SQI, CH-XDEV, CH-WIT, CH-CRYPTO, CH-DISP]
  context_channels: [CH-DISP]
  a4_when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
  default_deployment: >-
    The unauthenticated deployment U of threat-model.md: every channel is available and message
    authentication is not deployed, so crypto_temporal.authenticated is None while the sequence and time
    fields of CH-CRYPTO are readings. The profile is assumed to provide the channels of the exclusion
    set, otherwise C1 is unreachable (attribution-rule.md OP-AR-1, ADR-044 proposed). An outcome whose
    when-set maps CH-CRYPTO to available describes the authenticated deployment A. An unavailable
    channel means that all of its fields are None. A channel listed in context_channels (CH-DISP) is fed
    by the group dispenser of contract 0.2.0 (ADR-032, ADR-040), but the hierarchical rule of
    attribution-rule.md treats that group as context and has no row that reads it; an outcome whose
    when-set maps it to available is the verdict of analisi §4.5 and is reproducible only by the
    likelihood attributor of WS05-T12, not by the hierarchical rule.
  row_verdict: >-
    One rule, applied to every row and checked by script. Let N be the outcomes of the row other than
    those that remove the embodied pair (the A4 outcomes, which are reported separately).
    not_distinguishable (declared limit): at least one outcome that removes no channel is not
    distinguishable, that is it attributes the event to the class it masquerades as, with no channel
    able to contradict it; declared_limit is true exactly for these rows. Otherwise: conditional if the
    results over N include both distinguishable and partial (the verdict depends on a channel or
    capability whose loss, or whose presence, changes the result); distinguishable if every result over
    N is distinguishable; partial if no result over N is distinguishable. A row is judged on its listed
    outcomes: the absence of an outcome for a lost channel means that the loss was not derived, not that
    the row is robust; the loss of a required ward-side channel makes any C1 or C2 row abstain
    (invariant I4a of attribution-rule.md).
  crypto_channel: >-
    CH-CRYPTO feeds three fields in two roles. The sequence and time fields
    (crypto_temporal.seq_repeat, crypto_temporal.timestamp_implausible) belong to every exclusion
    set and are read in every deployment, which is why the empty when-set has them available. The other
    half of the old sequence field, the gap, is system.seq_gap (contract 0.2.0, ADR-034): it belongs to
    CH-SYS-WARD with system.ble_link_quality, with which it overlaps. The
    authentication field (crypto_temporal.authenticated) exists only where message authentication is
    deployed. In a when-set, CH-CRYPTO available selects the authenticated deployment (authentication
    backing of a response violation, integrity evidence IE-1); the empty when-set is the deployment
    without authentication. CH-CRYPTO unavailable would mean that all three fields are None and is used
    by no row.
  expected_kappa: >-
    A list; several values mean that the result depends on residual evidence, on the template that is
    violated, or on whether a violation is raised (NO_ALERT: no alert is produced, WS08 counts the event
    as undetected and not as an attribution error).
contract_gaps:
  - id: G-1
    ec_id: EC-GAP-1
    text: "Closed by contract 0.2.0 (ADR-032 accepted, ADR-040 accepted): the group dispenser (dispenser.interval_since_previous_ms, dispenser.content_change; before minus after, a release is positive and a bounce is zero) feeds channel CH-DISP. The hierarchical rule treats the group as context, so an outcome whose when-set maps CH-DISP to available is the verdict of analisi 4.5 and is reproducible only by the likelihood attributor of WS05-T12, not by the hierarchical rule."
    rows: [DX-06, DX-07, DX-22, DX-27]
    adr: ADR-032
  - id: G-2
    ec_id: EC-GAP-2
    text: "The key of the evidence mapping, the node scope of the scalar system fields and the meaning of system.battery_low and witness.robot_present are not stated in the contract; resolved as decisions D-1, D-2 and D-10 of evidence-channels.md."
    rows: [DX-03, DX-05, DX-15, DX-16, DX-17]
    adr: ADR-033
  - id: G-3
    ec_id: EC-GAP-3
    text: "Closed by ADR-034 and contract 0.2.0: the single sequence field of 0.1.0 (was crypto_temporal.seq_gap_or_replay) is split into system.seq_gap (a loss, a C2 symptom, channel CH-SYS-WARD) and crypto_temporal.seq_repeat (a replay, a C3 symptom, channel CH-CRYPTO). Residual: system.seq_gap and system.ble_link_quality carry overlapping information (declared, not resolved); a forged number that jumps ahead leaves a gap and is read as a loss."
    rows: [DX-08, DX-09, DX-13, DX-14, DX-23]
    adr: ADR-034
  - id: G-4
    ec_id: EC-GAP-4
    text: "Event payload keys and the per-message verification outcome were not defined in the trace schema; closed by the accepted ADR-035 (trace evidence conventions and EventKind.VERIFICATION)."
    rows: [DX-08, DX-09, DX-10]
    adr: ADR-035
  - id: G-5
    ec_id: EC-GAP-5
    text: "No task owned the step that builds an EvidenceVector from an observed day; resolved without a contract change (owner WS05-T07)."
    rows: []
    adr: null
  - id: G-6
    ec_id: EC-GAP-6
    text: "No field carries clock health, so clock_skew is not told from timestamp_manipulation and a skew inside the bound is invisible; accepted as a declared limit, no field proposed."
    rows: [DX-18, DX-19, DX-26]
    adr: null
  - id: G-7
    ec_id: EC-GAP-7
    text: "The device battery has no field; the device battery fault is read as ble_dropout or process_kill of the device (declared limit)."
    rows: [DX-13, DX-15]
    adr: null
  - id: G-8
    ec_id: EC-GAP-8
    text: "No contract object carries the device profile (capabilities, lease, deadline) that the derivation needs; C1 is unreachable in a profile that does not declare the exclusion channels."
    rows: [DX-01, DX-02, DX-19, DX-20]
    adr: ADR-036
  - id: G-9
    ec_id: EC-GAP-9
    text: "The meaning of SignalId.AUTH against the verification outcome is not stated; crypto_temporal.authenticated is derived only from verification events (hypothesis, to be confirmed)."
    rows: [DX-09, DX-25]
    adr: ADR-035
  - id: G-10
    ec_id: EC-GAP-10
    text: "The availability of the robot channels is not in the trace; it is derived from the robot NODE_STATE reports (state, colocated)."
    rows: [DX-02, DX-05, DX-09, DX-24]
    adr: ADR-035
  - id: G-11
    ec_id: EC-GAP-11
    text: "The name witness.robot_present suggests the robot is present; the field reads the presence of the patient as perceived by the robot (documentation note)."
    rows: [DX-09, DX-24, DX-25]
    adr: null
  - id: G-12
    ec_id: EC-GAP-12
    text: "SignalId has no member for a PPG-derived heart rate; signal_quality.ppg_sqi reads SPO2 (documentation note)."
    rows: [DX-08, DX-12, DX-23]
    adr: null
rows:
  - id: DX-01
    analisi_row: 1
    basis: analisi_4_5
    event: "Real hypertension (clinical deviation, all channels coherent)"
    true_class: C1
    subtypes: [hypertensive_spike, spontaneous_range]
    violated_templates: [range]
    discriminating_evidence:
      - system.node_lifecycle
      - system.diagnostics_ok
      - system.liveliness_ok
      - system.qos_deadline_missed
      - system.ble_link_quality
      - system.seq_gap
      - signal_quality.cuff_error_code
      - cross_device.pulse_vs_ecg_hr_diff
      - crypto_temporal.authenticated
      - crypto_temporal.seq_repeat
      - crypto_temporal.timestamp_implausible
    proposed_evidence: []
    channels_required_all: [CH-SYS-WARD, CH-SQI, CH-XDEV, CH-CRYPTO]
    channels_required_any: []
    distinguishable: conditional
    outcomes:
      - when: {}
        result: distinguishable
        expected_kappa: [C1]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: distinguishable
        expected_kappa: [C1]
      - when: {CH-SYS-WARD: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
    declared_limit: false
    note: >-
      Worked case W-01 (range, every channel the table reads is available and denied). C1 is claimed by
      exclusion, so the cell is 'distinguishable by exclusion' and needs the ward-side channels. The
      template range reads no robot field, so the A4 outcome repeats the default (transition table of the
      C1 exclusion section: range, count and sys unchanged). The third outcome is the exclusion failing
      when the ward system channel is missing (invariant I4a, decision table row 8); it is derived from
      the table and is not a worked case, and it is the reason for the verdict conditional (rule of the
      vocabulary: a non-embodied channel whose loss makes the outcome partial). Reachability: the outcome
      C1 holds only if the profile provides the channels of the exclusion set; in the reference profile S6
      of evidence-channels.md diagnostics, deadline and independent clocks are None and C1 is unreachable
      for every template (OP-AR-1; ADR-044 proposed). spontaneous_range is the WS04 subtype for violations
      that no injection record explains and follows its template.
  - id: DX-02
    analisi_row: 2
    basis: analisi_4_5
    event: "Drug non-response (clinical response deviation)"
    true_class: C1
    subtypes: [drug_nonresponse, spontaneous_resp]
    violated_templates: [resp]
    discriminating_evidence:
      - system.node_lifecycle
      - system.diagnostics_ok
      - system.liveliness_ok
      - system.qos_deadline_missed
      - system.ble_link_quality
      - system.nav_task_failed
      - system.manip_task_failed
      - system.seq_gap
      - signal_quality.cuff_error_code
      - cross_device.pulse_vs_ecg_hr_diff
      - crypto_temporal.authenticated
      - witness.identity_confirmed
      - witness.intake_observed
      - crypto_temporal.seq_repeat
      - crypto_temporal.timestamp_implausible
    proposed_evidence: []
    channels_required_all: [CH-SYS-WARD, CH-SYS-ROBOT, CH-SQI, CH-XDEV, CH-CRYPTO]
    channels_required_any: [CH-WIT, CH-CRYPTO]
    distinguishable: conditional
    outcomes:
      - when: {}
        result: distinguishable
        expected_kappa: [C1]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2, C3]
      - when: {CH-WIT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C3]
      - when: {CH-CRYPTO: available}
        result: distinguishable
        expected_kappa: [C1]
      - when: {CH-CRYPTO: available, CH-WIT: unavailable}
        result: distinguishable
        expected_kappa: [C1]
      - when: {CH-CRYPTO: available, CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
    declared_limit: false
    note: >-
      Analisi: 'only if there is a witness'. The default deployment is the unauthenticated one (see
      vocabulary.default_deployment), so the default outcome is W-02 (robot witness backs the dose:
      identity confirmed and intake observed). Without the witness and without authentication the table
      abstains (W-02-nowit, W-02-witness-only). With authentication deployed the backing is the
      authentication and the witness is not needed (W-02-auth-witness, W-02-auth). A4 removes the witness
      and the robot task outcomes, which the exclusion set of resp requires, so C1 becomes UNDETERMINED in
      both deployments (W-02-A4; the last outcome is the authenticated deployment with the embodied pair
      removed, W-02-auth-A4). Candidates: a non-response, a dose that was spat out or not taken, a
      robot-side cause (C2), and in the unauthenticated deployment a forged DISPENSE (C3); authentication
      removes the last. C1 is not reached in reference profile S6 (OP-AR-1). spontaneous_resp follows its
      template.
  - id: DX-03
    analisi_row: 3
    basis: analisi_4_5
    event: "Cuff detached, evident failure (error code, node-state change)"
    true_class: C2
    subtypes: [cuff_detached]
    violated_templates: [sched, resp, hold, sys]
    discriminating_evidence:
      - system.node_lifecycle
      - signal_quality.cuff_error_code
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-SYS-WARD, CH-SQI]
    distinguishable: distinguishable
    outcomes:
      - when: {}
        result: distinguishable
        expected_kappa: [C2]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: distinguishable
        expected_kappa: [C2]
    declared_limit: false
    note: >-
      Worked cases W-03 (sys, the variant that reports a measurement) and W-03-sched (the injected form).
      Resolution of the flag of the WS02-T01 review: in the injected form of cuff_detached no sys instance
      is opened (the attempt ends in MEASUREMENT_MISSED, fault-model.md G-SYS-3), so the violated
      templates are sched, resp and hold; sys is listed only for the variant of G-SYS-3. The inflation
      duration is the sys predicate itself and is not independent evidence (analisi §4.5; W-14: a sys
      violation with nothing asserted outside provenance is UNDETERMINED); the independent evidence is the
      device error code and the node-state change, either of which gives C2 (decision table row 4). Both
      fields are ward-side, so A4 leaves the outcome unchanged. If a detachment emits no NODE_STATE event
      (FM OP-16, EC-OP-9) the error code alone decides (W-14-code). A cuff removed by the patient gives
      the same signature; the benchmark injects cuff_detached as C2 by definition and the ambiguity is a
      question for the clinician review (fault-model.md, Patient behaviour is C1). The fault raises no
      crypto field.
  - id: DX-04
    analisi_row: 4
    basis: analisi_4_5
    event: "Cuff with silent bias or drift (plausible values)"
    true_class: C2
    subtypes: [cuff_silent_bias]
    violated_templates: [range, hold, resp]
    discriminating_evidence: []
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: []
    distinguishable: not_distinguishable
    outcomes:
      - when: {}
        result: not_distinguishable
        expected_kappa: [C1]
        masquerades_as: C1
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: not_distinguishable
        expected_kappa: [C1, UNDETERMINED]
        masquerades_as: C1
    declared_limit: true
    note: >-
      Declared limit (analisi §4.5 row 4 and 4.8, ADR-002). No independent channel exists on the pressure
      and the pulse rate stays coherent: the fault raises no field (fault-model.md, fault-to-evidence
      table: the set of paths is empty), so the vector equals W-01 and the table gives C1 (worked case
      W-04, 'table against matrix: agrees'). The claim that a faulty sensor cannot masquerade as a
      clinical event is false for this row; the supportable claim is the one quoted in the section
      Declared limits. The rate at which the row occurs is measured by WS08. Under A4, range keeps C1
      (W-04); hold and resp read the robot task outcomes and lose C1 to UNDETERMINED (transition table),
      which is an abstention and not a detection. The fault can also mask: an offset can move a latent
      out-of-band reading into the band (SATISFIED, no alert, FX-8); WS08 counts that as a missed event
      and not as an attribution error. The violated templates range and resp follow the task text; hold is
      added from fault-model.md (M-VAL on the held reading).
  - id: DX-05
    analisi_row: 5
    basis: analisi_4_5
    event: "Robot late to the measurement window (navigation outcome late or failed)"
    true_class: C2
    subtypes: [nav_delay, impossible_goal, localisation_noise]
    violated_templates: [sched, resp, hold]
    discriminating_evidence:
      - system.nav_task_failed
    proposed_evidence: []
    channels_required_all: [CH-SYS-ROBOT]
    channels_required_any: []
    distinguishable: distinguishable
    outcomes:
      - when: {}
        result: distinguishable
        expected_kappa: [C2]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
    declared_limit: false
    note: >-
      Worked case W-05 (sched, navigation outcome late, stamped at the deadline, H-OVERRUN) and W-05-A4.
      The decisive field is robot-derived, so A4 removes it and the table abstains (W-05-A4, reason
      insufficient): the complete loss of the row under A4. The three subtypes share the evidence path.
      impossible_goal raises it always; nav_delay raises it only if the task layer reports a late arrival
      as a failure (D-5); localisation_noise only when navigation fails or is late (fault-model.md). Where
      it is not raised the vector holds no system evidence and the table abstains; a patient who delays or
      refuses is the C1 alternative (W-05-silent). A robot crash is visible through the liveliness
      aggregate instead (W-05-live; row DX-15).
  - id: DX-06
    analisi_row: 6
    basis: analisi_4_5
    event: "Patient double take (adherence deviation)"
    true_class: C1
    subtypes: [double_take]
    violated_templates: [count]
    discriminating_evidence:
      - dispenser.interval_since_previous_ms
      - dispenser.content_change
    proposed_evidence: []
    channels_required_all: [CH-DISP]
    channels_required_any: []
    distinguishable: conditional
    outcomes:
      - when: {}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
      - when: {CH-DISP: available}
        result: distinguishable
        expected_kappa: [C1]
    declared_limit: false
    note: >-
      Gap G-1 (EC-GAP-1, closed by contract 0.2.0 and ADR-032, accepted). Worked case W-06: the table
      gives UNDETERMINED (reason insufficient) and DIFFERS from the analisi verdict 'yes, if the dispenser
      measures the content', because the hierarchical rule treats the group dispenser (channel CH-DISP) as
      context: it has no row that reads it (C1 is undefined for count, AD-10). The third outcome is the
      analisi §4.5 verdict (a content change present and an interval above the bounce threshold, registry
      name dispense_bounce_interval_ms proposed in ADR-032) and is reproducible only by the likelihood
      attributor of WS05-T12, NOT by the hierarchical rule of attribution-rule.md; consumers must not
      turn an outcome whose when-set names a context channel into a fixture of the hierarchical rule. count reads no robot field, so A4
      repeats the default. A double take and a bounce share the observed Events (confounder
      double_take_vs_bounce of WS04). R3 weakness 4 (a second opening two minutes after the regular one is
      more likely a double take than tampering) is the reason the row is C1.
  - id: DX-07
    analisi_row: 7
    basis: analisi_4_5
    event: "Dispenser sensor bounce (extra DISPENSE event)"
    true_class: C2
    subtypes: [dispenser_bounce]
    violated_templates: [count]
    discriminating_evidence:
      - dispenser.interval_since_previous_ms
      - dispenser.content_change
    proposed_evidence: []
    channels_required_all: [CH-DISP]
    channels_required_any: []
    distinguishable: conditional
    outcomes:
      - when: {}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
      - when: {CH-DISP: available}
        result: distinguishable
        expected_kappa: [C2]
    declared_limit: false
    note: >-
      Gap G-1 (closed by contract 0.2.0). Worked case W-07: the vector equals that of W-06 and the result
      is UNDETERMINED; this DIFFERS from the analisi verdict 'yes' (short interval between events, no
      content change), which needs the two fields of the group dispenser (ADR-032, ADR-040: a bounce has
      content_change zero). The row verdict is therefore conditional on CH-DISP and not distinguishable
      as the task start text said; the third outcome is the analisi verdict and is reproducible only by
      the likelihood attributor of WS05-T12, not by the hierarchical rule, which treats the group as
      context. The interval 'below one second' of
      analisi §4.5 is illustrative, unverified; no number is used here. This row is the count template
      only. The duplicate instances that a bounce opens for hold, resp and int (M-DUPWIN, fault-model.md)
      are row DX-27, which is not distinguishable for the hierarchical rule: the fault raises the two
      conditional dispenser fields, which that rule treats as context, and, by the decision table, a
      duplicate violation of hold or resp with coherent channels reads as C1 even when CH-DISP is
      available, because no rule row reads the dispenser evidence for those templates. A consumer that
      maps the subtype dispenser_bounce to a row must therefore use the pair of subtype and template
      (DX-07 for count, DX-27 for hold, resp and int).
  - id: DX-08
    analisi_row: 8
    basis: analisi_4_5
    event: "Replay of pressure measurements"
    true_class: C3
    subtypes: [replay]
    violated_templates: [range, sched, hold, resp, sys]
    discriminating_evidence:
      - signal_quality.ecg_sqi
      - signal_quality.ppg_sqi
      - system.ble_link_quality
      - cross_device.pulse_vs_ecg_hr_diff
      - crypto_temporal.authenticated
      - crypto_temporal.seq_repeat
      - crypto_temporal.timestamp_implausible
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-CRYPTO, CH-XDEV]
    distinguishable: conditional
    outcomes:
      - when: {}
        result: partial
        expected_kappa: [C3, UNDETERMINED, C1]
        candidates: [C1, C3]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [C3, UNDETERMINED, C1]
        candidates: [C1, C3]
      - when: {CH-CRYPTO: available}
        result: distinguishable
        expected_kappa: [C3]
      - when: {CH-CRYPTO: available, CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: distinguishable
        expected_kappa: [C3]
    declared_limit: false
    note: >-
      Analisi: 'yes with authentication; partial without'. Decision on the flag of the WS02-T02 review:
      the row verdict stays conditional, but the authenticated outcome is restricted to a replay whose
      metadata was rewritten (worked case W-08: crypto_temporal.authenticated asserted, C3). The threat
      model finds the authenticated column of a verbatim naive replay partial (a verbatim copy has a valid
      tag; the repeat is crypto_temporal.seq_repeat and the loss is system.seq_gap since contract 0.2.0,
      TM-GAP-SEQ closed by ADR-034); the rule reaches C3 for it only through the sequence evidence of a device that provides seq with a complete
      delivery ratio (IE-2, W-08-U) and abstains without seq (W-08-U-noseq, reason conflict). Default
      outcome (unauthenticated): C3 for the naive replay with seq (W-08-U), UNDETERMINED for the naive
      replay without seq (W-08-U-noseq), and for the informed replay (nothing raised, vector as W-10) C1
      if a template is violated and no alert otherwise; the last case is the masquerade of DX-10. A replay
      together with a loss is read as a loss (EC D-3, declared cost). Verbatim naive replay without seq in
      the authenticated deployment (threat-model.md calls it partial): the tag is valid, so
      crypto_temporal.authenticated is denied, crypto_temporal.seq_repeat is None and only
      crypto_temporal.timestamp_implausible is asserted, which is never decisive alone; the table gives
      UNDETERMINED, reason conflict (RS-3, the pattern of W-08-U-noseq), partial with the candidates C2
      and C3. A channel mapping cannot express the absence of seq, so this case is carried by the note and
      not by an outcome; the outcome CH-CRYPTO available below is the replay whose metadata was rewritten.
      All evidence is ward-side and C3 never changes under A4 (transition table); on hold and resp the
      informed case loses C1 to UNDETERMINED, so the list is unchanged. The last outcome repeats the
      authenticated outcome with the embodied pair removed.
  - id: DX-09
    analisi_row: 9
    basis: analisi_4_5
    event: "Falsified dispense event"
    true_class: C3
    subtypes: [dispense_forgery]
