  - id: DX-18
    analisi_row: null
    basis: inferred
    event: "Link delay or out-of-order delivery (late or displaced inputs)"
    true_class: C2
    subtypes: [link_delay, out_of_order]
    violated_templates: [sched, resp, hold]
    discriminating_evidence:
