        result: partial
        expected_kappa: [NO_ALERT, UNDETERMINED, C2]
        candidates: [C2, C3]
    declared_limit: false
    note: >-
      Inside the reorder bound every displaced or delayed input is absorbed and the accepted trace is
      identical to the in-order trace (fault-model.md FX-12, V-LATE-2): no violation and no alert. Beyond
      the bound the input is late, not used and counted, which asserts
      crypto_temporal.timestamp_implausible; that field is never decisive alone (one Boolean mixes late,
      future-stamped and replay-related inputs, EC-GAP-6, RS-3), so the result is UNDETERMINED (reason
      conflict) unless a declared deadline gives system.qos_deadline_missed, which is C2. A late input of
      this fault and a replay or a delay by an attacker (DX-08, DX-26) give the same Events: no field
      separates them (threat-model.md, Time as an attack vector, TX-8 (c)), hence the candidates C2 and
      C3. A delayed presence sample can make a violated int (CAS-5, hazard H-10). A4 changes nothing on
      the ward-side evidence. out_of_order beyond the bound is link_delay.
  - id: DX-19
