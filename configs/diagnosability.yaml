  - id: DX-23
    analisi_row: null
    basis: inferred
    event: "Naive BLE injection (plausible values, incoherent across devices)"
    true_class: C3
    subtypes: [injection_naive]
    violated_templates: [range, sched, hold, resp, sys]
    discriminating_evidence:
      - signal_quality.ecg_sqi
      - signal_quality.ppg_sqi
      - system.ble_link_quality
      - system.seq_gap
      - cross_device.pulse_vs_ecg_hr_diff
      - crypto_temporal.authenticated
      - crypto_temporal.seq_repeat
      - crypto_temporal.timestamp_implausible
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-XDEV, CH-CRYPTO]
    distinguishable: conditional
    outcomes:
      - when: {}
        result: distinguishable
        expected_kappa: [C3]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: distinguishable
        expected_kappa: [C3]
      - when: {CH-SQI: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C2, C3]
      - when: {CH-CRYPTO: available}
        result: distinguishable
        expected_kappa: [C3]
    declared_limit: false
    note: >-
      Conditional on the cross-device evidence with the signal quality available: a pulse rate incoherent
      with the ECG while both quality fields are good is integrity evidence (IE-3, worked case W-13-C3).
      If a quality field is low the incoherence is explained away as C2 (W-13) and if a quality field is
      unavailable the table abstains (W-13-U): the third outcome. A naive injection that leaves a sequence
      gap with a degraded link is read as a loss (C2, W-15-jump) and one that repeats a sequence value
      with a complete ratio is C3 (IE-2); with authentication deployed the failed verification is C3
      (IE-1, the last outcome). Injected values inside the care-plan band can raise no violation, in which
      case there is no alert and WS08 counts an undetected C3 event (threat-model.md). Verbatim naive
      replay without seq in the authenticated deployment (threat-model.md calls it partial): the tag is
      valid, so crypto_temporal.authenticated is denied, crypto_temporal.seq_repeat is None and
      only crypto_temporal.timestamp_implausible is asserted, which is never decisive alone; the table
      gives UNDETERMINED, reason conflict (RS-3, the pattern of W-08-U-noseq), partial with the candidates
      C2 and C3. A channel mapping cannot express the absence of seq, so this case is carried by the note
      and not by an outcome; the outcome CH-CRYPTO available below is the replay whose metadata was
      rewritten. All evidence is ward-side and C3 never changes under A4.
  - id: DX-24
    analisi_row: null
    basis: inferred
    event: "Spoofed presence or intake (perception spoofing)"
    true_class: C3
    subtypes: [presence_spoof]
    violated_templates: []
    discriminating_evidence:
      - witness.identity_confirmed
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-WIT]
    distinguishable: not_distinguishable
    outcomes:
      - when: {}
        result: not_distinguishable
        expected_kappa: [NO_ALERT, C1]
        masquerades_as: C1
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [NO_ALERT, UNDETERMINED]
        candidates: [C1, C3]
    declared_limit: true
    note: >-
      Declared limit, derived: analisi lists perception spoofing as an attacker capability and 'simulated
      presence' as an injection but has no matrix row. The robot reports what its sensors were made to
      perceive, and no field says how the observation was obtained (threat-model.md, presence_spoof;
      Non-claims 3: presence is not identity). At the informed level nothing in the twenty fields
      contradicts the spoof; at the naive level only witness.identity_confirmed can read False, and only
      if the robot checks identity. Alone, a spoof can raise no violation (it can only move int upward),
      so there is no alert (NO_ALERT); its effect is to change the evidence of violations that others
      raise: a spoofed INTAKE makes a forged dispense followed by a non-response look like a genuine
      non-response, and the table gives C1 (the vector of W-02). Under A4 the witness no longer enters the
      vector, the response violation loses C1 and the table abstains: the embodied channel is the attack
      surface of this row. Occurrence rate: measured by WS08.
  - id: DX-25
    analisi_row: null
    basis: inferred
    event: "Physical release of a dose at the dispenser by another actor"
    true_class: C3
    subtypes: [dispenser_physical_tamper]
    violated_templates: [count, hold, resp, int]
    discriminating_evidence:
      - witness.identity_confirmed
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-WIT]
    distinguishable: not_distinguishable
    outcomes:
      - when: {}
        result: partial
        expected_kappa: [UNDETERMINED, C1]
        candidates: [C1, C3]
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C3]
      - when: {CH-CRYPTO: available}
        result: not_distinguishable
        expected_kappa: [C1, UNDETERMINED]
        masquerades_as: C1
      - when: {CH-CRYPTO: available, CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C3]
    declared_limit: true
    note: >-
      Declared limit, inferred (threat-model.md, dispenser_physical_tamper): the release is a genuine
      device output, so no crypto_temporal field is raised in either deployment, and an authenticated
      event proves the origin device and not the intake or the actor (ADR-004). Unauthenticated: int is
      violated and gives UNDETERMINED, reason provenance-only (as W-09); resp with a witness that saw no
      intake gives UNDETERMINED, reason conflict (as W-09-resp); count gives UNDETERMINED; hold gives C1
      by the decision table (no worked case). Authenticated: int is satisfied, the authentication backs
      resp and the result is C1 (as W-02-auth) while count stays UNDETERMINED: a masquerade as the
      patient's own behaviour, hence the row verdict. Only a co-located robot that checks identity can
      contradict the release through witness.identity_confirmed (EC D-6), and an informed spoofed witness
      removes even that. Under A4 hold and resp lose C1 to UNDETERMINED. The last outcome is the
      authenticated outcome with the embodied pair removed.
  - id: DX-26
    analisi_row: null
    basis: inferred
    event: "Timestamp manipulation (rewritten or delayed time metadata)"
    true_class: C3
    subtypes: [timestamp_manipulation]
    violated_templates: [sched, hold, range, resp]
    discriminating_evidence:
      - crypto_temporal.authenticated
      - crypto_temporal.timestamp_implausible
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: [CH-CRYPTO]
    distinguishable: not_distinguishable
    outcomes:
      - when: {}
        result: not_distinguishable
        expected_kappa: [C1, UNDETERMINED]
        masquerades_as: C1
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: not_distinguishable
        expected_kappa: [C1, UNDETERMINED]
        masquerades_as: C1
      - when: {CH-CRYPTO: available}
        result: partial
        expected_kappa: [C3, UNDETERMINED, C1]
        candidates: [C1, C2, C3]
    declared_limit: true
    note: >-
      Declared limit from gap G-6 (EC-GAP-6, TM-GAP-TIME; threat-model.md, Time as an attack vector,
      TX-8). Unauthenticated: a displacement inside the acceptance bounds is accepted, unflagged and can
      change a verdict (sched and hold), so with coherent channels the table gives C1; beyond the bounds
      crypto_temporal.timestamp_implausible is the only evidence, never decisive alone, and the result is
      UNDETERMINED (RS-3). An attacker's delay and a link delay are the same Event with the same new
      sequence value, and a forward stamp and a clock skew ahead are the same reading: no field separates
      C3 from C2 here (DX-18, DX-19). Authenticated: a rewritten stamp invalidates the tag and gives C3
      (IE-1); a verbatim delay keeps the tag valid and leaves only lateness beyond the bound, so the row
      stays partial. Not injected in benchmark v1 unless WS04-T08 decides otherwise. Under A4 the
      ward-side evidence is unchanged.
  - id: DX-27
    analisi_row: null
    basis: inferred
    event: "Duplicate hold, response or integrity instance opened by a dispenser bounce"
    true_class: C2
    subtypes: [dispenser_bounce]
    violated_templates: [hold, resp, int]
    discriminating_evidence: []
    proposed_evidence: []
    channels_required_all: []
    channels_required_any: []
    distinguishable: not_distinguishable
    outcomes:
      - when: {}
        result: not_distinguishable
        expected_kappa: [C1, UNDETERMINED]
        masquerades_as: C1
      - when: {CH-WIT: unavailable, CH-SYS-ROBOT: unavailable}
        result: partial
        expected_kappa: [UNDETERMINED]
        candidates: [C1, C2]
    declared_limit: true
    note: >-
      Derived from fault-model.md (M-DUPWIN, FX-16, OP-12) and the decision table; there is no worked
      case. A bounce raises the two conditional fields of the group dispenser (fault-to-evidence table, condition DSP), and the extra
      DISPENSE anchors a duplicate instance of hold, resp and int that can be violated where the real
      instance is not. With coherent channels a duplicate hold violation reads as C1 (exclusion set of
      hold satisfied), a duplicate resp violation reads as C1 when the dose is backed by the witness or by
      authentication (as W-02) and is UNDETERMINED otherwise, and a duplicate int violation is
      UNDETERMINED, reason provenance-only (AD-3, hazard H-10): a C2 bounce can masquerade as a clinical
      deviation through hold and resp. The dispenser group of contract 0.2.0 (ADR-032) does not change this for the
      hierarchical rule, because no rule row reads it for these templates (it is context); the
      likelihood attributor of WS05-T12 reads it. Under A4 hold and resp lose C1 to UNDETERMINED (transition
      table). The count instance of the same fault is DX-07. The occurrence rate is measured by WS08.
