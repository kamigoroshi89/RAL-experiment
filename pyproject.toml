[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ralmon"
version = "0.0.0"
description = "Runtime safety monitor for clinical-pathway specifications (ROS-independent core)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    # IsolationForest for baseline B2 (WS06-T03). Unpinned like the others (ADR-016 defers pins). No lower bound is written:
    # the version developed and tested against is 1.9.1, which needs Python 3.11, while ralmon allows Python 3.10
    # (ADR-042), so a bound would make the package unsolvable there. scipy 1.18.1 (pulled in) needs Python 3.12 and
    # numpy 2, so on a Python 3.10 image with numpy < 2 pip resolves older scikit-learn and scipy: untested, record the
    # resolved versions in the release notes.
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ralmon = ["py.typed"]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.mypy]
strict = true
files = ["src/ralmon"]

[[tool.mypy.overrides]]
# scikit-learn ships no py.typed marker and no stubs (installed 1.9.1); B2 uses IsolationForest only.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Placeholders are empty by design; the decorator of ralmon._stub supplies the failure.
module = [
    "ralmon.signals._stubs",
    "ralmon.spec._stubs",
    "ralmon.monitor._stubs",
    "ralmon.conformal._stubs",
    "ralmon.attribution._stubs",
    "ralmon.benchmark._stubs",
    "ralmon.baselines._stubs",
    "ralmon.eval._stubs",
]
disable_error_code = ["empty-body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
