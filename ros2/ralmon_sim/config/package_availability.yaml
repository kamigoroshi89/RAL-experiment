# Package availability record of the simulation stack (WS07-T01).
#
# Every status, version and source below was read from the source named next to it, or observed by
# a command whose output is saved in doc/availability.md (section Reproduction), on `checked_on`.
# The machine-checked schema is ros2/ralmon_sim/test/test_package_availability.py.
#
# status: available | partial | unavailable | unverified | not_evaluated
#   available   the component exists for the target and was observed in the image of `host.route`
#   partial     it exists but part of what a later task needs was not shown (see notes)
#   unverified  not checked; `human_action` says what a human has to do
# `version` is only filled from a source (`source_url`); `evidence` lists URLs and commands.
schema_version: 1
task: WS07-T01
checked_on: "2026-10-08"
checked_by: agent

host:
  os_release: "Ubuntu 26.04.1 LTS (Resolute Raccoon)"
  kernel: "Linux 7.0.0-38-generic"
  architecture: x86_64
  cpu_model: "AMD Ryzen 9 8940HX with Radeon Graphics"
  cores: 16
  threads: 32
  ram_gb: 29.9
  gpu: >-
    NVIDIA GeForce RTX 5070 Laptop GPU (driver 580.178.04, 8151 MiB) and an AMD Raphael iGPU.
    Not used: the simulation renders on the CPU (Xvfb with Mesa llvmpipe), so a machine without a
    GPU runs the same route.
  supported_platform: false
  supported_platform_source: "https://raw.githubusercontent.com/ros-infrastructure/rep/master/rep-2000.rst (Humble Hawksbill targets Ubuntu Jammy 22.04 amd64, Tier 1; this host is Ubuntu 26.04)"
  sudo: "none (sudo asks for a password); unprivileged user namespaces are restricted (kernel.apparmor_restrict_unprivileged_userns = 1)"
  docker: "Docker client 29.5.0, server 29.8.0, Compose v5.1.1; data root under /var/snap/docker (bind mounts of /tmp showed an empty directory, so scratch files lived under outputs/)"
  route: >-
    Container for every step: docker compose --profile ros2 run --rm ros2 (image ralmon-ros2:humble,
    docker/Dockerfile.ros2, base image ros:humble-ros-base, Ubuntu 22.04.5, Python 3.10.12).
    The repository is mounted at /work and the container runs as the host user.
  base_image: "ros:humble-ros-base, digest sha256:860e53793ccf575e5369b5e9a19939de2bfcfb46a299954d06f54f2af54fed19 (docker pull on 2026-10-08)"

target:
  ros_distro: humble
  gazebo: classic
  gazebo_fallback: fortress
  python_floor: "3.10"

verdict: supersede_adr_011
superseding_adr: ADR-042
verdict_reasons:
  - "ADR-042 (accepted 2026-10-08) already supersedes ADR-011 and ADR-016; no new ADR is needed."
  - "The four gate components (ros2_distro, gazebo, ros_gz_bridge, nav2) are available for Humble with Gazebo Classic, observed in the image."
  - "The PAL TIAGo and TIAGo Pro simulation packages exist as ROS apt binaries for Humble only (no Jazzy branch in tiago_simulation), and both launched with Nav2 in the image."
  - "What is new compared with ADR-042: the PAL packages install and launch outside the PAL developer Docker image; the new-Gazebo option on Humble is Fortress; ros_gz_bridge on Humble binaries serves Fortress, not Classic (Classic uses gazebo_ros_pkgs); system numpy 1.21.5 is too old for the ralmon core (see doc/availability.md, Proposed ADR)."

components:
  ros2_distro:
    status: available
    version: "Humble Hawksbill (REP 2000: Ubuntu Jammy 22.04, Python 3.10.4)"
    source_url: https://raw.githubusercontent.com/ros-infrastructure/rep/master/rep-2000.rst
    evidence:
      - "REP 2000, section Humble Hawksbill: Ubuntu Jammy (22.04) amd64 Tier 1; dependency table rows Python 3.10.4, NumPy 1.21.5, Gazebo Classic 11.x.x, Gazebo (Ignition) Fortress."
      - "command in ralmon-ros2:humble: python3 --version prints Python 3.10.12 and echo $ROS_DISTRO prints humble (doc/availability.md, Reproduction step 1)."
      - "docker pull ros:humble-ros-base succeeded; digest in host.base_image."
    python_in_image: "3.10.12"
    python_vs_floor: "satisfies the Python 3.10 floor of ADR-042; would not satisfy the retired 3.11 floor of ADR-016"
    verified_on: "2026-10-08"
    verified_by: agent

  gazebo:
    status: available
    version: "Gazebo Classic 11.10.2+dfsg-1 (Ubuntu jammy package gazebo)"
    source_url: https://packages.ubuntu.com/jammy/gazebo
    evidence:
      - "command in ralmon-ros2:humble: gazebo --version prints 'Gazebo multi-robot simulator, version 11.10.2'."
      - "REP 2000 Humble dependency table: Gazebo Classic 11.x.x for Ubuntu Jammy."
      - "headless gzserver with gazebo_ros_init loaded the AWS hospital world: /clock published 2 s after start, /spawn_entity and /get_model_list present (doc/availability.md, Reproduction step 7)."
      - "the PAL launch files of tiago_gazebo and tiago_pro_gazebo offer gazebo_version in ['gazebo', 'classic'] with default 'classic' (ros2 launch --show-args)."
    fallback: >-
      Fortress is the new-Gazebo option on Humble. Observed: ign gazebo --versions prints 6.18.0
      (libignition-gazebo6, pulled in by ros-humble-ros-gz-sim); gazebo-tooling collection-fortress.yaml
      lists gz-sim at ign-gazebo6 and gz-sensors at ign-sensors6, the library that tiago_gazebo and
      tiago_pro_gazebo depend on (gz-sensors6). No Fortress simulation was launched.
    notes: >-
      Gazebo Classic is end of life since January 2025 (the notice printed by gazebo_ros_init at
      start-up says so); a known reproducibility risk recorded by ADR-042. In the TIAGo smoke test the laser
      scan topics appeared only when an X display was present: Xvfb with Mesa software rendering
      worked (Xvfb is not part of the image).
    verified_on: "2026-10-08"
    verified_by: agent

