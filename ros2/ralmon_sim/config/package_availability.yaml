  tc_netem:
    status: partial
    version: "iproute2 5.15.0-1ubuntu2.2 (jammy-updates pocket, the version in the image; the jammy release pocket has 5.15.0-1ubuntu2)"
    source_url: https://packages.ubuntu.com/jammy-updates/iproute2
    evidence:
      - "host: /usr/sbin/tc exists (iproute2 6.19.0); module sch_netem.ko.zst exists for kernel 7.0.0-38-generic; the host user has no sudo and unprivileged user namespaces are restricted, so netem cannot be configured on the host without a human."
      - "throw-away container as root with docker run --cap-add NET_ADMIN (own network namespace): tc qdisc add dev lo root netem loss 30% exit 0; tc qdisc show prints 'qdisc netem 8001: root refcnt 2 limit 1000 loss 30%'; deleted afterwards."
      - "message-count probe (scripts/netem_probe.py: 1000 best-effort messages at 100 Hz, publisher and subscriber as two processes of the same container; two runs, received messages out of 1000, first run / second run): CycloneDDS without netem 1000 / 1000, netem 30% on lo 698 / 704, netem 30% on eth0 1000 / 1000; Fast DDS default transports without netem 1000 / 1000, netem 30% on lo 941 / 1000, netem 30% on eth0 1000 / 1000; Fast DDS with a UDP-only transport profile and netem 30% on lo 233 / 715."
    privilege: "CAP_NET_ADMIN (root in a container started with --cap-add NET_ADMIN, or root on the host); the compose service ros2 runs as the host user without the capability"
    same_host_dds: >-
      Same-host DDS traffic reached the subscriber through the loopback interface: netem on lo
      dropped messages and netem on eth0 dropped none. CycloneDDS delivered 69.8 % and 70.4 % of
      the messages at a nominal packet loss of 30 % (two runs), so a drop probability on lo acts
      as expected. Fast DDS with its default transports delivered 94.1 % and 100 %: netem on lo
      had little or no effect. Fast DDS with a UDP-only transport profile (useBuiltinTransports
      false, one UDPv4 descriptor; the XML is in Reproduction step 9 of doc/availability.md)
      delivered 23.3 % and 71.5 %, a threefold spread between two runs. The causes of the Fast
      DDS behaviour were not isolated. To use netem as a fault, run CycloneDDS or repeat the
      probe with the RMW and profile of the experiment.
    notes: >-
      Partial: netem works inside a container with NET_ADMIN, which proves the tool and the kernel
      module on this host kernel and the effect on a same-host stream. It does not prove that the
      host user can configure the host network, and it was run twice per row (two runs, no statistics). WS07-T05
      needs a compose service with cap_add NET_ADMIN (not added here) and has to repeat the probe
      with the RMW it uses.
    human_action: "If netem is wanted outside a container, a human with root runs the commands of doc/availability.md section Reproduction step 9 on the host, or approves a compose service with cap_add NET_ADMIN."
    verified_on: "2026-10-08"
    verified_by: agent

