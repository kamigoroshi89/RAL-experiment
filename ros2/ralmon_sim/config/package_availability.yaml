    source_url: https://raw.githubusercontent.com/ros/rosdistro/master/humble/distribution.yaml
    evidence:
      - "rosdistro humble/distribution.yaml: ros_gz release 0.244.26-1 (packages ros_gz_bridge, ros_gz_sim, ros_gz_interfaces) and gazebo_ros_pkgs release 3.9.0-1 (packages gazebo_ros, gazebo_plugins, gazebo_msgs, gazebo_dev)."
      - "ros_gz README (branch humble): table row 'Humble | Fortress | humble | https://packages.ros.org'; Garden and Harmonic on Humble come from packages.osrfoundation.org; Classic is not listed."
      - "command in ralmon-ros2:humble: dpkg-query prints ros-humble-ros-gz-bridge 0.244.26-1jammy and ros-humble-gazebo-ros-pkgs 3.9.0-1jammy; ros2 pkg prefix finds gazebo_ros, ros_gz_bridge and ros_gz_sim under /opt/ros/humble."
