# Golden examples of the three-valued online semantics (WS01-T05).
# 24 hand-computed verdict cases: V-SCHED-1 to V-SCHED-5b (6), V-PRED-1 to V-PRED-3 (3), V-RESP-1 to V-RESP-6 (6),
# V-COUNT-1 to V-COUNT-4 (4), V-INT-1 to V-INT-3 (3), V-LATE-1 and V-LATE-2 (2).
# Normative description: docs/formal/05-three-valued-semantics.md (section 9 says how WS05 loads this file).
#
# Every parameter below is a row of the fixture registry F0 (test-only, WS01 README; NOT the clinical registry,
# never to be copied into configs/registry/hypertension.yaml). The rows used, copied from the F0 table
# (name | value | unit | origin):
#   sched_window                  | 1800000   | ms     | FIXTURE-ONLY
#   scale_sched                   | 1800000   | ms     | analisi §4.2 example, 30 min
#   delta1                        | 3600000   | ms     | analisi §4.6 window [08:00, 10:00] of a 07:00 dispense (illustrative, unverified)
#   delta2                        | 10800000  | ms     | same source
#   delta_resp                    | 10        | mmHg   | FIXTURE-ONLY
#   bound_bp_lower, bound_bp_upper | 50, 250  | mmHg   | analisi §4.7 example (illustrative, unverified)
#   scale_resp                    | 20        | mmHg   | FIXTURE-ONLY (same as scale_range)
#   dose_max_24h                  | 2         | dose   | analisi §4.1 (illustrative, unverified)
#   dose_min_day_end              | 2         | dose   | analisi §4.1 (illustrative, unverified)
#   scale_count                   | 1         | dose   | analisi §4.2 example
#   int_window                    | 300000    | ms     | analisi §4.1, 5 min (illustrative, unverified)
#   scale_int                     | 300000    | ms     | FIXTURE-ONLY
#   cuff_error_sd                 | 6         | mmHg   | FIXTURE-ONLY (Gaussian error model of rho, T06)
#   step_ms (T_s)                 | 60000     | ms     | FIXTURE-ONLY monitor configuration
#   reorder_delay_ms (D)          | 0; 30000 in the reorder examples | ms | FIXTURE-ONLY monitor configuration
# FIXTURE-ONLY means: chosen for hand arithmetic, no clinical meaning, no claim about any device or guideline.
# Values that look like clinical numbers are illustrative and unverified (analisi §4.1, §4.6, §4.7, ADR-020).
#
# Times are integer milliseconds since the start of the patient-day trace; the hh:mm label is in a comment
# (t_ms = (60 * hh + mm) * 60000). Infinite values are written -.inf and .inf. The grid is t_k = k * 60000,
# k = 0..1440; an event or sample with device time t is visible at step ceil(t / 60000) (ceiling rule, T01).
#
# Convention of this file. A case describes the record rec(i, k) of ONE template instance at ONE finalised step k:
#   eval_at_ms     is the monitor time handed to advance(t); the finalised step is k = floor((t - D) / T_s)
#                  (D = reorder_delay_ms), so expected.t_eval_ms = k * T_s (equal to eval_at_ms when D = 0);
#   inputs         lists everything the monitor received (README format) and nothing from the latent trace;
#                  inputs.instance names the instance under test (template and anchor);
#   expected       has the fields of VerdictRecord that this task defines: state, sigma_interval,
#                  sigma_norm_interval, rho (null or kind and value), decided_at_ms, pending_until_ms, and t_eval_ms.
#                  Raw intervals are in the native unit (expected.unit); normalised intervals use the F0 scale of the
#                  template, clip(x / s, -1, 1), with +-inf mapped to +-1 (WS01-T04).
# Keys added by this file (not in the README format):
#   fixture.f0_rows               the F0 rows the case uses (name: value);
#   inputs.instance               {template, anchor_ms}; templates: sched, resp, count_limit, count_end, int;
#   inputs.channels_unavailable   list of {signal, from_ms, to_ms} (both ends included): steps at which the channel
#                                 of the robot is unavailable (T01 section 3.5); an unlisted robot channel is available;
#   inputs.forecast, inputs.calibrator   (V-PRED-1) the forecast path and the calibrator fixture;
#   inputs.previous_records       (V-PRED-2, V-PRED-3) the case whose run must precede this one (a replay);
#   expected.unit                 the unit of the raw interval;
#   expected.guard_failed         the marker of the margin and guard rule (T02 section 2.1), set when the value at the
#                                 decision step is -inf;
#   expected.marker               the auxiliary marker of an undecidable record (section 3.5 of the document);
#   expected.tie_rule             true when the state follows from the tie rule of section 3.4 of the document;
#   expected.previous_state, expected.false_predictive_alarm, expected.emitted_at_monitor_ms,
#   expected.late_inputs          annotations of the V-PRED and V-LATE cases;
#   expected.alternative_not_adopted   (V-LATE-2 only) the value that the task text gave and the document does not adopt.
# State names are the values of VerdictState (pending, predicted_violation, violated, satisfied); rho kinds are the
# values of RhoKind. The guarantee and assumptions strings of Rho belong to WS01-T06 and are not given here.

- id: V-SCHED-1
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture (analisi §4.7 step 2: unknown future replaced by a bound); tick of G-SCHED-1"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
  eval_at_ms: 33000000   # 09:10, step 550
  expected:
    t_eval_ms: 33000000
    state: pending
    unit: ms
    sigma_interval: [-.inf, 1140000.0]
    sigma_norm_interval: [-1.0, 0.6333333333333333]
    rho: null
    decided_at_ms: null
    pending_until_ms: 34200000   # 09:30
  hand_calculation: "Tick 32400000 (09:00): k_a = 32400000 / 60000 = 540; w = sched_window / step_ms = 1800000 / 60000 = 30 steps; k_d = 540 + 30 = 570, t_d = 34200000 (09:30) = pending_until_ms. Evaluation step k = 550 (33000000, 09:10); steps <= 550 are known and carry no measurement, so lo = -inf (no measurement may ever come before the horizon). The earliest measurement that can still be accepted is visible at step 551 (09:11), one step after the evaluation step; its slack is t_570 - t_551 = 19 * 60000 = 1140000 ms, so hi = (a + W) - (t + T_s) = 09:30 - 09:11 = 19 min = 1140000 ms. Normalised: lo = -inf maps to -1; hi = 1140000 / 1800000 = 19 / 30 = 0.6333333333333333. hi >= 0 and lo <= 0, so the state is PENDING; decided_at_ms is None."

- id: V-SCHED-2
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; measurement of G-SCHED-1 (early satisfaction before the deadline)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
      - {kind: measurement, t_device_ms: 32700000, t_rx_ms: 32700000, source: cuff, payload: {}, seq: null}   # 09:05 measurement event
  eval_at_ms: 32700000   # 09:05, step 545
  expected:
    t_eval_ms: 32700000
    state: satisfied
    unit: ms
    sigma_interval: [1500000.0, 1500000.0]
    sigma_norm_interval: [0.8333333333333334, 0.8333333333333334]
    rho: null
    decided_at_ms: 32700000   # 09:05
    pending_until_ms: 34200000   # 09:30
  hand_calculation: "k_a = 540, k_d = 570, t_d = 34200000 as in V-SCHED-1. The measurement has device time 32700000, visible at step 32700000 / 60000 = 545 (09:05). At the evaluation step 545 it is known: its slack is t_570 - t_545 = 25 * 60000 = 1500000 ms, so lo = 1500000. Any measurement accepted later is visible at a step >= 546 and has slack <= 24 * 60000 = 1440000 < 1500000, so the maximum cannot grow: hi = max(1500000, 1440000) = 1500000. The interval is the point [1500000, 1500000] (25 min). lo > 0: SATISFIED (contract rule 1) at the step 545, 25 min before the deadline; decided_at_ms = 32700000. Normalised 1500000 / 1800000 = 5 / 6 = 0.8333333333333334 for both ends. Same value as G-SCHED-1 of templates.yaml, which evaluates at k_d."

- id: V-SCHED-3
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture (deadline reached with no measurement; analisi §4.7 step 2)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
  eval_at_ms: 34200000   # 09:30, step 570 = k_d
  expected:
    t_eval_ms: 34200000
    state: violated
    unit: ms
    sigma_interval: [-.inf, -60000.0]
    sigma_norm_interval: [-1.0, -0.03333333333333333]
    rho: {kind: deterministic, value: 1.0}
    decided_at_ms: 34200000   # 09:30
    pending_until_ms: 34200000
    guard_failed: no_measurement_after_tick
  hand_calculation: "k_a = 540, k_d = 570 (34200000, 09:30). At the evaluation step k = 570 all steps of the decision window [540, 570] are known and carry no measurement: lo = -inf. A measurement can still be accepted at step 571 (09:31) or later; its slack is t_570 - t_571 = -60000 ms, so hi = (a + W) - (t + T_s) = 09:30 - 09:31 = -60000 ms (negative: a late measurement). hi < 0: VIOLATED (contract rule 1) at k = 570, decided_at_ms = 34200000. The value at the decision step is -inf (guard no_measurement_after_tick, T02 section 2.1); the finite hi grades the lateness that a later measurement can still have. Normalised: -inf maps to -1; -60000 / 1800000 = -0.03333333333333333. Rho is DETERMINISTIC 1.0: the violation is the absence of an event in the log (analisi §4.4, third row)."

- id: V-SCHED-4
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; tie at the deadline (CP3, G-SCHED-2 of templates.yaml)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
      - {kind: measurement, t_device_ms: 34200000, t_rx_ms: 34200000, source: cuff, payload: {}, seq: null}   # 09:30 measurement event, exactly on the deadline
  eval_at_ms: 34200000   # 09:30, step 570 = k_d
  expected:
    t_eval_ms: 34200000
    state: satisfied
    unit: ms
    sigma_interval: [0.0, 0.0]
    sigma_norm_interval: [0.0, 0.0]
    rho: null
    decided_at_ms: 34200000   # 09:30
    pending_until_ms: 34200000
    tie_rule: true
  hand_calculation: "k_a = 540, k_d = 570. The measurement has device time 34200000, visible at step 34200000 / 60000 = 570 = k_d (an event exactly on a grid time is visible at that step). Its slack is t_570 - t_570 = 0 ms, so lo = 0. A measurement accepted later is visible at a step >= 571 and has slack <= -60000, so hi = max(0, -60000) = 0. The interval is the point [0, 0]. Contract rule 1 gives neither VIOLATED (hi < 0 is false) nor SATISFIED (lo > 0 is false), so the rule alone leaves PENDING although no unknown can change the value. The instance is closed (k = k_d: no unknown step remains in the decision window) and the interval is the point 0, so the tie rule of the document (section 3.4) applies: the atoms are non-strict, equality satisfies, the Boolean value is satisfied. SATISFIED at 34200000. Normalised 0 / 1800000 = 0."

- id: V-SCHED-5a
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; the same instance as V-SCHED-3, ten minutes after the deadline"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
  eval_at_ms: 34800000   # 09:40, step 580
  expected:
    t_eval_ms: 34800000
    state: violated
    unit: ms
    sigma_interval: [-.inf, -660000.0]
    sigma_norm_interval: [-1.0, -0.36666666666666664]
    rho: {kind: deterministic, value: 1.0}
    decided_at_ms: 34200000   # 09:30
    pending_until_ms: 34200000
    guard_failed: no_measurement_after_tick
  hand_calculation: "As V-SCHED-3, evaluated at k = 580 (09:40). Steps <= 580 are known and carry no measurement: lo = -inf. The earliest measurement that can still be accepted is visible at step 581 (09:41): slack t_570 - t_581 = -11 * 60000 = -660000 ms, so hi = -660000 (the bound on the lateness has grown by ten steps; the interval is contained in that of V-SCHED-3, stability). hi < 0: VIOLATED. decided_at_ms stays 34200000, the first step with hi < 0 (the state of an absorbing verdict does not move). Normalised: -1 and -660000 / 1800000 = -0.36666666666666664."

- id: V-SCHED-5b
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; G-SCHED-3 of templates.yaml (graded lateness, 21 min late)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
      - {kind: measurement, t_device_ms: 35460000, t_rx_ms: 35460000, source: cuff, payload: {}, seq: null}   # 09:51 measurement event, 21 min after the deadline
  eval_at_ms: 35460000   # 09:51, step 591
  expected:
    t_eval_ms: 35460000
    state: violated
    unit: ms
    sigma_interval: [-1260000.0, -1260000.0]
    sigma_norm_interval: [-0.7, -0.7]
    rho: {kind: deterministic, value: 1.0}
    decided_at_ms: 34200000   # 09:30
    pending_until_ms: 34200000
    guard_failed: no_measurement_after_tick
  hand_calculation: "k_a = 540, k_d = 570. The measurement has device time 35460000, visible at step 591 (09:51). At k = 591 it is known: slack t_570 - t_591 = -21 * 60000 = -1260000 ms, so lo = -1260000. A later measurement has a smaller slack, so hi = max(-1260000, slack of step 592) = -1260000: the point [-1260000, -1260000], contained in the interval of V-SCHED-5a. hi < 0: VIOLATED; decided_at_ms = 34200000 because the verdict was already definitive at step 570 (the value at the decision step is -inf: guard no_measurement_after_tick); the late measurement only refines the raw value (graded lateness, T02 section 2.3). Normalised -1260000 / 1800000 = -0.7."

- id: V-PRED-1
  contract: ["02-interfaces.md#verdict", "02-interfaces.md#conformal-calibrator"]
  source: "plan fixture; V-SCHED-1 with a forecast of the robot arrival (analisi §4.3: care-delivery deadline); calibrator fixture C-1 and C-2 of the WS01-T06 task text"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
    forecast:
      made_at_ms: 33000000   # 09:10, the designated prediction instant
      target: "measurement of the instance sched@32400000"
      predicted_t_device_ms: 34800000   # 09:40: forecast arrival of the robot
      predicted_sigma_raw_ms: -600000.0   # slack t_570 - t_580
      scale_ms: 1800000
      sigma_hat: -0.3333333333333333
    calibrator:
      source: "fixture C-1 of the WS01-T06 task text (the document 06 does not exist yet)"
      scores: [-0.30, -0.22, -0.18, -0.12, -0.05, 0.00, 0.04, 0.09, 0.15]
      n: 9
      alpha: 0.2
      variant: likely
      q: 0.09   # ceil((n + 1)(1 - alpha)) = 8th smallest score
  eval_at_ms: 33000000   # 09:10, step 550
  expected:
    t_eval_ms: 33000000
    state: predicted_violation
    unit: ms
    sigma_interval: [-.inf, 1140000.0]
    sigma_norm_interval: [-1.0, 0.6333333333333333]
    rho: {kind: predicted, value: 0.9, alpha: 0.2, alpha_star: 0.1}
    decided_at_ms: null
    pending_until_ms: 34200000   # 09:30
  hand_calculation: "The measured prefix is that of V-SCHED-1: interval [-inf, 1140000] ms, normalised (-1, 0.6333), state PENDING; the forecast does not change a single field of the interval. Forecast: the robot is expected to measure at 09:40, a device time on the grid, step 580, whose slack is t_570 - t_580 = -10 * 60000 = -600000 ms; sigma_hat = -600000 / 1800000 = -0.3333333333333333 (normalised units). Variant likely, alpha = 0.2, n = 9: the upper quantile is the ceil((9 + 1)(1 - 0.2)) = 8th smallest score = 0.09. sigma_hat + q = -0.3333 + 0.09 = -0.2433 < 0, so PREDICTED_VIOLATION is emitted (only while PENDING, contract rule 2). alpha* = inf{alpha : sigma_hat + q_{1-alpha} < 0}: q < 1/3 holds for every rank r <= 9 (all nine scores are below 1/3), so m = #{R_i < -sigma_hat} = 9 and alpha* = (n + 1 - m) / (n + 1) = (9 + 1 - 9) / 10 = 0.1, rho = 1 - alpha* = 0.9 (kind PREDICTED, Rho.alpha = the configured level 0.2). decided_at_ms is None; pending_until_ms is the deadline 34200000."

- id: V-PRED-2
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; continuation of V-PRED-1 (false predictive alarm)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
      - {kind: measurement, t_device_ms: 33900000, t_rx_ms: 33900000, source: cuff, payload: {}, seq: null}   # 09:25 measurement event (the forecast said 09:40)
    previous_records: ["V-PRED-1"]
  eval_at_ms: 33900000   # 09:25, step 565
  expected:
    t_eval_ms: 33900000
    state: satisfied
    unit: ms
    sigma_interval: [300000.0, 300000.0]
    sigma_norm_interval: [0.16666666666666666, 0.16666666666666666]
    rho: null
    decided_at_ms: 33900000   # 09:25
    pending_until_ms: 34200000
    previous_state: predicted_violation
    false_predictive_alarm: true
  hand_calculation: "The record of V-PRED-1 (PREDICTED_VIOLATION at 09:10) is sticky until a definitive verdict. A measurement arrives with device time 33900000 (09:25), visible at step 565: slack t_570 - t_565 = 5 * 60000 = 300000 ms; later measurements have a smaller slack, so the interval is the point [300000, 300000]. lo > 0: SATISFIED at step 565 (transition PREDICTED_VIOLATION -> SATISFIED of the contract); the earlier warning is counted as a false predictive alarm. rho is None for a SATISFIED record. Normalised 300000 / 1800000 = 1/6 = 0.16666666666666666."

- id: V-PRED-3
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; continuation of V-PRED-1 (the warning is confirmed by the measured prefix)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {sched_window: 1800000, scale_sched: 1800000}}
  inputs:
    instance: {template: sched, anchor_ms: 32400000}
    samples: []
    events:
      - {kind: schedule_tick, t_device_ms: 32400000, t_rx_ms: 32400000, source: care_plan, payload: {}, seq: null}   # 09:00 schedule tick
    previous_records: ["V-PRED-1"]
  eval_at_ms: 34200000   # 09:30, step 570 = k_d
  expected:
    t_eval_ms: 34200000
    state: violated
    unit: ms
    sigma_interval: [-.inf, -60000.0]
    sigma_norm_interval: [-1.0, -0.03333333333333333]
    rho: {kind: deterministic, value: 1.0}
    decided_at_ms: 34200000   # 09:30
    pending_until_ms: 34200000
    previous_state: predicted_violation
    guard_failed: no_measurement_after_tick
  hand_calculation: "As V-SCHED-3: at step 570 no measurement is known and hi = -60000 < 0, so the record moves from PREDICTED_VIOLATION to VIOLATED (contract transition). The record is the same as that of V-SCHED-3: the definitive verdict comes from the measured prefix only; the earlier prediction leaves no trace in state, interval, rho or decided_at_ms (the predicted rho of V-PRED-1 is replaced by the DETERMINISTIC one of the definitive record). Normalised -1 and -0.03333333333333333."

- id: V-RESP-1
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; analisi §4.6 window [08:00, 10:00] of a 07:00 dispense; pre-dose measurement of G-RESP-1"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {delta1: 3600000, delta2: 10800000, delta_resp: 10, bound_bp_lower: 50, bound_bp_upper: 250, scale_resp: 20}}
  inputs:
    instance: {template: resp, anchor_ms: 25200000}
    samples:
      - {signal: bp, t_device_ms: 24900000, t_rx_ms: 24900000, value: 150.0, seq: null, quality: null}   # 06:55 bp 150 (pre-dose)
    events:
      - {kind: measurement, t_device_ms: 24900000, t_rx_ms: 24900000, source: cuff, payload: {}, seq: null}   # 06:55 measurement event
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
  eval_at_ms: 27000000   # 07:30, step 450
  expected:
    t_eval_ms: 27000000
    state: pending
    unit: mmHg
    sigma_interval: [-.inf, 90.0]
    sigma_norm_interval: [-1.0, 1.0]
    rho: null
    decided_at_ms: null
    pending_until_ms: 36000000   # 10:00
  hand_calculation: "Dispense 25200000 (07:00): k_a = 420. The latest bp sample with device time <= 25200000 is that of 06:55, so pre_i = 150 (captured once). k_d = 420 + delta2 / 60000 = 420 + 180 = 600 (36000000, 10:00) = pending_until_ms. The window of the body is [k_d - (delta2 - delta1) / 60000, k_d] = [600 - 120, 600] = [480, 600] = [08:00, 10:00]. Evaluation step 450 (07:30): every step of the window is unknown. lo = -inf: the unknown steps may carry no measurement, and a guard (a measurement in the window) then fails. hi: a measurement in the window may carry any pressure in [bound_bp_lower, bound_bp_upper] = [50, 250]; the largest drop is pre_i - 50 = 100 and the margin is 100 - delta_resp = 90 mmHg, so hi = 150 - 50 - 10 = 90. Normalised: lo = -inf maps to -1; 90 / 20 = 4.5 clipped to 1. hi >= 0 and lo <= 0: PENDING (the response is not decidable before the window opens unless pre_i < 50 + 10)."

- id: V-RESP-2
  contract: ["02-interfaces.md#verdict"]
  source: "plan fixture; measurement of G-RESP-2 (drop 5)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0, f0_rows: {delta1: 3600000, delta2: 10800000, delta_resp: 10, bound_bp_lower: 50, bound_bp_upper: 250, scale_resp: 20}}
  inputs:
    instance: {template: resp, anchor_ms: 25200000}
    samples:
      - {signal: bp, t_device_ms: 24900000, t_rx_ms: 24900000, value: 150.0, seq: null, quality: null}   # 06:55 bp 150 (pre-dose)
      - {signal: bp, t_device_ms: 30600000, t_rx_ms: 30600000, value: 145.0, seq: null, quality: null}   # 08:30 bp 145
    events:
