# Hand-written latent days with hand-computed phi_CP ground truth (WS04-T10).
#
# FIXTURE-ONLY. Every number is arithmetic against the fixture registry F0 (tests/fixtures/spec/registry_f0.yaml,
# ADR-027): band [110, 140], hold threshold 100 with a look-back of 60 min, dose limit 2 and day-end minimum 2,
# delta1 60 min, delta2 180 min, delta_resp 10, sched_window 30 min, lower pressure bound 50, step 60 s.
# None of it is a clinical value and none is a statement about any patient.
#
# Format of a case. The latent pressure is a piecewise constant function of the clock time on the 1-minute grid:
# `bp_default`, overridden by the half-open intervals of `bp_segments` ([from, to, value], clock "HH:MM", "24:00"
# is the end of the day). `measurements` are the instants of the ideal MEASUREMENT events (their value is the
# pressure at that instant), `dispenses` the DISPENSE events (an INTAKE follows 5 s later), `sched_ticks` the
# anchors of the SCHED instances of the plan and `count_end` whether the plan has the day-end COUNT obligation.
# `expected` lists the C1 events that the specification gives on this latent day, with the hand calculation in
# `why`: the template, the onset and the end (a clock time or null) and the subtype (no injection record, no
# behaviour log: every event is natural). A case is run on day 0 and on day 1 and 3 of the continuing axis
# (every time shifted by `day_index * 24 h`).

cases:
  - id: GT-01-null-day
    why: >
      Two doses with a measurement before and after each, every reading in band, a drop of 12 at both response
      windows: 130 - 118 = 12 >= 10. The post-dose reading of the second dose is at 22:30, inside [22:00, 24:00],
      whose end 21:00 + 180 min = 24:00 is the closing step. The four SCHED ticks coincide with their readings.
      The two doses meet the day-end minimum 2. Nothing is violated.
    bp_default: 130.0
    bp_segments: [["08:00", "12:00", 118.0], ["22:00", "24:00", 118.0]]
    measurements: ["06:50", "09:00", "20:30", "22:30"]
    dispenses: ["07:00", "21:00"]
    sched_ticks: ["06:50", "09:00", "20:30", "22:30"]
    count_end: true
    expected: []

  - id: GT-02-band-edges
    why: >
      No dose. Readings 139 (inside), 140 (the upper limit: sigma = 0, a tie, satisfied), 141 (sigma = 140 - 141 = -1,
      violated), 110 (the lower limit, a tie) and 109 (sigma = 109 - 110 = -1, violated). Every tick has its reading.
    bp_default: 139.0
    bp_segments: [["12:00", "16:00", 140.0], ["16:00", "20:00", 141.0], ["20:00", "23:00", 110.0], ["23:00", "24:00", 109.0]]
    measurements: ["08:00", "12:00", "16:00", "20:00", "23:00"]
    dispenses: []
    sched_ticks: ["08:00", "12:00", "16:00", "20:00", "23:00"]
    count_end: false
    expected:
      - {template: range, onset: "16:00", end: null}
      - {template: range, onset: "23:00", end: null}

  - id: GT-03-hold-tie-and-guard
    why: >
      Reading 100 at 06:00 (RANGE: min(100 - 110, 140 - 100) = -10, violated). Dose at 06:30: the look-back
      [05:30, 06:30] holds the reading and 100 - 100 = 0 is a tie, satisfied. Dose at 09:00: the last reading is
      3 h old, no measurement in [08:00, 09:00], the guard fails: HOLD violated at 09:00. RESP of the dose at 06:30:
      window [07:30, 09:30] holds no measurement, violated (end 09:30); RESP of the dose at 09:00: window [10:00, 12:00]
      holds none, violated (end 12:00). The two doses meet the day-end minimum.
    bp_default: 100.0
    bp_segments: []
    measurements: ["06:00"]
    dispenses: ["06:30", "09:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: range, onset: "06:00", end: null}
      - {template: resp, onset: "06:30", end: "09:30"}
      - {template: hold, onset: "09:00", end: null}
      - {template: resp, onset: "09:00", end: "12:00"}

  - id: GT-04-count-limit-third-dispense
    why: >
      The null day plus a dispense at 07:05. The trailing 24 h count is 1 at 07:00, 2 at 07:05 (the limit, a tie) and
      3 at 21:00: 2 - 3 = -1, COUNT violated at 21:00. Every other instance is satisfied (the readings before and after
      each dose are those of the null day; the day-end count is 3 >= 2).
    bp_default: 130.0
    bp_segments: [["08:00", "12:00", 118.0], ["22:00", "24:00", 118.0]]
    measurements: ["06:50", "09:00", "20:30", "22:30"]
    dispenses: ["07:00", "07:05", "21:00"]
    sched_ticks: ["06:50", "09:00", "20:30", "22:30"]
    count_end: true
    expected:
      - {template: count, onset: "21:00", end: null}

  - id: GT-05-sched-deadline
    why: >
      No dose, readings 130 (in band). Tick 09:00 with a reading at 09:30, on the deadline: slack 0, satisfied. Tick 12:00
      with its only reading at 12:31, one minute late: no measurement in [12:00, 12:30], violated at 12:30. Tick 15:00 with
      no reading in its window: violated at 15:30. Tick 18:00 with a reading at 17:59, before the tick (it does not
      count): violated at 18:30.
    bp_default: 130.0
    bp_segments: []
    measurements: ["09:30", "12:31", "17:59"]
    dispenses: []
    sched_ticks: ["09:00", "12:00", "15:00", "18:00"]
    count_end: false
    expected:
      - {template: sched, onset: "12:00", end: "12:30"}
      - {template: sched, onset: "15:00", end: "15:30"}
      - {template: sched, onset: "18:00", end: "18:30"}

  - id: GT-06-resp-window-and-max
    why: >
      Dose 07:00 with pre-dose reading 130 (06:50). Readings 07:30 (100, before the window [08:00, 10:00], ignored
      by RESP but RANGE-violated: min(100 - 110, 140 - 100) = -10), 08:30 (125: margin 130 - 125 - 10 = -5) and
      09:30 (121: margin 130 - 121 - 10 = -1). The maximum is -1 < 0: RESP violated at 10:00 (onset 07:00, end 10:00).
      Dose 21:00 with pre-dose reading 130 (20:30) and one reading at 22:00, the first step of its window, of 120:
      margin 0, a tie, satisfied at the closing step. The two doses meet the day-end minimum.
    bp_default: 130.0
    bp_segments: [["07:30", "08:00", 100.0], ["08:00", "09:00", 125.0], ["09:00", "20:00", 121.0], ["22:00", "24:00", 120.0]]
    measurements: ["06:50", "07:30", "08:30", "09:30", "20:30", "22:00"]
    dispenses: ["07:00", "21:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: range, onset: "07:30", end: null}
      - {template: resp, onset: "07:00", end: "10:00"}

  - id: GT-07-resp-undefined-pre-and-early-bound
    why: >
      Dose 07:00 with no earlier reading: HOLD has no measurement in [06:00, 07:00], guard failed, violated. Its pre-dose
      value is undefined, a reading at 09:00 (100) lies in the window, so RESP stays undecided (no event); that reading
      is RANGE-violated (-10). Dose 21:00 after a reading of 55 at 20:30 (RANGE: 55 - 110 = -55, violated): HOLD
      55 - 100 = -45 violated; RESP: 55 - 50 - 10 = -5 < 0, no pressure of [50, 250] can give the response, violated at
      the anchor (onset 21:00, end 24:00). The two doses meet the day-end minimum.
    bp_default: 100.0
    bp_segments: [["20:30", "24:00", 55.0]]
    measurements: ["09:00", "20:30"]
    dispenses: ["07:00", "21:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: hold, onset: "07:00", end: null}
      - {template: range, onset: "09:00", end: null}
      - {template: range, onset: "20:30", end: null}
      - {template: hold, onset: "21:00", end: null}
      - {template: resp, onset: "21:00", end: "24:00"}

  - id: GT-08-open-at-the-end-of-the-day
    why: >
      One dose at 22:00 after a reading of 130 at 21:30 and no later reading. The response window ends at 25:00, after
      the closing step: the instance is open at the end of the day (not decided, not a violation, 05 section 7.5 item 2).
      The tick at 23:45 has its deadline at 24:15, also open. The single dose is below the day-end minimum 2: COUNT
      violated at the closing step (onset = end = 24:00).
    bp_default: 130.0
    bp_segments: []
    measurements: ["21:30"]
    dispenses: ["22:00"]
    sched_ticks: ["23:45"]
    count_end: true
    expected:
      - {template: count, onset: "24:00", end: "24:00"}

  - id: GT-09-no-dose-day
    why: >
      No dispense: the day-end count is 0 and the minimum is 2, sigma = 0 - 2 = -2, violated at the closing step.
    bp_default: 130.0
    bp_segments: []
    measurements: ["12:00"]
    dispenses: []
    sched_ticks: ["12:00"]
    count_end: true
    expected:
      - {template: count, onset: "24:00", end: "24:00"}

  - id: GT-10-dispense-at-the-day-start
    why: >
      A dispense at exactly 00:00 is seen by the first step, so it counts in the trailing counter and creates its HOLD
      and RESP instances, but by the day boundary (the day covers (0, T_day]) it is not one of the dispenses of the day
      that the day-end count adds up. Dispenses 00:00 and 12:00: today = 1 < 2, COUNT violated at the closing step. The dose at 00:00 has no reading in its look-back (HOLD guard failed, violated) and
      none in its window [01:00, 03:00] (RESP violated, end 03:00). The dose at 12:00 has the reading 130 at 11:30 and
      118 at 14:00 (drop 12, window [13:00, 15:00]): satisfied.
    bp_default: 130.0
    bp_segments: [["13:00", "15:00", 118.0]]
    measurements: ["11:30", "14:00"]
    dispenses: ["00:00", "12:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: hold, onset: "00:00", end: null}
      - {template: resp, onset: "00:00", end: "03:00"}
      - {template: count, onset: "24:00", end: "24:00"}

  - id: GT-11-hold-lookback-edge
    why: >
      The look-back window of HOLD is closed at both ends. Dose 07:00 with the reading 06:00 exactly 60 min earlier:
      the reading is in [06:00, 07:00], 130 - 100 = +30, satisfied. Dose 07:01 sees the same reading 61 min earlier,
      outside [06:01, 07:01]: the guard fails, HOLD violated at 07:01. Neither dose has a reading in its response
      window, so RESP is violated for both (07:00 with end 10:00, 07:01 with end 10:01). Two doses meet the limit
      and the day-end minimum.
    bp_default: 130.0
    bp_segments: []
    measurements: ["06:00"]
    dispenses: ["07:00", "07:01"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: resp, onset: "07:00", end: "10:00"}
      - {template: hold, onset: "07:01", end: null}
      - {template: resp, onset: "07:01", end: "10:01"}

  - id: GT-12-resp-window-end-is-closed
    why: >
      Dose 07:00 with the pre-dose reading 130 (06:50) and the only reading of the window at 10:00 = 07:00 + delta2,
      the last step of [08:00, 10:00]: 130 - 118 - 10 = +2, satisfied at the deadline. Nothing is violated.
    bp_default: 130.0
    bp_segments: [["10:00", "24:00", 118.0]]
    measurements: ["06:50", "10:00"]
    dispenses: ["07:00"]
    sched_ticks: []
    count_end: false
    expected: []

  - id: GT-13-resp-reading-one-step-late
    why: >
      The same dose and pressure as GT-12 with the reading one step late, 10:01: it is outside [08:00, 10:00], so the
      response window holds no reading and RESP is violated at 10:00 (onset 07:00, end 10:00).
    bp_default: 130.0
    bp_segments: [["10:01", "24:00", 118.0]]
    measurements: ["06:50", "10:01"]
    dispenses: ["07:00"]
    sched_ticks: []
    count_end: false
    expected:
      - {template: resp, onset: "07:00", end: "10:00"}

  - id: GT-14-resp-decided-at-the-anchor-across-midnight
    why: >
      A dose at 22:00 after a reading of 55 at 21:30 (the pressure stays 55). The window of RESP ends at 25:00, after the
      closing step, but no pressure of [50, 250] can answer the dose (55 - 50 - 10 = -5 < 0): the instance is decided at
      its anchor (onset 22:00, end 25:00). The reading is RANGE-violated (55 - 110 = -55) and HOLD-violated (55 - 100 =
      -45) at the dose. One dose is below the day-end minimum 2: COUNT violated at the closing step.
    bp_default: 130.0
    bp_segments: [["21:30", "24:00", 55.0]]
    measurements: ["21:30"]
    dispenses: ["22:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: range, onset: "21:30", end: null}
      - {template: hold, onset: "22:00", end: null}
      - {template: resp, onset: "22:00", end: "25:00"}
      - {template: count, onset: "24:00", end: "24:00"}

  - id: GT-15-pre-dose-reading-at-the-dispense-instant
    why: >
      A reading at the very instant of the dispense counts as taken before it (docs/formal/01, the pre-dose capture of
      T01 section 5.3): the pre-dose value of the dose at 07:00 is the 07:00 reading, 140, and not the earlier 130 of 06:50.
      The 08:30 reading of 128 then answers the dose (140 - 128 - 10 = +2); with the earlier reading it would not
      (130 - 128 - 10 = -8). The 07:00 reading is the band edge (tie) and the dose finds it in its look-back
      (140 - 100 = +40). Nothing is violated.
    bp_default: 130.0
    bp_segments: [["07:00", "08:00", 140.0], ["08:00", "24:00", 128.0]]
    measurements: ["06:50", "07:00", "08:30"]
    dispenses: ["07:00"]
    sched_ticks: []
    count_end: false
    expected: []

  - id: GT-16-deadline-at-the-closing-step-and-one-step-after
    why: >
      A deadline exactly at the closing step is decided there, one step later it is open (not a violation, 05 section 7.5
      item 2). Ticks 23:30 (deadline 24:00, no reading in [23:30, 24:00]: SCHED violated at the closing step) and 23:31
      (deadline 24:01, also without a reading: open). Doses 21:00 (window [22:00, 24:00], no reading: RESP violated, onset
      21:00, end 24:00) and 21:01 (window [22:01, 24:01]: open). The reading 130 at 20:30 is in band, in the look-back of
      both doses (130 - 100 = +30) and answers the tick 20:30. Two doses meet the limit (2 - 2 = 0, a tie) and the
      day-end minimum. The two violations are decided at the shared step of midnight; since WS04-T15 (ADR-064) a record
      decided there belongs to the day that starts there (days are half-open), so this day owns neither of them and
      nothing is expected; they are events of the next day (the reference evaluator still finds both, with decided_at 24:00,
      and `owned_by_day` gives them to day + 1; `expected_next_day` lists them, as clock times of the next day's start).
    bp_default: 130.0
    bp_segments: []
    measurements: ["20:30"]
    dispenses: ["21:00", "21:01"]
    sched_ticks: ["20:30", "23:30", "23:31"]
    count_end: true
    expected: []
    expected_next_day:
      - {template: resp, onset: "21:00", end: "24:00"}
      - {template: sched, onset: "23:30", end: "24:00"}

  - id: GT-17-resp-early-bound-tie
    why: >
      The early decision of RESP needs pre - 50 - 10 < 0. Dose 22:30 after the reading 60 at 21:30: 60 - 50 - 10 = 0, a
      tie, not decided at the anchor, and its window [23:30, 25:30] ends after the closing step: open, no event. Dose
      23:00 after the reading 59 at 22:45: 59 - 50 - 10 = -1 < 0, decided at the anchor (onset 23:00, end 26:00). Both
      readings are RANGE-violated (60 - 110 = -50, 59 - 110 = -51) and both doses HOLD-violated at the dose (60 - 100 =
      -40 with the reading 21:30 at the near edge of [21:30, 22:30]; 59 - 100 = -41). Two doses meet the limit and the
      day-end minimum.
    bp_default: 130.0
    bp_segments: [["21:30", "22:45", 60.0], ["22:45", "24:00", 59.0]]
    measurements: ["21:30", "22:45"]
    dispenses: ["22:30", "23:00"]
    sched_ticks: []
    count_end: true
    expected:
      - {template: range, onset: "21:30", end: null}
      - {template: hold, onset: "22:30", end: null}
      - {template: range, onset: "22:45", end: null}
      - {template: hold, onset: "23:00", end: null}
      - {template: resp, onset: "23:00", end: "26:00"}

  - id: GT-18-resp-any-reading-in-the-window-answers
    why: >
      One reading that answers the dose is enough, whatever its place in the window (the maximum of the margins over the
      window readings, not the first, the last or the minimum). Dose 07:00 with pre-dose 130 (06:50): window [08:00,
      10:00] holds 125 at 08:30 (margin 130 - 125 - 10 = -5) then 118 at 09:30 (margin +2): satisfied. Dose 14:00 with
      pre-dose 130 (13:50): window [15:00, 17:00] holds 118 at 15:00 (+2) then 125 at 15:30 (-5): satisfied. All readings
      are in band and in the look-back of their dose. Two doses meet the limit and the day-end minimum. Nothing is
      violated.
    bp_default: 130.0
    bp_segments: [["08:30", "09:00", 125.0], ["09:30", "10:00", 118.0], ["15:00", "15:30", 118.0], ["15:30", "16:00", 125.0]]
    measurements: ["06:50", "08:30", "09:30", "13:50", "15:00", "15:30"]
    dispenses: ["07:00", "14:00"]
    sched_ticks: []
    count_end: true
    expected: []

# Hand-written patients of several days with hand-computed phi_CP ground truth of the LAST day (WS04-T15, ADR-046,
# ADR-055 (b), ADR-064). Same arithmetic and same registry as above (FIXTURE-ONLY). `days` lists the days of the patient in
# order on the continuing axis (day 0, day 1, ...), each with the keys of a case above (clock times of that day, with
# optional seconds "HH:MM:SS"); the labeller gets the earlier days as history and labels the last one. `expected` lists the
# events of the last day (those DECIDED in it: a day is the half-open interval [d * 24 h, (d + 1) * 24 h), and the day-end
# obligation that closes a day stays with that day), as "<day> <clock>" so that an onset can lie in an earlier day.
# `per_day` is what the same day gives when it is labelled with no history (the truth that WS04-T10 produced): it shows
# what the history adds, or, for HC-06, removes.

history_cases:
  - id: HC-01-evening-double-take-gives-the-morning-count-event
    why: >
      Day 0: doses 21:00 and 21:02 (a double take), readings 130 at 20:30 and 118 at 22:30. Each dose has its reading in
      the HOLD look-back (130 - 100 = +30) and one in its RESP window (130 - 118 - 10 = +2); the trailing count is 1 then
      2 (the limit, a tie). Day 1: dose 07:00 after the reading 130 at 06:30, answered by 118 at 09:00 (+2). The trailing
      24 h count at 07:00 of day 1 is the doses of (07:00 day 0, 07:00 day 1], that is 21:00, 21:02 and 07:00: 2 - 3 = -1,
      COUNT violated at 07:00 of day 1. With no history the counter is 1 and nothing is violated.
    days:
      - bp_default: 130.0
        bp_segments: [["22:00", "24:00", 118.0]]
        measurements: ["20:30", "22:30"]
        dispenses: ["21:00", "21:02"]
        sched_ticks: []
        count_end: false
      - bp_default: 130.0
        bp_segments: [["08:00", "12:00", 118.0]]
        measurements: ["06:30", "09:00"]
        dispenses: ["07:00"]
        sched_ticks: []
        count_end: false
    expected:
      - {template: count, onset: "1 07:00", end: null}
    per_day: []

  - id: HC-02-response-window-across-midnight-unanswered
    why: >
      Day 0: dose 22:00 after the reading 130 at 21:30 (HOLD +30). Its RESP window is [23:00, 01:00 of day 1]; there is no
      reading in it. Day 1: one reading 130 at 12:00 (in band). RESP is violated at 01:00 of day 1, the deadline: onset 22:00
      of day 0, end 01:00 of day 1, an event of day 1. The day alone, or with no history, is open at its closing step and
      labels nothing.
    days:
      - bp_default: 130.0
        bp_segments: []
        measurements: ["21:30"]
        dispenses: ["22:00"]
        sched_ticks: []
        count_end: false
      - bp_default: 130.0
        bp_segments: []
        measurements: ["12:00"]
        dispenses: []
        sched_ticks: []
        count_end: false
    expected:
      - {template: resp, onset: "0 22:00", end: "1 01:00"}
    per_day: []

  - id: HC-03-response-window-across-midnight-answered
    why: >
      As HC-02, with the reading 118 at 00:30 of day 1, inside the window [23:00, 01:00]: 130 - 118 - 10 = +2, satisfied.
      Nothing is violated, with or without the history.
    days:
      - bp_default: 130.0
        bp_segments: []
        measurements: ["21:30"]
        dispenses: ["22:00"]
        sched_ticks: []
        count_end: false
      - bp_default: 130.0
        bp_segments: [["00:00", "02:00", 118.0]]
        measurements: ["00:30"]
        dispenses: []
        sched_ticks: []
        count_end: false
    expected: []
    per_day: []

  - id: HC-04-a-reading-stamped-at-the-shared-step-answers
    why: >
      Day 0: dose 21:00 after the reading 130 at 20:30; RESP window [22:00, 24:00], deadline exactly at the shared step of
      midnight, closed at both ends. No reading in day 0 after 20:30, so the run of day 0 alone would decide VIOLATED at
      24:00. Day 1: pressure 118 and a reading stamped 00:00:00 of day 1, that is 24:00 of day 0: it lies in the window,
      130 - 118 - 10 = +2, satisfied. The run that has the data stamped up to and including the instant of
      decision decides SATISFIED: no event on either day.
    days:
      - bp_default: 130.0
        bp_segments: []
        measurements: ["20:30"]
        dispenses: ["21:00"]
        sched_ticks: []
        count_end: false
      - bp_default: 118.0
        bp_segments: []
        measurements: ["00:00"]
        dispenses: []
        sched_ticks: []
        count_end: false
    expected: []
    per_day: []

  - id: HC-05-a-reading-one-second-after-the-shared-step-is-late
    why: >
      As HC-04 with the reading stamped 00:00:01 of day 1: it is visible at the step 00:01, after the deadline 24:00, so no
      reading lies in the window and RESP is violated at the shared step (decided at 24:00 of day 0 = 00:00 of day 1). By the
      half-open day it is an event of day 1 (onset 21:00 of day 0, end 00:00 of day 1) and not of day 0.
    days:
      - bp_default: 130.0
        bp_segments: []
        measurements: ["20:30"]
        dispenses: ["21:00"]
        sched_ticks: []
        count_end: false
      - bp_default: 118.0
        bp_segments: []
        measurements: ["00:00:01"]
        dispenses: []
        sched_ticks: []
        count_end: false
    expected:
      - {template: resp, onset: "0 21:00", end: "1 00:00"}
    per_day: []

  - id: HC-06-the-hold-guard-needs-the-previous-day
    why: >
      Day 0: reading 130 at 23:50. Day 1: dose 00:20 and a reading 118 at 02:00. HOLD: the reading of 23:50 lies in the
      look-back [23:20, 00:20] and 130 - 100 = +30, satisfied. RESP: the pre-dose value is 130 (the reading of day 0), the
      window [01:20, 03:20] holds 118: +2, satisfied. Nothing is violated with the history. With no history the guard
      sees no reading in the look-back and HOLD is violated at 00:20: the per-day truth is not always a subset of the
      history truth (it is when no dose lies within the look-back of midnight).
    days:
      - bp_default: 130.0
        bp_segments: []
        measurements: ["23:50"]
        dispenses: []
        sched_ticks: []
        count_end: false
      - bp_default: 130.0
