# Test registry of WS08-T01 (tests/fixtures/eval): a copy of tests/fixtures/attribution/registry_attribution.yaml, that is
# the fixture registry F0 plus the seven names that the evidence extractor and the attribution rule request and that the
# real registry (configs/registry/hypertension.yaml) does not carry (open point OPF-6). ILLUSTRATIVE, UNVERIFIED:
# EVERY ROW IS FIXTURE-ONLY (ADR-027), arithmetic test numbers with no clinical meaning and never a reported result.
# The real registry cannot build the evidence extractor, so a run of `OursDetector` on it fails with a RegistryError;
# the experiment configurations of WS08-T02 onwards need the missing rows first (a human decision).
# Test-owned registry of WS05-T07: the fixture registry F0 (tests/fixtures/spec/registry_f0.yaml) plus the
# parameters that docs/models/evidence-channels.md and docs/models/attribution-rule.md request from the registry
# and that neither configs/registry/hypertension.yaml nor the F0 table carries (evidence_margin_ms,
# evidence_grace_ms, hr_coherence_max_age_ms, hr_coherence_tolerance, ecg_sqi_floor, ppg_sqi_floor,
# ble_link_quality_floor; clock_skew_max_ms exists in the real registry). EVERY ADDED ROW IS FIXTURE-ONLY: a
# test number with no clinical meaning, never a reported result. The real registry has no row for these
# names, so constructing an EvidenceExtractor or a HierarchicalRule with it raises RegistryError (reported in
# the completion note of WS05-T07). The unit of hr_coherence_tolerance is a beat rate (bpm), which the registry
# unit vocabulary (mmHg, ms, dose, 1) does not have: the test row uses "1" (gap reported in the completion note).
# Fixture registry F0 in the WS01-T03 schema (test-only copy, WS05-T03).
# Every row is FIXTURE-ONLY in the sense of ADR-027: arithmetic test numbers, never a reported result.
# Values are those of the fixture_registry section of docs/formal/golden/templates.yaml and of the F0 table
# in docs/plan/workstreams/WS01-formalization/README.md; the F0 origin of each row is kept in `rationale`.
# meas_min_day, step_ms and reorder_delay_ms are F0 rows that are not registry names
# (docs/formal/03-parameter-registry.md section 3.3) and are therefore absent.
