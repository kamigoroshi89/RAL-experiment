    anchor_ms: 25200000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 24900000, t_rx_ms: 24900000, value: 150.0, seq: null, quality: null}   # 06:55 pre-dose bp 150
      - {signal: bp, t_device_ms: 30600000, t_rx_ms: 30600000, value: 145.0, seq: null, quality: null}   # 08:30 bp 145
