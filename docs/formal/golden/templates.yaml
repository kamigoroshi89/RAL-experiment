cases:
- id: G-RANGE-1
  contract: ["02-interfaces.md#template"]
  source: "plan fixture"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: range
    anchor_ms: 32400000
    samples:
      - {signal: bp, t_device_ms: 32400000, t_rx_ms: 32400000, value: 125.0, seq: null, quality: null}   # 09:00 bp 125
    events:
      - {kind: measurement, t_device_ms: 32400000, t_rx_ms: 32400000, source: cuff, payload: {}, seq: null}   # 09:00 measurement event
  eval_at_ms: 32400000   # 09:00
  expected: {sigma_raw: 15.0, unit: mmHg, sigma_norm: 0.75, boolean: satisfied}
  hand_calculation: "Anchor 32400000 (09:00), k_d = ceil(32400000 / 60000) = 540; bp_540 = 125 (sample device time 32400000 <= t_540 = 32400000). Body: min(bp - bp_band_low, bp_band_high - bp) = min(125 - 110, 140 - 125) = min(15, 15) = 15 mmHg. All other steps have m = 0, so their implication value is +inf and the min over the history is 15. sigma_norm = clip(15 / 20, -1, 1) = 0.75. sigma >= 0: satisfied."

- id: G-RANGE-2
  contract: ["02-interfaces.md#template"]
  source: "analisi §4.6 row 08:55 (arithmetic 140 - 152; the time 09:05 is a fixture label, not the analisi time)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: range
    anchor_ms: 32700000
    samples:
      - {signal: bp, t_device_ms: 32700000, t_rx_ms: 32700000, value: 152.0, seq: null, quality: null}   # 09:05 bp 152
    events:
      - {kind: measurement, t_device_ms: 32700000, t_rx_ms: 32700000, source: cuff, payload: {}, seq: null}   # 09:05 measurement event
  eval_at_ms: 32700000   # 09:05
  expected: {sigma_raw: -12.0, unit: mmHg, sigma_norm: -0.6, boolean: violated}
  hand_calculation: "Anchor 32700000 (09:05), k_d = ceil(32700000 / 60000) = 545; bp_545 = 152. Body: min(152 - 110, 140 - 152) = min(42, -12) = -12 mmHg. sigma_norm = clip(-12 / 20, -1, 1) = -0.6. sigma < 0: violated."

