# Golden examples of the past-time template library (WS01-T02).
# Fixture registry F0 (test-only; NOT the clinical registry) and 26 hand-computed cases.
# Times are integer milliseconds; the hh:mm label is in a comment. step_ms = 60000, reorder_delay_ms = 0.
# Values that look like clinical numbers are illustrative and unverified (analisi §4.1, ADR-020) or FIXTURE-ONLY.
# Sign convention: sigma_raw >= 0 means satisfied (non-strict atoms); -.inf is a failed guard.
# sigma_norm = clip(sigma_raw / scale, -1, 1) with the scale of the template (registry name scale_<id>).
# Extra keys used by this file: inputs.template, inputs.anchor_ms, inputs.anchor_kind, inputs.generated,
# inputs.channels_unavailable, expected.guard_failed, expected.workshop_form.

