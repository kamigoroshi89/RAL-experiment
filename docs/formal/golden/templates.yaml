      - {kind: dispense, t_device_ms: 75600000, t_rx_ms: 75600000, source: dispenser, payload: {}, seq: null}   # 21:00 dispense
  eval_at_ms: 75600000   # 21:00
  expected: {sigma_raw: 0.0, unit: dose, sigma_norm: 0.0, boolean: satisfied}
  hand_calculation: "Instance of the dispense at 75600000 (21:00): k_d = ceil(75600000 / 60000) = 1260. c_d(t_1260) counts dispenses in (75600000 - 86400000, 75600000] = (-10800000, 75600000]: 25200000 and 75600000, so c_d = 2. Body: dose_max_24h - c_d = 2 - 2 = 0 dose. The 07:00 instance gives 2 - 1 = 1, so the min is 0. sigma_norm = 0 / 1 = 0. Tie on a non-strict predicate (c_d <= limit): satisfied."

- id: G-COUNT-3
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (day-end obligation)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: count
    anchor_ms: 86400000
    anchor_kind: day_end
    samples: []
    events:
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
    generated: [{signal: day_end, t_ms: 86400000}]
  eval_at_ms: 86400000   # 24:00 closing step K = 1440
  expected: {sigma_raw: -1.0, unit: dose, sigma_norm: -1.0, boolean: violated}
  hand_calculation: "day_end is generated at the closing step K = 86400000 / 60000 = 1440. c_d(t_1440) counts dispenses in (86400000 - 86400000, 86400000] = (0, 86400000]: 25200000, so c_d = 1. Day-end body: c_d - dose_min_day_end = 1 - 2 = -1 dose. The limit conjunct at the 07:00 dispense gives dose_max_24h - c_d = 2 - 1 = +1, so the min of the two conjuncts is min(1, -1) = -1. sigma_norm = clip(-1 / 1, -1, 1) = -1.0. sigma < 0: violated."

- id: G-HOLD-1
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (analisi §4.1 aspect 3)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: hold
    anchor_ms: 75600000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 74100000, t_rx_ms: 74100000, value: 128.0, seq: null, quality: null}   # 20:35 bp 128
    events:
      - {kind: measurement, t_device_ms: 74100000, t_rx_ms: 74100000, source: cuff, payload: {}, seq: null}   # 20:35 measurement event
      - {kind: dispense, t_device_ms: 75600000, t_rx_ms: 75600000, source: dispenser, payload: {}, seq: null}   # 21:00 dispense
  eval_at_ms: 75600000   # 21:00
  expected: {sigma_raw: 28.0, unit: mmHg, sigma_norm: 1.0, boolean: satisfied}
  hand_calculation: "Dispense 75600000: k_d = 1260; look-back window length 3600000 / 60000 = 60 steps (hold_lookback / step_ms), window [1260 - 60, 1260] = [1200, 1260]. Measurement 74100000 gives k = 74100000 / 60000 = 1235, inside the window (age 1260 - 1235 = 25 steps = 25 min), so the recency guard is +inf. bp_1260 = 128 (latest held). Margin: bp - bp_hold_threshold = 128 - 100 = 28 mmHg. sigma_norm = clip(28 / 20, -1, 1) = clip(1.4, -1, 1) = 1.0. sigma >= 0: satisfied."

- id: G-HOLD-2
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (analisi §4.1 aspect 3)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: hold
    anchor_ms: 25200000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 24600000, t_rx_ms: 24600000, value: 94.0, seq: null, quality: null}   # 06:50 bp 94
    events:
      - {kind: measurement, t_device_ms: 24600000, t_rx_ms: 24600000, source: cuff, payload: {}, seq: null}   # 06:50 measurement event
