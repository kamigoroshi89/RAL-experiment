- id: G-COUNT-1
  contract: ["02-interfaces.md#template"]
  source: "analisi §4.6 row 21:02 (counter 3 over 2: -1 dose, not -8)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: count
    anchor_ms: 75720000
    anchor_kind: dispense
    samples: []
    events:
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
      - {kind: dispense, t_device_ms: 75600000, t_rx_ms: 75600000, source: dispenser, payload: {}, seq: null}   # 21:00 dispense
      - {kind: dispense, t_device_ms: 75720000, t_rx_ms: 75720000, source: dispenser, payload: {}, seq: null}   # 21:02 dispense
  eval_at_ms: 75720000   # 21:02
  expected: {sigma_raw: -1.0, unit: dose, sigma_norm: -1.0, boolean: violated}
  hand_calculation: "Instance of the dispense at 75720000 (21:02): k_d = ceil(75720000 / 60000) = 1262. c_d(t_1262) counts dispenses with device time in (75720000 - 86400000, 75720000] = (-10680000, 75720000]: 25200000, 75600000 and 75720000, so c_d = 3. Body of the limit: dose_max_24h - c_d = 2 - 3 = -1 dose. The earlier instances give 2 - 1 = 1 (07:00) and 2 - 2 = 0 (21:00), so the min over the history is -1. sigma_norm = clip(-1 / 1, -1, 1) = -1.0. The day-end conjunct is vacuous (+inf) before the closing step. sigma < 0: violated. (The workshop Table I value -8 has no defined unit; the counter margin is -1 dose.)"

- id: G-COUNT-2
  contract: ["02-interfaces.md#template"]
