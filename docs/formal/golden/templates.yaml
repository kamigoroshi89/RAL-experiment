  hand_calculation: "Dispense 25200000: k_d = 420; window [420 - 60, 420] = [360, 420]. Measurement 24600000 gives k = 24600000 / 60000 = 410, inside the window (age 10 steps), guard +inf. bp_420 = 94. Margin: 94 - 100 = -6 mmHg. sigma_norm = clip(-6 / 20, -1, 1) = -0.3. sigma < 0: violated."

- id: G-HOLD-3
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (workshop form versus refined form, analisi §4.1 aspect 3)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: hold
    anchor_ms: 25200000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 22500000, t_rx_ms: 22500000, value: 120.0, seq: null, quality: null}   # 06:15 bp 120
      - {signal: bp, t_device_ms: 24900000, t_rx_ms: 24900000, value: 90.0, seq: null, quality: null}   # 06:55 bp 90
    events:
      - {kind: measurement, t_device_ms: 22500000, t_rx_ms: 22500000, source: cuff, payload: {}, seq: null}   # 06:15 measurement event
      - {kind: measurement, t_device_ms: 24900000, t_rx_ms: 24900000, source: cuff, payload: {}, seq: null}   # 06:55 measurement event
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
  eval_at_ms: 25200000   # 07:00
  expected: {sigma_raw: -10.0, unit: mmHg, sigma_norm: -0.5, boolean: violated, workshop_form: {sigma_raw: 20.0, unit: mmHg, sigma_norm: 1.0, boolean: satisfied}}
  hand_calculation: "Dispense 25200000: k_d = 420; window [360, 420]. Measurements 22500000 (k = 375) and 24900000 (k = 415) are both inside the window, so the recency guard is +inf. Refined form (adopted): the latest held value is bp_420 = 90, margin 90 - 100 = -10 mmHg, sigma_norm = clip(-10 / 20, -1, 1) = -0.5, violated. Workshop form once[0, hold_lookback](m and bp >= bp_hold_threshold): the max over the window of min(m_j, bp_j - 100) has candidates j = 375: min(+inf, 120 - 100) = 20 and j = 415: min(+inf, 90 - 100) = -10, so max(20, -10) = +20 mmHg, sigma_norm = clip(20 / 20, -1, 1) = 1.0, satisfied. The workshop form accepts a low latest reading (90) because an earlier reading (120) in the window is high."

- id: G-HOLD-4
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (recency guard)"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: hold
    anchor_ms: 25200000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 19800000, t_rx_ms: 19800000, value: 120.0, seq: null, quality: null}   # 05:30 (value is irrelevant) bp 120
    events:
      - {kind: measurement, t_device_ms: 19800000, t_rx_ms: 19800000, source: cuff, payload: {}, seq: null}   # 05:30 measurement event
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
  eval_at_ms: 25200000   # 07:00
  expected: {sigma_raw: -.inf, unit: mmHg, sigma_norm: -1.0, boolean: violated, guard_failed: no_recent_measurement}
  hand_calculation: "Dispense 25200000: k_d = 420; window [360, 420]. The only measurement is 19800000, k = 19800000 / 60000 = 330 < 360 (age 420 - 330 = 90 steps = 90 min > 60 min), so no measurement lies in the window: the recency guard once[0, hold_lookback] m is max over the window of -inf = -inf. Value of the body: min(-inf, 120 - 100) = -inf, guard_failed no_recent_measurement. sigma_norm = clip(-inf / 20, -1, 1) = -1. sigma < 0: violated. The bp value of the 05:30 sample (120, a fixture choice) does not affect the result."

- id: G-RESP-1
  contract: ["02-interfaces.md#template"]
  source: "plan fixture (analisi §4.6 window [08:00, 10:00])"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
    template: resp
    anchor_ms: 25200000
    anchor_kind: dispense
    samples:
      - {signal: bp, t_device_ms: 24900000, t_rx_ms: 24900000, value: 150.0, seq: null, quality: null}   # 06:55 pre-dose bp 150
      - {signal: bp, t_device_ms: 30600000, t_rx_ms: 30600000, value: 132.0, seq: null, quality: null}   # 08:30 bp 132
    events:
      - {kind: measurement, t_device_ms: 24900000, t_rx_ms: 24900000, source: cuff, payload: {}, seq: null}   # 06:55 pre-dose measurement event
      - {kind: dispense, t_device_ms: 25200000, t_rx_ms: 25200000, source: dispenser, payload: {}, seq: null}   # 07:00 dispense
      - {kind: measurement, t_device_ms: 30600000, t_rx_ms: 30600000, source: cuff, payload: {}, seq: null}   # 08:30 measurement event
  eval_at_ms: 36000000   # 10:00 decision step k_d = 600
  expected: {sigma_raw: 8.0, unit: mmHg, sigma_norm: 0.4, boolean: satisfied}
  hand_calculation: "Dispense 25200000 (07:00): k_a = 420. The latest bp sample with device time <= 25200000 is the 06:55 sample (24900000), so pre_i = 150. Decision step k_d = k_a + 10800000 / 60000 = 420 + 180 = 600 (36000000, 10:00), where 10800000 is delta2. Window length: delta2 - delta1 = 10800000 - 3600000 = 7200000 ms and 7200000 / 60000 = 120 steps, so the window is [600 - 120, 600] = [480, 600] = [08:00, 10:00]. Measurement 30600000: k = 510, inside [480, 600]; bp_510 = 132; drop r = 150 - 132 = 18 mmHg. Margin: r - delta_resp = 18 - 10 = 8 mmHg. sigma_norm = clip(8 / 20, -1, 1) = 0.4. sigma >= 0: satisfied."

- id: G-RESP-2
  contract: ["02-interfaces.md#template"]
  source: "plan fixture"
  fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
  inputs:
