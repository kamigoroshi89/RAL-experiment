      sigma_norm_interval: [0.5, 1.0]
      rho: null
      decided_at_ms: 81300000
      pending_until_ms: 86400000
    hand_calculation: "Step 1355 is in the window [1320, 1440]. Drop = pre_i - bp = 152 - 132 = 20 mmHg; margin 20 - 10 = +10 mmHg, so lo = 10 > 0: SATISFIED at 22:35, before the deadline. hi = max(10, 152 - 50 - 10) = 92 because k < k_d (a lower pressure may still come). 10 / 20 = 0.5; 92 / 20 = 4.6 clipped to 1.0."
