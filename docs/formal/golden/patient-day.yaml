# ---------------------------------------------------------------------------------------------------------------------------
# Verdict records at the decision instants (and at the instants that matter). 32 records, chronological.
records:
  # ------------------------------------------------------------------ R1  06:52 measurement bp 138, inflation 45000, healthy cuff
  - id: PD-REC-01
    contract: ["02-interfaces.md#verdict"]
    source: "R1, SCHED instance of the 06:50 tick"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
    instance_key: "sched@24600000"
    eval_at_ms: 24720000   # 06:52, step 412
    expected:
      template: sched
      unit: ms
      t_eval_ms: 24720000
      state: satisfied
      sigma_interval: [1680000.0, 1680000.0]
      sigma_norm_interval: [0.9333333333333333, 0.9333333333333333]
      rho: null
      decided_at_ms: 24720000
      pending_until_ms: 26400000   # 07:20
    hand_calculation: "Tick 24600000 = (6*60+50)*60000, k_a = 410; w = 1800000/60000 = 30, k_d = 440, t_d = 26400000 (07:20). The measurement at 24720000 is visible at step 24720000/60000 = 412, in [410, 440]. Slack = (440 - 412) * 60000 = 28 * 60000 = 1680000 ms. Any later measurement has slack <= 27 * 60000 = 1620000 < 1680000, so hi = 1680000 too: the interval is the point. lo > 0: SATISFIED at 412. Normalised 1680000 / 1800000 = 0.9333."
  - id: PD-REC-02
    contract: ["02-interfaces.md#verdict"]
    source: "R1, RANGE instance of the 06:52 measurement"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
    instance_key: "range@24720000"
    eval_at_ms: 24720000
    expected:
      template: range
      unit: mmHg
      t_eval_ms: 24720000
      state: satisfied
      sigma_interval: [2.0, 2.0]
      sigma_norm_interval: [0.1, 0.1]
      rho: null
      decided_at_ms: 24720000
      pending_until_ms: 24720000
    hand_calculation: "bp_412 = 138. min(138 - 110, 140 - 138) = min(28, 2) = 2 mmHg (distance to the nearer limit). 2 / 20 = 0.1. The band applies at every measurement, including a measurement inside the onset window of the drug (a question for the clinician review, TG-13)."
  - id: PD-REC-03
    contract: ["02-interfaces.md#verdict"]
