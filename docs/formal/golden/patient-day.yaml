hypotheses:
  - {id: H-W1, text: "Inputs arrive on time: t_rx_ms equals t_device_ms, reorder_delay_ms is 0, no late input, no future stamp, no jitter."}
  - {id: H-W2, text: "The plan passes the feasibility checks F1 to F7 of 02-templates.md section 5.4, with F4 read as: a robot visit overlaps the INT window and observes the patient inside it (the INT predicate needs one witness whose age is at most int_window, 02-templates.md section 4.7). The literal wording of F4, a visit that covers [a - int_window, a], is stricter and is not met for the 07:00 dose (the visit starts at 06:58, the window at 06:55): NP-24 of 08-consistency-review.md."}
  - {id: H-W3, text: "First day of the patient: no dispense in the 24 h before 00:00 (empty history, H-hist of 05 section 2.1; 01 section 5.5)."}
  - {id: H-W4, text: "At most one measurement event and one sample of each of bp, cuff_health, inflation_ms per grid bin (A0), and each measurement event carries its own samples (H-pair); no standalone pressure sample."}
  - {id: H-W5, text: "The doses of 21:00 and 21:02 overlap in their response windows; both capture pre_i = 152 (the sample of 20:32), so the global bp_pre stream and the per-instance value agree (A3 of 02-templates.md section 1.5 holds in value)."}
  - {id: H-W6, text: "Authenticated deployment with every device capability declared: message authentication, seq, diagnostics, a data-stream deadline, independent clocks, signal quality, pulse and ECG heart rate available and coherent at every measurement; the dispenser has no content sensing and reports no interval (CP8). With the reference profile S6 of evidence-channels.md the kappa C1 of record PD-ALT-04 would be UNDETERMINED (OP-AR-1)."}
  - {id: H-W7, text: "The evidence window of the 12:24 instance does not reach the cuff outage of 08:56 to 11:20 (evidence_margin_ms is smaller than 64 min); the cuff keeps its sequence counter across the restart; evidence_grace_ms is 0. evidence_margin_ms and evidence_grace_ms are parameter names requested by evidence-channels.md that have no registry entry (OPF-6)."}
  - {id: H-W8, text: "The robot is co-located from 06:58 to 07:05 only; the presence stream is sampled as in golden G-INT-1 (1.0 at 06:58, an explicit 0.0 at 06:59), so the witness age at 07:00 is 2 min; the robot channels presence and intake are unavailable at all other times."}
  - {id: H-W9, text: "The 20:32 sample is an informed replay (threat-model.md class replay, level informed, fresh_metadata): t_device_ms fresh, seq continues (no repeat, no gap), the verification of the message fails; the genuine 20:32 message does not reach the gateway (H-SUPP). By the rule of 01-signals-sampling.md section 3.4 and of the table of repeated seq of threat-model.md, a replay that repeated the seq of the 12:24 message would be a duplicate: flagged and not counted, so it could not produce the RANGE instance of the scenario row R6 (08-consistency-review.md NP-1, rule R8)."}
  - {id: H-W10, text: "Cuff health 1.0 and inflation 45000 ms at every measurement (fixture); hr_pulse and hr_ecg are not templates inputs and are not listed."}
  - {id: H-W11, text: "Prediction: one designated instant (20 min before the deadline, 12:10), variant likely, calibrator fixture C-1 (n 9, alpha 0.2, q 0.09); the forecast is a stub (arrival 12:40)."}
  - {id: H-W12, text: "Scales and priorities are the F0 rows (priority_count 2 and priority_resp 2 are FIXTURE-ONLY); the registry 0.2.0 values are not used."}
  - {id: H-W13, text: "Forecaster: prediction is evaluated only for a record that is PENDING at its designated instant (20 min before the deadline). sched@24600000, sched@73800000 and sched@81000000 are decided (06:52, 20:32, 22:35) before their instants (07:00, 20:40, 22:40), so no test occurs; at the instant of sched@32400000 (09:10) the record is PENDING and the forecaster emits nothing (the cuff is down and no arrival is forecast); only sched@43200000 (12:10) has a forecast, a stub with arrival 12:40."}
  - {id: H-W14, text: "Alpha allocation: alpha = 0.2 is the per-test level of the calibrator fixture C-1 (n = 9). With n = 9 the upper quantile is finite only for alpha >= 1/(n + 1) = 0.1 (conformal.yaml C-1: alpha 0.1 gives rank 9 and q = 0.15; alpha 0.05 gives rank 10 > n and q = +infinity, so no predicted alert could be emitted); a level of 0.05 would need n >= 19 (06 section 4.7, conformal.yaml C-5). With five SCHED tests in the day, AlphaAllocation.per_test(alpha_total, n_tests) = alpha_total / n_tests (06 section 6.2) would correspond to alpha_total = 5 * 0.2 = 1.0, a vacuous day-level bound; alpha_total is not stated by this fixture and the day makes no claim about the probability of a false predictive alert in a patient-day."}
  - {id: H-W15, text: "Evidence readings are given, not derived: the observed day has no NODE_STATE, liveliness, heartbeat, hr_ecg, hr_pulse, spo2 or error-code input; the readings under evidence are those of the worked cases W-01, W-06, W-08 and W-11 of attribution-rule.md. The golden supports tests of the monitor and of the attribution rule, not tests of the evidence extractor."}

