      state: satisfied
      sigma_interval: [8.0, 8.0]
      sigma_norm_interval: [0.4, 0.4]
      rho: null
      decided_at_ms: 81300000
      pending_until_ms: 81300000
    hand_calculation: "bp_1355 = 132. min(132 - 110, 140 - 132) = min(22, 8) = 8 mmHg. 8 / 20 = 0.4."
  - id: PD-REC-30
    contract: ["02-interfaces.md#verdict"]
