# Golden hand-worked patient-day (WS01-T08). One scenario, F0 fixture registry, step_ms 60000, reorder_delay_ms 0.
# Normative description: docs/formal/09-worked-patient-day.md (sections 1 to 4). Consistency review: docs/formal/08-consistency-review.md.
#
# FIXTURE-ONLY: every number below is fixture arithmetic (fixture registry F0 of the WS01 README, NOT the clinical registry,
# never to be copied into configs/registry/hypertension.yaml) or an analisi example labelled "illustrative, unverified"
# (analisi §4.1, §4.2, §4.6, §4.7; ADR-020). Nothing here is a clinical statement and nothing is clinically validated. The
# registry 0.2.0 values (WS01-T09) are NOT used by this day; the F0 rows used are listed under `f0_rows`.
#
# Shape. The README format is a YAML list of cases; a patient-day is one scenario with shared inputs, so this file is a mapping
# whose sections `records` and `alerts` are lists of cases in the README case format (id, contract, source, fixture, eval_at_ms,
# expected, hand_calculation). Times are integer milliseconds since 00:00 of the day (t_ms = (60 * hh + mm) * 60000); the hh:mm
# label is in a comment. Infinite values are written -.inf and .inf. `null` means "not applicable" or "channel unavailable",
# never a negative observation. Raw intervals are in the unit of the template (mmHg, ms, dose); normalised intervals use the F0
# scale of the template with clip(x / s, -1, 1) and +-inf mapped to +-1 (WS01-T04). A record is rec(i, k) of one instance at one
# finalised step k = eval_at_ms / 60000 (WS01-T05 section 3.1).
#
# What the monitor sees is `observed_day` and `plan`. `scenario_description` says what happened in the scenario, for the reader and for
# scoring tests; it is NOT an input of the monitor and no detector reads it (ground-truth discipline). `evidence` holds the readings
# of the evidence vector per violated instance, taken from the worked cases of docs/models/attribution-rule.md (W-01, W-06, W-08, W-11)
# under hypothesis H-W6; every field not listed is null (unavailable). `xi.text` of an alert is rendered by WS05-T07 from the fields
# (docs/formal/07-alert-tuple-mapping.md section 3.4) and is not fixed here: `text_must_contain` lists what the text must state.
#
# Limits for an end-to-end test (WS05-T08, WS02-T04). (1) The golden supports tests of the monitor (trace to VerdictRecord) and of the
# attribution rule (evidence vector to kappa); it does not support tests of the evidence extractor (trace to evidence vector): the
# observed day has no NODE_STATE, liveliness, heartbeat, hr_ecg, hr_pulse, spo2 or error-code input, and the readings under `evidence` are
# given (hypothesis H-W15). (2) `Rho.guarantee` and `Rho.assumptions` are the exact strings of docs/formal/06-rho-proposition1.md section 2.2
# (conformal.yaml repeats the PREDICTED strings in C-2 and the DETERMINISTIC strings in C-7; its C-6 gives MEASURED values only, so the
# MEASURED strings come from doc 06 alone), with `alpha` the configured level for PREDICTED and null otherwise. (3) `xi.text` is rendered by
# WS05-T07 and is not fixed: `text_must_contain` lists what it must state; `xi.subformula_path` is a description, not the final syntax of
# WS05-T04 step 8. (4) The names evidence_grace_ms, evidence_margin_ms, ecg_sqi_floor, ppg_sqi_floor and hr_coherence_tolerance are requested
# by evidence-channels.md and have no registry entry and no F0 row (OPF-6): the day uses evidence_grace_ms = 0 as a fixture value outside
# the F0 table and gives the three float thresholds only by their relation to the reading.
#
# Keys added to the README format: hypotheses, plan, observed_day.channels_unavailable, scenario_description, calibrator, forecast,
# evidence, records[*].instance_key, records[*].expected.{template, unit, guard_failed, marker, tie_rule, previous_state,
# false_predictive_alarm, refinement_note}, alerts, ranking, coverage.
#
# Row tags R1 to R10 are those of the scenario table of WS01-T08. R11 (measurement-count obligation) is omitted: WS01-T02 did not adopt
# one (02-templates.md section 4.4, CP2).

