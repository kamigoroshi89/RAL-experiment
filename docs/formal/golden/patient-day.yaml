    hand_calculation: "pre_i = 152. k_a = 1262, k_d = 1262 + 180 = 1442 > K = 1440, t_d = 75720000 + 10800000 = 86520000. Window [1322, 1442] = [22:02, 24:02]. lo = -inf; hi = 152 - 50 - 10 = 92. It cannot be VIOLATED at 21:02: that needs pre_i < bound_bp_lower + delta_resp = 60 (05 Lemma 12), and 152 >= 60. The same holds for the instance of 21:00, whose window opens at 22:00 (analisi §4.6 row 21:02, error b)."
  - id: PD-REC-27
    contract: ["02-interfaces.md#verdict"]
    source: "R8, COUNT day-end instance: early satisfaction by the extra dispense"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
    instance_key: "count@86400000"
    eval_at_ms: 75720000
    expected:
      template: count
      unit: dose
      t_eval_ms: 75720000
      state: satisfied
      sigma_interval: [1.0, .inf]
      sigma_norm_interval: [1.0, 1.0]
      rho: null
      decided_at_ms: 75720000
      pending_until_ms: 86400000
    hand_calculation: "Known dispenses of steps 1..1262: 3. lo = 3 - 2 = +1 > 0, so SATISFIED at once (05 Lemma 12: the first step with c_today > dose_min_day_end); hi stays +inf. Normalised (1/1 = 1.0, +inf maps to 1.0). Reported, not hidden: the unscheduled dose that violates the 24 h limit also satisfies the day-end minimum."
  # ------------------------------------------------------------------ R9  22:30 tick, 22:35 measurement bp 132
  - id: PD-REC-28
    contract: ["02-interfaces.md#verdict"]
    source: "R9, SCHED instance of the 22:30 tick"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
    instance_key: "sched@81000000"
    eval_at_ms: 81300000   # 22:35, step 1355
    expected:
      template: sched
      unit: ms
      t_eval_ms: 81300000
      state: satisfied
      sigma_interval: [1500000.0, 1500000.0]
      sigma_norm_interval: [0.8333333333333334, 0.8333333333333334]
      rho: null
      decided_at_ms: 81300000
      pending_until_ms: 82800000   # 23:00
    hand_calculation: "Tick 81000000 = 1350 * 60000, k_a = 1350, k_d = 1380, t_d = 82800000. Measurement at step 1355. Slack (1380 - 1355) * 60000 = 25 * 60000 = 1500000 ms; later measurements have slack <= 24 * 60000 = 1440000, so a point. 1500000 / 1800000 = 0.8333."
  - id: PD-REC-29
    contract: ["02-interfaces.md#verdict"]
    source: "R9, RANGE instance of the 22:35 measurement"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
    instance_key: "range@81300000"
    eval_at_ms: 81300000
    expected:
      template: range
      unit: mmHg
