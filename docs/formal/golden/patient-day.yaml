    hand_calculation: "45000 - 30000 = 15000 ms; 15000 / 30000 = 0.5."
  - id: PD-REC-31
    contract: ["02-interfaces.md#verdict"]
    source: "R9, RESP instance of the 21:00 dispense, early satisfaction"
    fixture: {registry: F0, step_ms: 60000, reorder_delay_ms: 0}
