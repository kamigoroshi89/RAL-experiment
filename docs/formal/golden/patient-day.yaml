# ---------------------------------------------------------------------------------------------------------------------------
# Alerts: the tuple <tau, kappa, sigma_tilde, rho, xi> and the other seven fields (07 section 1). `issues` lists the values issued in time
# order; the last one is the value in the current set. Alerts are built from the first VIOLATED record (or the PREDICTED_VIOLATION record).
alerts:
  - id: PD-ALT-01
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R3, root of the cascade"
    from_record: PD-REC-09
    instance_key: "sched@32400000"
    expected:
      t_ms: 34200000
      label: C2
      score: 0.03333333333333333
      tau: sched
      kappa: C2
      sigma_norm: -0.03333333333333333
      rho: {kind: deterministic, value: 1.0, alpha: null, guarantee: "conditional on the integrity of the event log", assumptions: ["the predicate is evaluated on the accepted event log or timestamps without error", "authenticity of the events is attributed by kappa and is not covered by rho"]}
      xi:
        template: sched
        instance_key: "sched@32400000"
        subformula_path: "sched/consequent/once[0, sched_window]/meas (guard no_measurement_after_tick)"
        param_values: {sched_window: 1800000.0}
        evidence_used: ["system.liveliness_ok"]
        text_must_contain: ["a blood pressure measurement within the allowed time after the scheduled time", "09:00", "09:30", "1800000 ms (30 minutes)", "system.liveliness_ok", "violated (definitive)", "system or embodiment failure", "0.03 of the registry scale (unreviewed)", "a later measurement counts as late by at least one monitor step", "follows from or accounts for 1 further violation (re-issue)"]
      verdict: violated
      priority: 3
      root_cause_of: ["resp@25200000"]
      caused_by: null
    issues:
      - {at_ms: 34200000, root_cause_of: [], caused_by: null, note: "first issue at the decision of the record"}
      - {at_ms: 36000000, root_cause_of: ["resp@25200000"], caused_by: null, note: "re-issued when the effect is issued, only root_cause_of (and the count sentence derived from it) changes (07 section 1.4 item 3; attribution-rule.md cascade rules 7 and 8)"}
    hand_calculation: "sigma_norm = N_s(hi) of the first VIOLATED record = -60000 / 1800000 = -0.0333 (certified severity, frozen at emission, under H_i > k_d, 07 section 1.5). score = -sigma_norm = 0.0333. priority = priority_sched = 3. kappa: evidence W-11 root, system.liveliness_ok asserted (False), no integrity evidence: row 4, C2. t_ms = decided_at_ms = 34200000."
  - id: PD-ALT-02
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R4, cascade effect: not a top-level alert"
    from_record: PD-REC-10
    instance_key: "resp@25200000"
    expected:
      t_ms: 36000000
      label: C2
      score: 1.0
      tau: resp
      kappa: C2
      sigma_norm: -1.0
      rho: {kind: deterministic, value: 1.0, alpha: null, guarantee: "conditional on the integrity of the event log", assumptions: ["the predicate is evaluated on the accepted event log or timestamps without error", "authenticity of the events is attributed by kappa and is not covered by rho"]}
      xi:
        template: resp
        instance_key: "resp@25200000"
        subformula_path: "resp/consequent/once[0, delta2 - delta1]/(meas and bp_drop >= delta_resp) (guard obligation_unmet)"
        param_values: {delta1: 3600000.0, delta2: 10800000.0, delta_resp: 10.0}
        evidence_used: ["system.liveliness_ok"]
        text_must_contain: ["the prescribed blood pressure decrease, measured in the response window after a dose", "dispenser opened 07:00", "08:00", "10:00", "follows from the alert sched@32400000", "system or embodiment failure", "-1.00 of the registry scale (unreviewed)"]
      verdict: violated
      priority: 2
      root_cause_of: []
      caused_by: "sched@32400000"
    issues:
      - {at_ms: 36000000, root_cause_of: [], caused_by: "sched@32400000", note: "issued once with caused_by, kappa and evidence_used of its root already in place"}
    hand_calculation: "sigma_norm = N_s(-inf) = -1 (failed guard obligation_unmet, hi = -inf). priority = priority_resp = 2 (F0, FIXTURE-ONLY). Own evidence (W-11 resp@07:00): system.liveliness_ok False, so row 4 gives C2, the class of the root: the independent-evidence rule does not stop the fold. Cascade CT-1: the root interval [34200000 - 1800000, 34200000] = [09:00, 09:30] meets the response window [36000000 - (10800000 - 3600000), 36000000] = [08:00, 10:00]; the root is decided strictly earlier (34200000 < 36000000), its kappa is definite, and the decisive sub-formula of the effect is a failed guard. The effect keeps its own sigma_norm, rho, priority and time; kappa and evidence_used are the root's."
  - id: PD-ALT-03
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R5, early warning, closed by the measurement of 12:24"
    from_record: PD-REC-11
    instance_key: "sched@43200000"
    expected:
      t_ms: 43800000
      label: UNDETERMINED
      score: 0.2433333333333333
      tau: sched
      kappa: UNDETERMINED
      sigma_norm: -0.2433333333333333
      rho: {kind: predicted, value: 0.9, alpha: 0.2, guarantee: "marginal over patient episodes under exchangeability", assumptions: ["calibration unit is the patient episode; calibration and test episodes are exchangeable", "forecaster and normalisation are fixed before calibration and independent of the calibration and test episodes", "one designated prediction instant per episode, with the same rule for calibration and test episodes", "calibrator fitted on the current model version"]}
      xi:
        template: sched
        instance_key: "sched@43200000"
        subformula_path: "sched/consequent/once[0, sched_window]/meas (deadline margin age >= 0)"
        param_values: {sched_window: 1800000.0}
        evidence_used: []
        text_must_contain: ["early warning, not a definitive verdict", "variant likely", "conformal score with a guarantee that is marginal over patient episodes under exchangeability", "not the probability that the violation will occur", "no cause named"]
      verdict: predicted_violation
      priority: 3
      root_cause_of: []
      caused_by: null
    issues:
      - {at_ms: 43800000, root_cause_of: [], caused_by: null, note: "predicted alert issued at the prediction instant"}
    closed:
      at_ms: 44640000
      by: PD-REC-12
      false_predictive_alarm: true
      note: "T7: the instance ends SATISFIED. No new alert; the predicted alert leaves the current set and stays in the history (07 section 1.4 item 3). Alert has no closed state (OP-T07-5): the closure is carried by the VerdictRecord."
    hand_calculation: "sigma_norm = clip(sigma_hat + q, -1, 1) = -0.3333 + 0.09 = -0.2433 (07 section 1.5, 06 section 2.4). score = 0.2433. priority = priority_sched = 3. kappa = UNDETERMINED by definition (CP13, 07 section 1.7), evidence_used empty, rule not evaluated. rho PREDICTED 0.9 (m = 9, n = 9)."
  - id: PD-ALT-04
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R5, clinical deviation with every channel of the exclusion set available and denied"
    from_record: PD-REC-13
    instance_key: "range@44640000"
    expected:
      t_ms: 44640000
      label: C1
      score: 0.6
      tau: range
      kappa: C1
      sigma_norm: -0.6
      rho: {kind: measured, value: 0.97724986805, alpha: null, guarantee: "conditional on the adequacy of the declared device error model", assumptions: ["measured value equals the true value plus an independent Gaussian error with standard deviation cuff_error_sd", "zero bias after correction (a silent bias is not seen by rho)", "flat prior on the true value", "errors of distinct measurements are independent"]}
      xi:
        template: range
        instance_key: "range@44640000"
        subformula_path: "range/body/bp <= bp_band_high"
        param_values: {bp_band_low: 110.0, bp_band_high: 140.0}
        evidence_used: ["system.node_lifecycle", "system.diagnostics_ok", "system.liveliness_ok", "system.qos_deadline_missed", "system.ble_link_quality", "signal_quality.cuff_error_code", "cross_device.pulse_vs_ecg_hr_diff", "crypto_temporal.authenticated", "crypto_temporal.seq_gap_or_replay", "crypto_temporal.timestamp_implausible"]
        text_must_contain: ["the measured blood pressure inside the prescribed band", "152 mmHg", "above the prescribed upper limit of 140 mmHg", "12 mmHg beyond the limit", "0.60 of the registry scale of 20 mmHg (unreviewed)", "clinical or adherence deviation", "every channel required for the exclusion was available and showed no problem", "0.98", "conditional on the adequacy of the declared device error model"]
      verdict: violated
      priority: 2
      root_cause_of: []
      caused_by: null
    issues:
      - {at_ms: 44640000, root_cause_of: [], caused_by: null, note: "issued at the decision of the record"}
    hand_calculation: "sigma_norm = -12 / 20 = -0.6; score 0.6; priority_range = 2. kappa: no integrity evidence (authenticated True, seq False, timestamp False), no system evidence (liveliness True, diagnostics True, qos False, lifecycle active, ble 1.0, cuff_error_code empty, pulse coherent), exclusion set of range satisfied: row 5, C1 (W-01). rho 0.9772 (PD-REC-13)."
  - id: PD-ALT-05
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R6, integrity violation: the verification of the replayed message fails"
    from_record: PD-REC-16
    instance_key: "range@73920000"
    expected:
      t_ms: 73920000
      label: C3
      score: 0.6
      tau: range
      kappa: C3
      sigma_norm: -0.6
      rho: {kind: measured, value: 0.97724986805, alpha: null, guarantee: "conditional on the adequacy of the declared device error model", assumptions: ["measured value equals the true value plus an independent Gaussian error with standard deviation cuff_error_sd", "zero bias after correction (a silent bias is not seen by rho)", "flat prior on the true value", "errors of distinct measurements are independent"]}
      xi:
        template: range
        instance_key: "range@73920000"
        subformula_path: "range/body/bp <= bp_band_high"
        param_values: {bp_band_low: 110.0, bp_band_high: 140.0}
        evidence_used: ["crypto_temporal.authenticated"]
        text_must_contain: ["the measured blood pressure inside the prescribed band", "152 mmHg", "integrity or plausibility violation", "crypto_temporal.authenticated", "the authenticity of the events is not covered by the confidence value", "0.98"]
      verdict: violated
      priority: 2
      root_cause_of: []
      caused_by: null
    issues:
      - {at_ms: 73920000, root_cause_of: [], caused_by: null, note: "issued at the decision of the record"}
    hand_calculation: "Same sigma_norm and rho as PD-ALT-04 (the monitor cannot see the replay). kappa: crypto_temporal.authenticated asserted (False) = IE-1, row 1, C3, whatever the other fields say (integrity evidence is tested first); evidence_used lists that one field (W-08). The sequence evidence is not used: the informed replay keeps seq continuing (H-W9)."
  - id: PD-ALT-06
    contract: ["02-interfaces.md#alert", "02-interfaces.md#attribution"]
    source: "R8, counter violation by the unscheduled dispense; abstention"
    from_record: PD-REC-23
    instance_key: "count@75720000"
    expected:
      t_ms: 75720000
      label: UNDETERMINED
      score: 1.0
      tau: count
      kappa: UNDETERMINED
      sigma_norm: -1.0
      rho: {kind: deterministic, value: 1.0, alpha: null, guarantee: "conditional on the integrity of the event log", assumptions: ["the predicate is evaluated on the accepted event log or timestamps without error", "authenticity of the events is attributed by kappa and is not covered by rho"]}
      xi:
        template: count
        instance_key: "count@75720000"
        subformula_path: "count/limit/dose_count <= dose_max_24h"
        param_values: {dose_max_24h: 2.0}
        evidence_used: []
        text_must_contain: ["the number of doses dispensed in 24 hours within the prescribed limit", "dispenser opened at 21:02", "third opening within 24 hours (07:00, 21:00 and 21:02)", "limit is 2 doses", "exceeded by 1 dose", "1.00 of the registry scale of 1 dose (unreviewed)", "not determined", "no dispenser content evidence is available", "witness.robot_present and witness.intake_observed are unavailable, not denied"]
      verdict: violated
      priority: 2
      root_cause_of: []
      caused_by: null
    issues:
      - {at_ms: 75720000, root_cause_of: [], caused_by: null, note: "issued at the decision of the record"}
    hand_calculation: "sigma_norm = -1 / 1 = -1.0; score 1.0; priority_count = 2 (F0, FIXTURE-ONLY). kappa: count reads only cuff-independent dispenser-link fields; none is asserted, so rows 1 to 4 do not fire; count has no exclusion set that can be satisfied in contract 0.1.0 (AD-10, the dispenser content evidence has no field: CP8, ADR-032 proposed), no RS predicate holds, the kind is CARE_PLAN: row 8, UNDETERMINED, reason insufficient (W-06)."

# ---------------------------------------------------------------------------------------------------------------------------
ranking:
  key: "K0 = (priority ascending, sigma_norm ascending, t_ms ascending, instance_key ascending) (ADR-028)"
  current_set_after_cascade:      # alerts of violated records, folded effects included, the closed predicted alert excluded
    - {instance_key: "resp@25200000", priority: 2, sigma_norm: -1.0, t_ms: 36000000, caused_by: "sched@32400000"}
    - {instance_key: "count@75720000", priority: 2, sigma_norm: -1.0, t_ms: 75720000, caused_by: null}
    - {instance_key: "range@44640000", priority: 2, sigma_norm: -0.6, t_ms: 44640000, caused_by: null}
    - {instance_key: "range@73920000", priority: 2, sigma_norm: -0.6, t_ms: 73920000, caused_by: null}
    - {instance_key: "sched@32400000", priority: 3, sigma_norm: -0.03333333333333333, t_ms: 34200000, caused_by: null}
  top_level_order: ["count@75720000", "range@44640000", "range@73920000", "sched@32400000"]
  hand_calculation: "Priority first (ascending, 1 is the highest): priority 2 precedes priority 3, so the folded effect and the three top-level priority-2 alerts precede sched@32400000, whose sigma_norm -0.0333 is the least severe of the five but whose priority is the lowest. Inside priority 2, sigma_norm ascending: -1.0 (resp@25200000, count@75720000) before -0.6 (range@44640000, range@73920000). Ties on sigma_norm are broken by t_ms: 36000000 < 75720000 and 44640000 < 73920000. The top-level list drops the effect (caused_by is not null) and keeps the order of the other four."

