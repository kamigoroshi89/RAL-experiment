# Within-class subtype priors pi(subtype | class) for the subtype-level model (follow-up of 2026-10-11, section 9).
# RESEARCH PROTOTYPE. NO VALUE HERE IS A PROPOSAL: every weight is a relative SENSITIVITY value. For a class and a template the
# weights of the sub-causes (components) that can violate the template are normalised to sum to 1. A sub-cause that has two
# knowledge levels (replay, dispense_forgery, presence_spoof) is one subtype in the output set and two components here.
# Where the value would have to come from: ward incident statistics, device failure data, the threat model's attacker prevalence
# (none collected); until then a declared design choice, awaiting gab.
groups:
  quiet_c2: [stuck_at, cuff_silent_bias, dispenser_bounce]          # silent faults: raise no evidence field (fault-model coverage table)
  quiet_c3: [replay_informed, injection_informed, dispense_forgery_informed, presence_spoof_informed, dispenser_physical_tamper]
  quiet_c1: [spontaneous_range, spontaneous_resp, spontaneous_hold, spontaneous_count]   # C1 events with no injection behind them
designs:
  uniform:        {status: reference,    default: 1.0, weights: {quiet_c2: 1.0,  quiet_c3: 1.0,  quiet_c1: 1.0}}
  quiet_rare:     {status: illustrative, default: 1.0, weights: {quiet_c2: 0.25, quiet_c3: 0.25, quiet_c1: 0.25}}
  quiet_common:   {status: illustrative, default: 1.0, weights: {quiet_c2: 4.0,  quiet_c3: 4.0,  quiet_c1: 4.0}}
# cumulative probability of the output set (sensitivity values)
cumulative_levels: [0.8, 0.9, 0.95]
